  // ---------- Membaca file Excel/CSV (di perangkat, tanpa pustaka luar — juga tanpa sinyal) ----------
  function readExcel(file, lembar) { return M3.bacaTabel(file, lembar); }
  const isoDate = v => {
    if (v instanceof Date) return v.getFullYear() + '-' + pad(v.getMonth() + 1) + '-' + pad(v.getDate());
    const s = String(v || '').trim(); let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if (m) return m[3] + '-' + pad(m[2]) + '-' + pad(m[1]);
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : '';
  };

  // ---------- Impor peserta ----------
  async function vImpor(v) {
    setTitle('Impor peserta', 'Dari template Excel');
    v.innerHTML =
      acc('1 · Unduh template', 'Berisi daftar kelompok, kecamatan, dan desa terbaru', '<button class="btn block" id="i-t">Buat template Excel di Drive</button><button class="btn ghost block" id="i-csv">Unduh template CSV (tanpa sinyal)</button><div id="i-tl"></div>', { open: true }) +
      acc('2 · Pilih file yang sudah diisi', 'Format .xlsx atau .csv', '<label class="btn block" for="i-f">Pilih file</label><input type="file" id="i-f" accept=".xlsx,.csv,.txt" hidden><div id="i-fn" class="small muted"></div>', { open: true }) +
      '<div id="i-res"></div>';
    $('#i-t', v).onclick = async () => {
      busy('Membuat template…');
      try { const r = await api('templateImpor'); busy(false); $('#i-tl', v).innerHTML = '<a class="btn p block" href="' + esc(r.url) + '" target="_blank" rel="noopener">Buka ' + esc(r.name) + '</a><p class="small muted">Di Drive: Unduh, isi di Excel/Google Sheets, lalu pilih di langkah 2.</p>'; }
      catch (e) { fail(e); }
    };
    $('#i-csv', v).onclick = () => {
      const k0 = K()[0], kec0 = W().kecamatan[0] || '', ds0 = (W().desa[kec0] || [''])[0];
      const q = x => '"' + String(x).replace(/"/g, '""') + '"';
      const baris = [['NIK', 'Nama Lengkap', 'Kelompok', 'Kecamatan', 'Desa', 'Tanggal Entry', 'Bebas JP Mulai', 'Catatan'],
        ['3528011204650001', 'Contoh Nama', k0 ? k0.nama : '', kec0, ds0, '01/11/2026', '', 'CONTOH - baris 2 tidak diimpor']];
      const daftar = '\r\n\r\nKelompok yang dikenal: ' + K().map(k => k.nama).join(', ');
      M3.unduh(new Blob(['\uFEFF' + baris.map(r => r.map(q).join(';')).join('\r\n') + '\r\n'], { type: 'text/csv' }), 'Template_Impor_Peserta.csv');
      $('#i-tl', v).innerHTML = '<p class="small muted">Template CSV diunduh (pemisah titik koma). Isi mulai baris 3; nama kelompok, kecamatan, dan desa harus sama dengan daftar di aplikasi.' + esc(daftar) + '</p>';
    };
    $('#i-f', v).onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      $('#i-fn', v).textContent = file.name;
      busy('Membaca file…');
      try {
        const g = await readExcel(file, 'Isi Data');
        const head = (g[0] || []).map(h => String(h).trim().toLowerCase());
        const col = n => head.findIndex(h => h.indexOf(n) === 0);
        const c = { nik: col('nik'), nama: col('nama'), kel: col('kelompok'), kec: col('kecamatan'), desa: col('desa'), tgl: col('tanggal'), jp: col('bebas jp') };
        if (c.nik < 0 || c.nama < 0 || c.kel < 0) throw new Error('Kolom NIK, Nama Lengkap, dan Kelompok tidak ditemukan. Pakai template dari langkah 1.');
        const rows = g.slice(1).map((r, i) => ({ baris: i + 2, nik: String(r[c.nik] || '').replace(/\D/g, ''), nama: r[c.nama], kelompok: r[c.kel], kec: r[c.kec], desa: r[c.desa], tanggal: isoDate(r[c.tgl]), bebasJP: isoDate(r[c.jp]).slice(0, 7) }))
          .filter(r => !/CONTOH/i.test(String(g[r.baris - 1].join(' '))) && (r.nik || r.nama));
        const res = await api('imporPeserta', { rows, dryRun: true, fileName: file.name });
        busy(false);
        hasilImpor($('#i-res', v), res, rows, file.name);
      } catch (x) { fail(x); }
      e.target.value = '';
    };
  }
  function hasilImpor(el, r, rows, fileName) {
    const li = list => list.map(x => '<div class="row" style="cursor:default"><span class="small muted" style="width:62px">Baris ' + x.baris + '</span><span class="m small" style="white-space:normal">' + esc(x.msg || (x.nama + ' · ' + x.kel + ' ' + x.desa)) + '</span></div>').join('');
    el.innerHTML = acc('3 · Periksa', r.siap + ' siap · ' + (r.errors.length + r.sudah.length) + ' perlu perhatian',
      '<div class="kpis"><div class="kpi"><div class="l">Siap</div><div class="v" style="color:var(--ok)">' + r.siap + '</div></div><div class="kpi"><div class="l">Salah isi</div><div class="v" style="color:var(--danger)">' + r.errors.length + '</div></div><div class="kpi"><div class="l">Sudah aktif</div><div class="v" style="color:var(--warn)">' + r.sudah.length + '</div></div></div>' +
      (r.errors.length ? acc('Salah isi', r.errors.length + ' baris', li(r.errors), { cls: 'flush', open: true }) : '') +
      (r.sudah.length ? acc('Sudah aktif', r.sudah.length + ' baris', li(r.sudah), { cls: 'flush' }) : '') +
      (r.contoh.length ? acc('Contoh baris siap', '', li(r.contoh), { cls: 'flush' }) : '') +
      (r.siap ? '<p class="small muted">Baris bermasalah dilewati. Perbaiki di file lalu impor ulang.</p><button class="btn p block" id="i-go">Simpan ' + r.siap + ' peserta</button>' : '<div class="note err">Tidak ada baris yang siap.</div>'), { open: true });
    const b = $('#i-go', el);
    if (b) b.onclick = async () => {
      if (r.siap > 20 && !await confirmBox({ title: 'Simpan ' + r.siap + ' peserta?', body: '<p>Semua bisa dibatalkan sekaligus lewat Riwayat aktivitas.</p>', ok: 'Simpan' })) return;
      const res = await write('imporPeserta', [{ rows, fileName }], 'Menyimpan ' + r.siap + ' peserta…');
      if (res) el.innerHTML = '<div class="note ok">' + esc(res.message) + '</div>';
    };
  }

  // ---------- Riwayat ----------
  async function vRiwayat(v) {
    setTitle('Riwayat aktivitas', 'Batalkan sampai 30 hari');
    const r = await api('riwayat', { limit: 150 });
    const day = iso => { const d = new Date(iso), t = new Date(); const k = d.toDateString(); if (k === t.toDateString()) return 'Hari ini'; t.setDate(t.getDate() - 1); if (k === t.toDateString()) return 'Kemarin'; return d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear(); };
    const groups = [];
    r.items.forEach(l => { const k = day(l.waktu); let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k, items: [] }); g.items.push(l); });
    v.innerHTML = groups.map((g, i) => acc(g.k, g.items.length + ' aktivitas · ' + g.items.filter(l => l.bisa).length + ' bisa dibatalkan',
      g.items.map(l => '<div class="row" style="cursor:default;align-items:flex-start"><span class="small muted num" style="width:40px;padding-top:2px">' + waktuID(l.waktu).split(', ')[1] + '</span><span class="m"><span class="t1" style="display:block;white-space:normal">' + esc(l.aksi) + (l.status !== 'Aktif' ? ' <span class="b">dibatalkan</span>' : '') + '</span><span class="small muted" style="display:block">' + esc(l.ket) + '</span><span class="small muted">' + esc(l.user) + '</span></span>' + (l.bisa ? '<button class="btn sm" data-u="' + esc(l.id) + '">Batalkan</button>' : '') + '</div>').join(''),
      { open: i === 0, cls: 'flush' })).join('') || '<div class="empty">Belum ada aktivitas.</div>';
    $$('[data-u]', v).forEach(b => b.onclick = async () => {
      const l = r.items.find(x => x.id === b.dataset.u);
      if (!await confirmBox({ title: 'Batalkan "' + l.aksi + '"?', body: '<p>' + esc(l.ket) + '</p><p class="small muted">Data dikembalikan seperti sebelum aktivitas ini. Pembatalan juga tercatat di riwayat.</p>', ok: 'Batalkan', danger: true })) return;
      busy('Membatalkan…');
      try { const res = await api('batalkan', l.id); busy(false); S.boot = null; toast(res.message); render(); } catch (e) { fail(e); }
    });
  }

        '<tr class="jml"><td></td><td class="kiri">Jumlah ' + esc(k.nama) + '</td><td>' + n(k.n) + '</td><td>' + n(k.prog['2P']) + '</td><td>' + n(k.prog['3P']) + '</td><td>' + n(k.prog['4P']) + '</td>' +

  // =====================================================================
  //  DASBOR (komputer: layar utama · HP: menu ⋮)
  // =====================================================================
  function svgTren(D) {
    const t = D.tren, W2 = 640, H = 220, x0 = 46, x1 = W2 - 14, y0 = 16, y1 = H - 34;
    const mxA = Math.max(1, ...t.map(x => x.aktif)), mnA = Math.min(...t.map(x => x.aktif));
    const lo = Math.max(0, Math.floor((mnA - (mxA - mnA) * 0.25) / 10) * 10), hi = Math.ceil((mxA + (mxA - lo) * 0.1 + 1) / 10) * 10;
    const mxB = Math.max(1, ...t.map(x => Math.max(x.masuk, x.keluar)));
    const X = i => x0 + (i + 0.5) * (x1 - x0) / t.length, Y = v => y1 - (v - lo) / Math.max(1, hi - lo) * (y1 - y0);
    const bw = (x1 - x0) / t.length * 0.28, hB = 46;
    let g = '';
    [0, 0.5, 1].forEach(f => { const v = Math.round(lo + (hi - lo) * f); g += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + Y(v) + '" y2="' + Y(v) + '" class="grid"/><text x="' + (x0 - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" class="ax">' + num(v) + '</text>'; });
    t.forEach((x, i) => {
      const [yy, mm] = x.ym.split('-');
      g += '<text x="' + X(i) + '" y="' + (y1 + 18) + '" text-anchor="middle" class="ax">' + BLN[Number(mm) - 1] + (mm === '01' || i === 0 ? ' ' + yy.slice(2) : '') + '</text>';
      const hm = x.masuk / mxB * hB, hk = x.keluar / mxB * hB;
      if (x.masuk) g += '<rect x="' + (X(i) - bw - 1) + '" y="' + (y1 - hm) + '" width="' + bw + '" height="' + hm + '" class="b-masuk"><title>' + blnID(x.ym) + ' · masuk ' + x.masuk + '</title></rect>';
      if (x.keluar) g += '<rect x="' + (X(i) + 1) + '" y="' + (y1 - hk) + '" width="' + bw + '" height="' + hk + '" class="b-keluar"><title>' + blnID(x.ym) + ' · keluar ' + x.keluar + '</title></rect>';
    });
    g += '<polyline points="' + t.map((x, i) => X(i).toFixed(1) + ',' + Y(x.aktif).toFixed(1)).join(' ') + '" class="ln-aktif"/>';
    t.forEach((x, i) => { g += '<circle cx="' + X(i) + '" cy="' + Y(x.aktif) + '" r="' + (i === t.length - 1 ? 5 : 3) + '" class="pt-aktif"><title>' + blnID(x.ym) + ' · ' + num(x.aktif) + ' peserta ditagih</title></circle>'; });
    const a = t[t.length - 1];
    g += '<text x="' + (X(t.length - 1) - 8) + '" y="' + (Y(a.aktif) - 10) + '" text-anchor="end" class="lbl">' + num(a.aktif) + '</text>';
    return '<svg viewBox="0 0 ' + W2 + ' ' + H + '" class="grafik" role="img" aria-label="Tren peserta ditagih 12 bulan, dengan peserta masuk dan keluar per bulan">' + g + '</svg>';
  }

    const kecUrut = D.kecamatan.slice().sort((a, b2) => b2.desaKosong - a.desaKosong || a.n - b2.n);
    const kec = kecUrut.length ? '<div class="scroll-x"><table class="tbl tbl-d"><tr><th>Kecamatan</th><th>Peserta</th><th>Desa</th><th>Desa kosong</th><th>' + (kecUrut.some(k => k.target) ? 'Cakupan' : '') + '</th></tr>' +
      kecUrut.map(k => '<tr data-lap="1"><td>' + esc(k.nama) + '</td><td><b>' + num(k.n) + '</b></td><td>' + k.desa + '</td><td style="' + (k.desaKosong ? 'color:var(--danger);font-weight:700' : '') + '">' + k.desaKosong + '</td><td>' + (k.target ? pct(k.n / k.target * 100) : '') + '</td></tr>').join('') + '</table></div>'
      : '<div class="empty">Daftar kecamatan/desa (sheet dropdown) belum ada.</div>';
    const per = (b.perhatian || []).map(p => '<button class="row" data-aksi="' + esc(p.aksi) + '"><span class="m" style="white-space:normal">' + esc(p.teks) + '</span><span class="chev"></span></button>').join('');
    const akt = D.aktivitas.map(l => '<div class="row" style="cursor:default;align-items:flex-start"><span class="m"><span class="t1" style="display:block;white-space:normal">' + esc(l.aksi) + (l.status !== 'Aktif' ? ' <span class="b">dibatalkan</span>' : '') + '</span><span class="t2" style="display:block;white-space:normal">' + esc(l.ket) + '</span></span><span class="small muted" style="flex-shrink:0">' + waktuID(l.waktu) + '</span></div>').join('');
    const ibr = D.ibr && D.ibr.lastImport ? waktuID(D.ibr.lastImport.at) : 'belum pernah lewat aplikasi';
    v.innerHTML =
      (st.data && !st.pin ? '<div class="note warn">Data NIK peserta tersimpan di perangkat ini tanpa PIN. <button class="link" data-ke="data">Pasang PIN</button></div>' : '') +
      '<div class="kpis kpis-d">' +
      kotakKpi('Peserta ditagih ' + bln, num(D.ditagih), num(D.kab.desa - D.kab.desaKosong) + ' dari ' + num(D.kab.desa) + ' desa', ' data-ke="peserta"', 'hero') +
      kotakKpi('Masuk ' + bln, num(D.nMasuk), 'peserta baru', ' data-dl="masuk"') +
      kotakKpi('Keluar ' + bln, num(D.nKeluar), 'dinonaktifkan', ' data-dl="keluar"') +
      kotakKpi('Iuran ' + bln, rp(D.iuran.net), 'setelah keringanan', ' data-ke="tagihan"') +
      kotakKpi('Perkiraan tagihan', rp(D.iuran.perkiraan), 'iuran − saldo IJT', ' data-ke="tagihan"') + '</div>' +
      '<div class="grid2">' +
      kartuD('Peserta 12 bulan', 'garis = peserta ditagih tiap akhir bulan · batang = masuk / keluar', svgTren(D) +
        '<div class="legenda"><span><i style="background:var(--brand)"></i>Peserta ditagih</span><span><i style="background:var(--ok)"></i>Masuk</span><span><i style="background:var(--danger)"></i>Keluar</span></div>') +
      kartuD('Per kelompok', num(tot) + ' TK ditagih · iuran ' + bln + ' · ketuk untuk daftar peserta', '<div class="bars-k">' + kel + '</div>') + '</div>' +
      '<div class="grid2">' +
      kartuD('Program & iuran', bln, prog) +
      kartuD('Perlu perhatian', (b.perhatian || []).length + ' hal', per ? '<div class="flush-list">' + per + '</div>' : '<div class="empty">Tidak ada. Semua lengkap.</div>') + '</div>' +
      '<div class="grid2">' +
      kartuD('Cakupan per kecamatan', 'desa tanpa peserta terbanyak di atas · ketuk untuk laporan', kec, '<button class="btn sm" data-ke="laporan">Laporan</button>') +
      kartuD('Aktivitas terakhir', 'Tagihan terakhir: ' + (D.tagihanTerakhir ? esc(D.tagihanTerakhir.ket.split(' · ')[0]) + ' · ' + waktuID(D.tagihanTerakhir.waktu) : 'belum ada') + ' · IBR: ' + ibr,
        akt ? '<div class="flush-list">' + akt + '</div>' : '<div class="empty">Belum ada aktivitas.</div>', '<button class="btn sm" data-ke="riwayat">Riwayat</button>') + '</div>';
    $$('[data-ke]', v).forEach(el => el.onclick = () => { const k = el.dataset.ke; if (k === 'peserta' || k === 'tagihan') tab(k); else go(k); });
    $$('[data-dl]', v).forEach(el => el.onclick = () => daftarPeserta(el.dataset.dl === 'masuk' ? 'Masuk ' + bln : 'Keluar ' + bln, el.dataset.dl === 'masuk' ? D.masuk : D.keluar));
    $$('[data-kel]', v).forEach(el => el.onclick = () => { const f = LS.get('pf', {}); LS.set('pf', Object.assign(f, { status: 'Aktif', kel: el.dataset.kel, kec: '', desa: '', bebasJP: false })); tab('peserta'); });
    $$('[data-lap]', v).forEach(el => el.onclick = () => go('laporan'));
    $$('[data-aksi]', v).forEach(el => el.onclick = () => {
      const a = el.dataset.aksi;
      if (a === 'npp-bpu') go('npp', { bpuTanpaKode: true });
      else go(a === 'npp' ? 'npp' : a === 'kelompok' ? 'kelompok' : a === 'keringanan' ? 'keringanan' : 'bebasjp', a === 'npp' ? { tanpaNpp: true } : {});
    });
  }

  // =====================================================================
  //  DATA & SINKRON (spreadsheet, PIN, cadangan, perangkat)
  // =====================================================================
  function teksSinkron(st) {
    if (!st.aktif) return 'Belum tersambung ke spreadsheet';
    if (st.berjalan) return 'Menyinkronkan…';
    return (st.galat ? 'Tertunda: ' + st.galat : 'Sinkron ' + (st.terakhir ? (st.terakhir.slice(0, 10) === today() ? 'pukul ' + st.terakhir.slice(11) : tglID(st.terakhir.slice(0, 10)) + ' ' + st.terakhir.slice(11)) : '–')) +
      (st.antre ? ' · ' + st.antre + ' perubahan belum terkirim' : '');
  }
  async function vData(v) {
    const st = M3.status();
    setTitle('Data & sinkron', 'Data tersimpan di perangkat ini' + (st.aktif ? ' dan spreadsheet MyTagihan Anda' : ''));
    const info = M3.infoPerangkat();
    const db = info.sheet.find(x => x.nama === 'Database');
    v.innerHTML =
      (st.aktif
        ? acc('Sinkron ke spreadsheet', '<span data-st-teks>' + esc(teksSinkron(st)) + '</span>',
          '<dl class="kv"><dt>Spreadsheet</dt><dd>' + esc(st.nama || '–') + '</dd><dt>Akun</dt><dd>' + esc(st.pengguna || '–') + '</dd><dt>Mesin di spreadsheet</dt><dd>' + esc(st.versiServer || '–') + '</dd><dt>Belum terkirim</dt><dd>' + st.antre + ' perubahan</dd></dl>' +
          (st.gagal.length ? '<div class="note err"><b>Ditolak spreadsheet</b> (data sudah diubah dari tempat lain; perangkat memakai isi spreadsheet):' + st.gagal.map(x => '<div class="small">' + esc(x.waktu) + ' · ' + esc(x.fn) + ': ' + esc(x.galat) + '</div>').join('') + '</div>' : '') +
          '<button class="btn p block" id="d-sync"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg>Sinkron sekarang</button>' +
          '<div class="btns"><button class="btn" id="d-kode">Salin kode sambung</button>' + (st.urlSheet ? '<a class="btn" href="' + esc(st.urlSheet) + '" target="_blank" rel="noopener">Buka spreadsheet</a>' : '<span></span>') + '</div>' +
          '<button class="btn ghost" id="d-putus" style="color:var(--danger)">Putuskan di perangkat ini</button>' +
          '<p class="small muted" style="margin:0">Otomatis saat aplikasi dibuka, tiap 5 menit, dan beberapa detik setelah setiap perubahan. Tanpa sinyal, perubahan tersimpan di perangkat lalu terkirim saat sinyal kembali (tidak tercatat dua kali). Kode sambung berisi kunci: kirim hanya ke perangkat Anda sendiri.</p>', { open: true })
        : acc('Sambungkan ke spreadsheet', 'agar HP, komputer, dan spreadsheet berisi data yang sama',
          '<div class="note info">Sekali saja di spreadsheet (laptop): menu <b>MyTagihan Desa › Aplikasi 3.0 › Siapkan sinkron & lihat kunci</b>, lalu <b>Terapkan › Deployment baru › Aplikasi web</b> (Jalankan sebagai: Saya · Akses: <b>Siapa saja</b>). Salin alamat /exec dan kuncinya ke sini.</div>' +
          '<div class="field"><label for="d-url">Alamat aplikasi web (…/exec)</label><input type="text" id="d-url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div>' +
          '<div class="field"><label for="d-kunci">Kunci sinkron</label><input type="text" id="d-kunci" autocomplete="off" style="-webkit-text-security:disc"></div>' +
          '<div class="sec" style="margin:2px 0 0">atau dari perangkat yang sudah tersambung</div>' +
          '<div class="field"><label for="d-kodeisi">Kode sambung</label><input type="text" id="d-kodeisi" placeholder="MT3.…" autocomplete="off"></div>' +
          '<button class="btn p block" id="d-sambung">Sambungkan</button>' +
          '<p class="small muted" style="margin:0">Saat tersambung, data di perangkat ini diganti dengan data spreadsheet (perubahan yang belum terkirim dikirim lebih dulu).</p>', { open: true })) +
      acc('PIN perangkat', st.pin ? 'Aktif · data tersandi AES-256' : '<span style="color:var(--danger)">Belum dipasang</span>',
        '<p class="small" style="margin:0">Dengan PIN, isi data (NIK, nama peserta, kunci sinkron) tersandi di perangkat dan terkunci lagi setelah 15 menit ditinggal. Lupa PIN = hapus data perangkat lalu sambungkan ulang; data di spreadsheet aman. <b>Sangat dianjurkan di HP.</b></p>' +
        (st.pin ? '<div class="btns"><button class="btn" id="d-pin">Ganti PIN</button><button class="btn" id="d-kunci-skrg">Kunci sekarang</button></div><button class="btn ghost" id="d-lepas" style="color:var(--danger)">Lepas PIN</button>'
          : '<button class="btn p block" id="d-pin">Pasang PIN</button>'), { open: !st.pin }) +
      acc('Pindahkan data tanpa sinkron', 'Dari unduhan spreadsheet (.xlsx)',
        '<p class="small muted" style="margin:0">Spreadsheet MyTagihan › File › Download › Microsoft Excel (.xlsx), lalu pilih file itu di sini. Hapus file unduhan sesudahnya (berisi NIK).</p><label class="btn block" for="d-xlsx">Pilih unduhan .xlsx</label><input type="file" id="d-xlsx" accept=".xlsx" hidden>') +
      acc('Cadangan', 'File .json berisi seluruh data perangkat ini' + (st.pin ? ' (terkunci PIN yang sama)' : ''),
        '<div class="btns"><button class="btn" id="d-unduh">Unduh cadangan</button><label class="btn" for="d-pulih">Pulihkan</label></div><input type="file" id="d-pulih" accept=".json,application/json" hidden>' +
        '<p class="small muted" style="margin:0">Kunci sinkron tidak ikut cadangan. Simpan di tempat aman: berisi data peserta.</p>') +
      acc('Perangkat ini', (st.simpan === 'idb' ? 'Tersimpan di perangkat' : 'Tidak bisa menyimpan') + (db ? ' · ' + num(db.baris) + ' baris Database' : ''),
        '<dl class="kv">' + info.sheet.map(x => '<dt>' + esc(x.nama) + '</dt><dd>' + num(x.baris) + ' baris</dd>').join('') + '</dl>' +
        (st.simpanGalat ? '<div class="note err">' + esc(st.simpanGalat) + '</div>' : '') +
        '<button class="btn ghost" id="d-hapus" style="color:var(--danger)">Hapus semua data di perangkat ini</button>');
    const on = (id, f) => { const el = $(id, v); if (el) el.onclick = f; };
    on('#d-sync', () => sinkronSekarang());
    on('#d-kode', async () => { const k = M3.kodeSambung(); try { await navigator.clipboard.writeText(k); toast('Kode sambung disalin. Tempel hanya di perangkat Anda sendiri (berisi kunci).'); } catch (e) { window.prompt('Salin kode sambung ini (berisi kunci):', k); } });
    on('#d-putus', async () => {
      const st2 = M3.status();
      if (!await confirmBox({ title: 'Putuskan sinkron di perangkat ini?', danger: true, ok: 'Putuskan', body: '<p>Data di perangkat tetap ada.' + (st2.antre ? ' <b>' + st2.antre + ' perubahan belum terkirim</b> ke spreadsheet dan tidak akan terkirim.' : '') + '</p>' })) return;
      await M3.putus(); toast('Sinkron diputus di perangkat ini.'); render();
    });
    on('#d-sambung', async () => {
      let url = $('#d-url', v).value.trim(), kunci = $('#d-kunci', v).value.trim();
      const kode = $('#d-kodeisi', v).value.trim();
      if (kode) { const o = M3.bacaKode(kode); if (!o) return toast('Kode sambung tidak dikenali.', 'err'); url = o.url; kunci = o.kunci; }
      busy('Menyambungkan…', 'Menarik seluruh data spreadsheet (10–60 detik).');
      try {
        const h = await M3.sambung(url, kunci);
        busy(false); S.boot = null;
        toast('Tersambung ke ' + (h.nama || 'spreadsheet') + ' (mesin ' + h.versi + ') · ' + h.hasil.tab + ' sheet dimuat.');
        if (!M3.status().pin && await confirmBox({ title: 'Pasang PIN sekarang?', body: '<p>Perangkat ini sekarang menyimpan NIK dan nama peserta. PIN menyandikan data dan mengunci aplikasi saat ditinggal.</p>', ok: 'Pasang PIN', cancel: 'Nanti' })) await pasangPinUI();
        render();
      } catch (e) { fail(e); }
    });
    on('#d-pin', () => pasangPinUI());
    on('#d-kunci-skrg', () => M3.kunciSekarang());
    on('#d-lepas', async () => {
      const pin = await M3.layarPin({ pesan: 'Masukkan PIN sekarang untuk melepas kunci.', tombol: 'Lepas PIN', batal: true, cek: M3.cobaPin });
      if (!pin) return;
      await M3.lepasPin(); toast('PIN dilepas. Data di perangkat ini tidak lagi tersandi.'); render(true);
    });
    on('#d-unduh', async () => { await M3.unduhCadangan(); toast('Cadangan diunduh. Simpan di tempat aman: berisi data peserta.'); });
    on('#d-hapus', async () => {
      if (!await confirmBox({ title: 'Hapus semua data di perangkat ini?', danger: true, ok: 'Hapus', body: '<p>Termasuk PIN dan sambungan sinkron. Spreadsheet MyTagihan tidak ikut terhapus.' + (M3.status().antre ? ' <b>' + M3.status().antre + ' perubahan belum terkirim akan hilang.</b>' : '') + '</p>' })) return;
      await M3.hapusSemua(); S.boot = null; S.tagihan = null; toast('Data di perangkat ini dihapus.'); render();
    });
    $('#d-xlsx', v).onchange = async e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      busy('Membaca ' + f.name + '…');
      try { const n = await M3.pindahXlsx(f); busy(false); S.boot = null; toast(n + ' sheet dipindah ke perangkat.'); render(); } catch (x) { fail(x); }
    };
    $('#d-pulih', v).onchange = async e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      if (!await confirmBox({ title: 'Pulihkan dari cadangan?', body: '<p>Data di perangkat ini diganti isi cadangan. Bila tersambung, sinkron berikutnya menarik ulang data spreadsheet.</p>', ok: 'Pulihkan' })) return;
      busy('Memulihkan…');
      try { await M3.pulihkan(f); busy(false); S.boot = null; toast('Data dipulihkan dari cadangan.'); render(); } catch (x) { fail(x); }
    };
  }
  async function pasangPinUI() {
    const pin = await M3.layarPin({ judul: 'Pasang PIN', pesan: 'Buat PIN 4–12 angka untuk mengunci data MyTagihan di perangkat ini.', tombol: 'Pasang PIN', ulang: true, batal: true });
    if (!pin) return;
    busy('Menyandikan data…');
    try { await M3.pasangPin(pin); busy(false); toast('PIN terpasang. Data di perangkat ini sekarang tersandi.'); render(true); } catch (e) { fail(e); }
  }

  // =====================================================================
  //  Sinkron, menu ⋮ (HP), status menu samping (komputer)
  // =====================================================================
  function sinkronSekarang() {
    const st = M3.status();
    if (!st.aktif) { go('data'); return; }
    if (!st.online) { toast('Tanpa sinyal. Perubahan tersimpan di perangkat dan dikirim saat sinyal kembali.'); return; }
    toast('Menyinkronkan dengan spreadsheet…');
    M3.sinkron().then(h => {
      toast('Sinkron selesai' + (h.kirim ? ' · ' + h.kirim + ' perubahan terkirim' : '') + (h.gagal ? ' · ' + h.gagal + ' ditolak (lihat Data & sinkron)' : '') + (h.tab ? ' · ' + h.tab + ' sheet diperbarui' : ' · data sudah terbaru'), h.gagal ? 'err' : '');
    }).catch(e => toast('Sinkron gagal: ' + e.message, 'err'));
  }
  const IKON_SYNC = '<svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg>';
  function renderStatus() {
    const st = M3.status();
    const b = $('#sync');
    if (b) {
      b.classList.toggle('putar', st.berjalan);
      b.dataset.titik = !st.aktif ? 'mati' : st.galat ? 'kuning' : st.antre ? 'antre' : '';
      b.title = teksSinkron(st);
      const n = $('.titik-n', b); if (n) n.textContent = st.antre && st.aktif ? (st.antre > 99 ? '99+' : st.antre) : '';
    }
    const sl = $('#status-lebar');
    if (sl) {
      sl.innerHTML = (st.aktif
        ? '<button class="btn-sinkron" id="sl-sync"' + (st.berjalan ? ' disabled' : '') + '>' + IKON_SYNC + 'Sinkron sekarang<small>ke spreadsheet MyTagihan</small></button>' +
          '<button class="link-status" id="sl-st" title="' + esc(st.galat || 'Data & sinkron') + '"><span class="titik' + (st.galat ? ' kuning' : '') + '"></span>' + esc(st.berjalan ? 'Menyinkronkan…' : st.galat ? 'Sinkron bermasalah' : 'Sinkron ' + (st.terakhir ? st.terakhir.slice(11, 16) : '–')) + (st.antre ? ' · ' + st.antre + ' menunggu' : '') + '</button>'
        : '<button class="link-status" id="sl-st"><span class="titik kuning"></span>Belum tersambung ke spreadsheet</button>') +
        '<div><span class="titik' + (st.simpan !== 'idb' || st.simpanGalat ? ' kuning' : '') + '"></span>' + (st.simpan === 'idb' ? 'Tersimpan di perangkat' : 'Belum tersimpan') + (st.pin ? ' · PIN' : '') + (st.online ? '' : ' · tanpa sinyal') + '</div>' +
        '<div>Versi ' + esc(st.versi) + ' · mesin ' + esc(st.mesin) + '</div>';
      const a = $('#sl-sync', sl); if (a) a.onclick = sinkronSekarang;
      $('#sl-st', sl).onclick = () => (S.view === 'data' ? render(true) : go('data'));
    }
    const t = $('[data-st-teks]'); if (t) t.textContent = teksSinkron(st);
  }
  function tutupMenu() { const m = $('#menu-pop'); if (m) m.remove(); }
  function bukaMenu() {
    if ($('#menu-pop')) return tutupMenu();
    const st = M3.status();
    const m = document.createElement('div');
    m.id = 'menu-pop'; m.className = 'menu-pop'; m.setAttribute('role', 'menu');
    m.innerHTML = '<button data-m="dasbor"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dasbor</button>' +
      '<button data-m="laporan"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Laporan cakupan</button>' +
      '<button data-m="data"><svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Data & sinkron</button>' +
      '<button data-m="sync">' + IKON_SYNC + '<span>Sinkron sekarang<small>' + esc(teksSinkron(st)) + '</small></span></button>' +
      (st.pin ? '<button data-m="kunci"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Kunci sekarang</button>' : '');
    document.body.appendChild(m);
    $$('[data-m]', m).forEach(b => b.onclick = () => {
      tutupMenu();
      const k = b.dataset.m;
      if (k === 'sync') sinkronSekarang();
      else if (k === 'kunci') M3.kunciSekarang();
      else if (k === 'dasbor' || k === 'data') tab(k);
      else go(k);
    });
    setTimeout(() => document.addEventListener('click', function luar(e) { if (!m.contains(e.target)) { tutupMenu(); document.removeEventListener('click', luar); } }), 0);
  }
  /** Data baru dari sinkron: muat ulang tampilan, kecuali sedang mengisi formulir / memproses (ditunda). */
  let tundaSegar = null;
  function segarkan() {
    clearTimeout(tundaSegar);
    const a = document.activeElement;
    if (!$('#busy').hidden || $('#layer').children.length || $('#menu-pop') || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) { tundaSegar = setTimeout(segarkan, 4000); return; }
    S.boot = null;
    render(true);
  }

  // =====================================================================
  //  Daftar tampilan & mulai
  // =====================================================================
  const VIEWS = {
    dasbor: vDasbor, data: vData,
    beranda: vBeranda, mutasi: vMutasi, tagihan: vTagihan, peserta: vPeserta, detail: vDetail, pengaturan: vPengaturan,
    kelompok: vKelompok, npp: vNpp, keringanan: vKeringanan, target: vTarget, bebasjp: vBebasJP, impor: vImpor,
    bank: vBank, ibr: vIbr, arsip: vArsip, riwayat: vRiwayat, aplikasi: vAplikasi, laporan: vLaporan
  };
  $$('#tabbar button[data-tab]').forEach(b => b.onclick = () => tab(b.dataset.tab));
  $('#back').onclick = back;
  $('#sync').onclick = sinkronSekarang;
  $('#menu').onclick = e => { e.stopPropagation(); bukaMenu(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { const sc = $('#layer .scrim:last-child'); if (sc) sc.click(); else tutupMenu(); } });
  window.__mt = { S, go, tab, cetakLaporan, render };
  M3.onStatus(renderStatus);
  M3.onBerubah(segarkan);
  M3.siap().then(() => { renderStatus(); render(); }, e => { $('#view').innerHTML = '<div class="card pad"><p class="note err">' + esc(e.message) + '</p></div>'; });
})();
