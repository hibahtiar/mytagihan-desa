<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<title>MyTagihan Desa · BPJS Ketenagakerjaan KC Pamekasan</title>
<!-- MyTagihan Desa 3.0.0 · kode publik tanpa data: data hanya di spreadsheet milik pengguna dan di perangkat (tersandi bila PIN dipasang). -->
<style>
/* MyTagihan Desa 3.0 — warna pembeda: UNGU TERONG (plum) + aksen kuning padi.
   LENSA PK = petrol #0E5A5F (master) · Monitor SPPG = biru · MyTagihan Desa = ungu terong #5B2A6E. */
:root {
  --bg: #f5f3f6; --surface: #ffffff; --surface-2: #faf8fb; --ink: #1d1620; --muted: #645a69; --line: #e6dfe9;
  --brand: #5b2a6e; --brand-2: #7c4a8f; --brand-3: #b997c6; --brand-tua: #3f1c4d; --brand-ink: #ffffff; --brand-soft: #f2eaf5; --aksen: #f2b544;
  --danger: #b3261e; --danger-soft: #fbe8e6; --warn: #7a5200; --warn-soft: #fff3d2; --info: #23508a; --info-soft: #e7eef8; --ok: #1e7a3c; --ok-soft: #e3f2e7;
  --shadow: 0 1px 2px rgba(29,22,32,.06), 0 4px 16px rgba(29,22,32,.06); --r: 14px; --tab-h: 62px; --sisi: 0px; --lebar-isi: 760px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
.num, .money { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* Kerangka */
.top { position: sticky; top: 0; z-index: 20; background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; gap: 6px; padding: 10px 10px 10px 16px; min-height: 58px; }
.top h1 { font-size: 18px; font-weight: 650; }
.top .sub { font-size: 12.5px; opacity: .85; }
.top .t { flex: 1; min-width: 0; }
.top .t > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.icon-btn { width: 42px; height: 42px; border: 0; background: transparent; color: inherit; border-radius: 10px; display: grid; place-items: center; cursor: pointer; }
.icon-btn:active { background: rgba(255,255,255,.15); }
#view { max-width: 760px; margin: 0 auto; padding: 14px 14px calc(var(--tab-h) + 28px); display: flex; flex-direction: column; gap: 12px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabbar button svg { padding: 2px 12px; box-sizing: content-box; border-radius: 12px; }
.tabbar button.on { color: var(--brand); }
.tabbar button.on svg { background: var(--brand-soft); }

/* Kartu & buka-tutup */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.card.pad { padding: 14px 16px; }
details.acc { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
details.acc > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 54px; cursor: pointer; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary .st { flex: 1; min-width: 0; }
details.acc > summary .tt { font-weight: 650; font-size: 15px; }
details.acc > summary .ss { font-size: 12.5px; color: var(--muted); }
details.acc > summary::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: -4px 4px 0 0; transition: transform .15s; flex-shrink: 0; }
details.acc[open] > summary::after { transform: rotate(-135deg); margin-top: 4px; }
details.acc > .body { border-top: 1px solid var(--line); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
details.acc.flush > .body { padding: 0; gap: 0; }
details.acc.warn { border: 1px solid #f0d78c; }
.sec { font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 6px 4px -4px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 12px; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi.hero { background: var(--brand); color: #fff; }
.kpi.hero .l { color: rgba(255,255,255,.85); }
.hero-total { background: var(--brand); color: #fff; border-radius: var(--r); padding: 14px 16px; }
.hero-total .l { font-size: 13px; opacity: .85; }
.hero-total .v { font-size: 28px; font-weight: 750; font-variant-numeric: tabular-nums; }

/* Daftar */
.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; color: inherit; }
.list > li:first-child > .row, .body > .row:first-child { border-top: 0; }
.row .m { flex: 1; min-width: 0; }
.row .t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t2 { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .e { text-align: right; flex-shrink: 0; font-size: 13.5px; }
.chev { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); flex-shrink: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; word-break: break-word; }
.empty { text-align: center; color: var(--muted); padding: 20px 10px; font-size: 14px; }

/* Lencana */
.badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.b { display: inline-block; font-size: 11.5px; font-weight: 650; padding: 2px 8px; border-radius: 999px; background: #efebf1; color: #4f4655; white-space: nowrap; }
.b.pu { background: var(--brand-soft); color: var(--brand); }
.b.bpu { background: var(--info-soft); color: var(--info); }
.b.warn { background: var(--warn-soft); color: var(--warn); }
.b.red { background: var(--danger-soft); color: var(--danger); }
.b.ok { background: var(--ok-soft); color: var(--ok); }

/* Formulir */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lbl { font-size: 13.5px; font-weight: 600; }
.field small { font-size: 12.5px; color: var(--muted); }
input[type=text], input[type=search], input[type=number], input[type=date], input[type=month], input[type=email], select, textarea {
  width: 100%; min-height: 46px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 16px; }
textarea { min-height: 70px; }
input:focus, select:focus, textarea:focus, summary:focus-visible, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { min-height: 42px; border: 0; border-radius: 9px; background: transparent; font-weight: 650; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--brand); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg button.on.danger { color: var(--danger); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; min-height: 38px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.chip-x { display: inline-flex; align-items: center; gap: 6px; background: var(--brand-soft); color: var(--brand); border: 0; border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.check { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--brand); flex-shrink: 0; }
.note { font-size: 13.5px; padding: 9px 12px; border-radius: 10px; }
.note.info { background: var(--info-soft); color: var(--info); }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.err { background: var(--danger-soft); color: var(--danger); }
.note.ok { background: var(--ok-soft); color: var(--ok); }

/* Tombol */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 650; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn.p { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn.d { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--brand); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--brand); font-weight: 650; cursor: pointer; font-size: 13.5px; }
.sticky-act { position: sticky; bottom: calc(var(--tab-h) + 10px); z-index: 5; }
.sticky-act .btn { box-shadow: 0 6px 18px rgba(0,0,0,.18); }

/* Grafik batang */
.bars { display: flex; flex-direction: column; gap: 7px; }
.bar { display: grid; grid-template-columns: 96px minmax(0, 1fr) 52px; gap: 8px; align-items: center; font-size: 12.5px; cursor: pointer; }
.bar .tr { height: 12px; background: #efebf1; border-radius: 3px; overflow: hidden; }
.bar .fi { height: 100%; background: var(--brand); border-radius: 3px; }
.bar .v { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.cells { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; color: #4f4655; }
.cells .z { color: var(--danger); font-weight: 700; }

/* Tabel kecil */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { color: var(--muted); font-weight: 600; font-size: 12px; }
.scroll-x { overflow-x: auto; }

/* Lapisan */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(20,10,24,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 8px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.sheet .grip { width: 40px; height: 5px; background: var(--line); border-radius: 3px; margin: 2px auto 4px; }
.sheet h2 { font-size: 18px; }
.sheet ul { margin: 0; padding-left: 20px; max-height: 36vh; overflow: auto; }
.busy { position: fixed; inset: 0; z-index: 60; background: rgba(20,10,24,.5); display: grid; place-items: center; padding: 24px; }
.busy .c { background: var(--surface); border-radius: 16px; padding: 22px; text-align: center; max-width: 300px; width: 100%; }
.spin { width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--brand-soft); border-top-color: var(--brand); margin: 0 auto 12px; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toasts { position: fixed; left: 12px; right: 12px; top: 66px; z-index: 70; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.toast { pointer-events: auto; width: 100%; max-width: 520px; background: #2a1d30; color: #fff; padding: 11px 14px; border-radius: 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.25); display: flex; align-items: center; gap: 12px; }
.toast.err { background: #8c1d18; }
.toast .m { flex: 1; }
.toast button { border: 0; background: none; color: var(--aksen); font-weight: 700; font-size: 14px; min-height: 36px; cursor: pointer; }
.skeleton { height: 70px; border-radius: var(--r); background: linear-gradient(90deg, #ece8ee 25%, #f6f4f7 50%, #ece8ee 75%); background-size: 200% 100%; animation: sk 1.2s infinite; }
@keyframes sk { to { background-position: -200% 0; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ===================== MyTagihan Desa 3.0 ===================== */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { overflow-x: clip; }
.top .icon-btn { position: relative; }
.top #sync[data-titik]::after { content: ""; position: absolute; top: 9px; right: 9px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--brand); }
.top #sync[data-titik="kuning"]::after, .top #sync[data-titik="antre"]::after { background: var(--aksen); }
.top #sync[data-titik="mati"]::after { background: #c9bfcd; }
.top #sync[data-titik=""]::after { display: none; }
.top #sync .titik-n { position: absolute; bottom: 4px; right: 2px; font-size: 10px; font-weight: 800; line-height: 1; color: var(--aksen); }
.putar svg { animation: putar 1s linear infinite; }
@keyframes putar { to { transform: rotate(-360deg); } }
.kpi .s { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.kpi.hero .s { color: rgba(255,255,255,.8); }
.kpi[data-ke], .kpi[data-dl] { cursor: pointer; }
.kpis-d { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kpis-d .kpi.hero { grid-column: 1 / -1; }
.kpis-d .kpi .v { font-size: 20px; }
.kpis-d .kpi.hero .v { font-size: 30px; }
.sambut h2 { font-size: 20px; color: var(--brand); margin-bottom: 6px; }
.sambut p { margin: 8px 0 12px; }

/* menu ⋮ (HP) */
.menu-pop { position: fixed; top: 58px; right: 8px; z-index: 80; background: var(--surface); border-radius: 14px; box-shadow: 0 10px 30px rgba(20,10,24,.25); padding: 6px; min-width: 250px; display: flex; flex-direction: column; }
.menu-pop button { display: flex; align-items: center; gap: 12px; border: 0; background: none; text-align: left; padding: 11px 12px; border-radius: 10px; font-weight: 600; cursor: pointer; color: var(--ink); }
.menu-pop button:active, .menu-pop button:hover { background: var(--brand-soft); }
.menu-pop button svg { color: var(--brand); }
.menu-pop small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }

/* Dasbor */
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.card.kd { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.kd-k { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.kd-k h2 { font-size: 15.5px; font-weight: 700; }
.kd-k .ss { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.grafik { width: 100%; height: auto; display: block; }
.grafik .grid { stroke: #ebe5ee; stroke-width: 1; }
.grafik .ax { fill: var(--muted); font-size: 11px; }
.grafik .lbl { fill: var(--brand); font-size: 13px; font-weight: 700; }
.grafik .ln-aktif { fill: none; stroke: var(--brand); stroke-width: 2.5; stroke-linejoin: round; }
.grafik .pt-aktif { fill: var(--brand); stroke: #fff; stroke-width: 1.5; }
.grafik .b-masuk { fill: var(--ok); opacity: .75; }
.grafik .b-keluar { fill: var(--danger); opacity: .7; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legenda b { color: var(--ink); }
.bars-k { display: flex; flex-direction: column; gap: 2px; }
.bar-k { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) 96px; gap: 10px; align-items: center; border: 0; background: none; text-align: left; padding: 7px 4px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--ink); }
.bar-k:hover { background: var(--surface-2); }
.bar-k .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.bar-k .n .b { font-size: 10px; padding: 1px 6px; margin-left: 2px; }
.bar-k .tr { height: 10px; background: #efebf1; border-radius: 3px; overflow: hidden; }
.bar-k .fi { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
.bar-k .v { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stack { display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: #efebf1; }
.stack span { display: block; height: 100%; }
.flush-list { margin: 0 -16px -14px; }
.flush-list > .row:first-child { border-top: 1px solid var(--line); }
.tbl-d td, .tbl-d th { padding: 7px 6px; }
.tbl-d tr[data-lap] { cursor: pointer; }
.tbl-d tr[data-lap]:hover td { background: var(--surface-2); }

/* bagian khusus layar lebar: tersembunyi di HP */
.merek-lebar, .status-lebar, .tabbar .hanya-lebar { display: none !important; }
#cetak { display: none; }

/* ---------- komputer/tablet (≥ 760 px): menu kiri seperti LENSA PK / Monitor SPPG ---------- */
@media (min-width: 760px) {
  :root { --sisi: 232px; --tab-h: 0px; }
  body { padding-left: var(--sisi); }
  body[data-view="dasbor"] { --lebar-isi: 1320px; }
  body[data-view="laporan"], body[data-view="peserta"], body[data-view="npp"], body[data-view="riwayat"], body[data-view="target"] { --lebar-isi: 1040px; }
  .top { position: static; background: transparent; color: var(--ink); max-width: var(--lebar-isi); margin: 0 auto; padding: 26px 32px 12px; min-height: 0; align-items: flex-end; }
  .top h1 { font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
  .top .sub { font-size: 14.5px; color: var(--muted); opacity: 1; margin-top: 3px; }
  .top .t > * { white-space: normal; }
  .top #back { border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 40px; height: 40px; margin-bottom: 2px; }
  .top #sync, .top #menu { display: none; }
  #view { max-width: var(--lebar-isi); padding: 4px 32px 48px; }
  .row:hover, .check:hover { background: var(--surface-2); }
  .btn:hover { filter: brightness(.97); }
  .sticky-act { bottom: 12px; }
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpis-d { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .kpis-d .kpi.hero { grid-column: auto; }
  .kpis-d .kpi { padding: 14px 16px; }
  .kpis-d .kpi .v { font-size: 24px; }
  .kpis-d .kpi.hero .v { font-size: 30px; }
  .kpi[data-ke]:hover, .kpi[data-dl]:hover { box-shadow: 0 0 0 2px var(--brand-3), var(--shadow); }

  /* menu kiri */
  .tabbar { top: 0; bottom: 0; left: 0; right: auto; width: var(--sisi); height: auto; padding: 20px 12px 14px; border: 0; background: var(--brand); display: flex; flex-direction: column; gap: 18px; overflow-y: auto; z-index: 30; }
  .merek-lebar { display: block !important; padding: 0 8px; color: #fff; }
  .merek-lebar b { display: block; font-size: 21px; font-weight: 750; letter-spacing: -.2px; }
  .merek-lebar .tag { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 6px; background: var(--aksen); color: #3b1a00; font-size: 10.5px; font-weight: 800; letter-spacing: .8px; vertical-align: 4px; }
  .merek-lebar span.k { display: block; font-size: 12px; color: #e3d3ea; margin-top: 3px; line-height: 1.35; }
  .tab-dalam { display: flex; flex-direction: column; gap: 2px; }
  .tabbar .hanya-lebar { display: flex !important; }
  .tabbar button { flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; color: #eadcf0; font-size: 15px; font-weight: 500; }
  .tabbar button svg { padding: 0; width: 20px; height: 20px; background: none !important; }

const SPREADSHEET_ID_FALLBACK = ''; // diisi otomatis lewat menu "Siapkan aplikasi"

function getSS() {
  try {
    const a = SpreadsheetApp.getActiveSpreadsheet();
    if (a) return a;
  } catch (e) { /* bukan konteks spreadsheet */ }
  const id = PropertiesService.getScriptProperties().getProperty('SS_ID') || SPREADSHEET_ID_FALLBACK;
  if (!id) throw new Error('Aplikasi belum disiapkan. Buka spreadsheet, menu MyTagihan Desa › Siapkan aplikasi.');
  return SpreadsheetApp.openById(id);
}

function sheet_(name, mustExist) {
  const sh = getSS().getSheetByName(name);
  if (!sh && mustExist !== false) throw new Error('Sheet "' + name + '" tidak ditemukan. Jalankan menu Siapkan aplikasi.');
  return sh;
}

function tz_() { return getSS().getSpreadsheetTimeZone() || 'Asia/Jakarta'; }

function lastRowBy_(sh, colIndex0) {
  const max = sh.getLastRow();
  if (max < 2) return 1;
  const vals = sh.getRange(1, colIndex0 + 1, max, 1).getValues();
  for (let i = vals.length - 1; i >= 0; i--) {
    if (vals[i][0] !== '' && vals[i][0] !== null) return i + 1;
  }
  return 1;
}

/**
 * Membaca sheet sebagai tabel. keyCol menentukan baris terakhir (baris kosong di bawahnya diabaikan).
 * @return {{sh, headers, ix:function, rows:Array<Array>, objs:Array<Object>}}
 */
function table_(name, keyCol) {
  const sh = sheet_(name);
  const lastCol = Math.max(sh.getLastColumn(), 1);
  const headers = sh.getRange(1, 1, 1, lastCol).getValues()[0].map(h => String(h).trim());
  const k = keyCol ? headers.indexOf(keyCol) : 0;
  const last = lastRowBy_(sh, k < 0 ? 0 : k);
  const rows = last > 1 ? sh.getRange(2, 1, last - 1, lastCol).getValues() : [];
  const ix = (h) => headers.indexOf(h);
  return {
    sh, headers, ix, rows,
    obj: (r) => { const o = {}; headers.forEach((h, j) => { if (h) o[h] = r[j]; }); return o; }
  };
}

function ensureSheet_(name, headers) {
  const ss = getSS();
  let sh = ss.getSheetByName(name);
  if (!sh) {
    sh = ss.insertSheet(name);
    sh.getRange(1, 1, 1, headers.length).setValues([headers]).setFontWeight('bold');
    sh.setFrozenRows(1);
  } else {
    const cur = sh.getRange(1, 1, 1, Math.max(sh.getLastColumn(), 1)).getValues()[0].map(String);
    headers.forEach(h => {
      if (cur.indexOf(h) === -1) {
        const c = sh.getLastColumn() + 1;
        sh.getRange(1, c).setValue(h).setFontWeight('bold');
        cur.push(h);
      }
    });
  }
  return sh;
}

//  Nilai & tanggal

function parseDate(v) {
  if (v instanceof Date && !isNaN(v)) return v;
  if (typeof v === 'string') {
    const s = v.trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  return null;
}
function ymd_(d) { return d ? Utilities.formatDate(d, tz_(), 'yyyy-MM-dd') : ''; }
function dmy_(d) { return d ? Utilities.formatDate(d, tz_(), 'dd/MM/yyyy') : ''; }
/** "yyyy-MM" dari Date, string "yyyy-MM", "dd/MM/yyyy", atau Date-bulan. */
function ym_(v) {
  if (v === '' || v === null || v === undefined) return '';
  if (v instanceof Date) return Utilities.formatDate(v, tz_(), 'yyyy-MM');
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})/);
  if (m) return m[1] + '-' + m[2];
  m = s.match(/^(\d{1,2})\/(\d{4})$/);
  if (m) return m[2] + '-' + ('0' + m[1]).slice(-2);
  const d = parseDate(s);
  return d ? Utilities.formatDate(d, tz_(), 'yyyy-MM') : '';
}
function monthEnd_(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0); }
function addMonths_(ym, n) { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
function num_(v) {
  if (typeof v === 'number') return v;
  if (v === '' || v === null || v === undefined) return 0;
  const s = String(v).replace(/[^\d,.\-]/g, '');
  // Format Indonesia "2.300.000" atau "0,24"
  if (/^\-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
  if (/^\-?\d+,\d+$/.test(s)) return parseFloat(s.replace(',', '.')) || 0;
  return parseFloat(s.replace(/,/g, '')) || 0;
}
const NAMA_BULAN = ['JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'];
const BLN3 = ['JAN', 'FEB', 'MAR', 'APR', 'MEI', 'JUN', 'JUL', 'AGU', 'SEP', 'OKT', 'NOV', 'DES'];
function namaBulan_(ym) { const [y, m] = ym.split('-').map(Number); return NAMA_BULAN[m - 1] + ' ' + y; }
function toTitleCase(str) {
  return String(str || '').trim().replace(/\s+/g, ' ').replace(/\S+/g, w => w.charAt(0).toUpperCase() + w.substr(1).toLowerCase());
}
/**
 * ID acak 16 karakter. Untuk sinkron aplikasi (MyTagihan 3.0): perangkat mencatat ID yang dibuat
 * saat sebuah tindakan dijalankan (_UUID_CATAT), lalu server memakai ID yang sama saat menjalankan
 * ulang tindakan itu (_UUID_ANTRE). Dengan begitu ID peserta, log, dan acuan sama di HP dan spreadsheet.
 */
var _UUID_ANTRE = null, _UUID_CATAT = null;
function uuid_() {
  let u = _UUID_ANTRE && _UUID_ANTRE.length ? String(_UUID_ANTRE.shift()) : '';
  if (!/^[0-9a-f]{16}$/.test(u)) u = Utilities.getUuid().replace(/-/g, '').slice(0, 16);
  if (_UUID_CATAT) _UUID_CATAT.push(u);
  return u;
}

/** Nilai sel yang dinormalkan untuk dibandingkan (undo) dan dikirim ke HP. */
function norm_(v) {
  if (v instanceof Date) return ymd_(v);
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') return String(Math.round(v * 1e6) / 1e6);
  return String(v).trim();
}

function currentUser_() {
  let e = '';
  try { e = Session.getActiveUser().getEmail(); } catch (x) { /* abaikan */ }
  if (!e) { try { e = Session.getEffectiveUser().getEmail(); } catch (x) { /* abaikan */ } }
  return e || 'pengguna';
}

function settings_() {
  const sh = getSS().getSheetByName(SH.SET);
  const out = {};

  sh.getRange(2, 1, sh.getLastRow() - 1, 2).getValues().forEach(r => { if (r[0]) out[String(r[0]).trim()] = r[1]; });
  return out;

function checkAccess_() {
  const allowed = String(settings_().PENGGUNA || '').split(/[,;\s]+/).map(s => s.trim().toLowerCase()).filter(Boolean);
  if (!allowed.length) return;
  const me = currentUser_().toLowerCase();
  if (allowed.indexOf(me) === -1) throw new Error('Akun ' + me + ' tidak terdaftar sebagai pengguna aplikasi. Hubungi pengelola.');

//  Transaksi tulis yang tercatat (dasar fitur Batalkan)
// ---------------------------------------------------------------------------

/**
 * Semua perubahan data lewat Tx supaya foto "sebelum" dan "sesudah" tersimpan.
 * Pemakaian: const tx = new Tx('Tambah peserta', 'ket'); tx.insert(...); tx.update(...); return tx.commit();
 */
function Tx(aksi, ket, undoable) {
  this.id = uuid_();
  this.aksi = aksi;
  this.ket = ket || '';
  this.undoable = undoable !== false;
  this.details = [];
  this.cache = {};
}

Tx.prototype.t = function (name) {
  if (!this.cache[name]) {
    if (name === SH.DB) ensureIds_();
    this.cache[name] = table_(name, KEY_COL[name]);
  }
  return this.cache[name];
};

Tx.prototype.rowObj_ = function (t, row) {
  const o = {};
  t.headers.forEach((h, j) => { if (h) o[h] = norm_(row[j]); });
  return o;
};

Tx.prototype.find = function (name, key) {
  const t = this.t(name);
  const k = t.ix(KEY_COL[name]);
  for (let i = 0; i < t.rows.length; i++) if (norm_(t.rows[i][k]) === String(key)) return i;
  return -1;
};

/** Menambah satu atau banyak baris (objek kolom→nilai). Ditulis sekaligus. */
Tx.prototype.insertMany = function (name, objs, formats) {
  if (!objs.length) return;
  const t = this.t(name);
  const keyCol = KEY_COL[name];
  // Baris yang diketik manual tanpa kunci di bawah data tidak boleh tertimpa
  const start = Math.max(t.rows.length + 2, lastRowBy_(t.sh, 0) + 1);
  const gap = start !== t.rows.length + 2;
  const values = objs.map(o => t.headers.map(h => (h in o ? o[h] : '')));
  if (formats) {
    Object.keys(formats).forEach(h => {
      const j = t.ix(h);
      if (j >= 0) t.sh.getRange(start, j + 1, values.length, 1).setNumberFormat(formats[h]);
    });
  }
  t.sh.getRange(start, 1, values.length, t.headers.length).setValues(values);
  values.forEach(r => {
    if (!gap) t.rows.push(r);
    this.details.push([this.id, name, norm_(r[t.ix(keyCol)]), 'insert', '', JSON.stringify(this.rowObj_(t, r))]);
  });
  if (gap) this.cache[name] = null;
};
Tx.prototype.insert = function (name, obj, formats) { this.insertMany(name, [obj], formats); };

/** Mengubah kolom tertentu pada baris berkunci key. */
Tx.prototype.update = function (name, key, changes) {
  const t = this.t(name);
  const i = this.find(name, key);
  if (i < 0) throw new Error('Data "' + key + '" tidak ditemukan di ' + name + '.');
  const before = this.rowObj_(t, t.rows[i]);
  const row = t.rows[i].slice();
  let changed = false;
  Object.keys(changes).forEach(h => {
    const j = t.ix(h);
    if (j < 0) return;
    if (norm_(row[j]) !== norm_(changes[h])) { row[j] = changes[h]; changed = true; }
  });
  if (!changed) return false;
  t.sh.getRange(i + 2, 1, 1, t.headers.length).setValues([row]);
  t.rows[i] = row;
  this.details.push([this.id, name, String(key), 'update', JSON.stringify(before), JSON.stringify(this.rowObj_(t, row))]);
  return true;
};

/** Mencatat penggantian isi satu sheet (mis. IBR) dengan cadangan. */
Tx.prototype.replaced = function (name, backupName) {
  this.details.push([this.id, name, '*', 'replace', backupName, '']);
};

Tx.prototype.commit = function (extra) {
  const ss = getSS();
  const log = ensureSheet_(SH.LOG, SCHEMA.log_aplikasi);
  log.appendRow([this.id, new Date(), currentUser_(), this.aksi, String(this.ket).slice(0, 1000),
    this.undoable && this.details.length ? 'Ya' : 'Tidak', 'Aktif', '']);
  if (this.details.length) {
    const d = ensureSheet_(SH.LOGD, SCHEMA.log_detail);
    const rows = this.details.map(r => r.map(v => String(v).slice(0, 49000)));
    d.getRange(d.getLastRow() + 1, 1, rows.length, rows[0].length).setValues(rows);
  }
  SpreadsheetApp.flush();
  void ss;
  return Object.assign({ logId: this.id, undoable: this.undoable && this.details.length > 0, aksi: this.aksi }, extra || {});
};

/** Memberi ID pada baris Database yang ditambahkan manual di sheet (tanpa ID). */
function ensureIds_() {
  const sh = getSS().getSheetByName(SH.DB);
  if (!sh) return 0;
  const t = table_(SH.DB, 'Status');
  const i = t.ix('ID');
  if (i < 0 || !t.rows.length) return 0;
  let n = 0;
  const col = t.rows.map(r => { if (!r[i] && r[t.ix('Status')]) { n++; return [uuid_()]; } return [r[i]]; });
  if (n) sh.getRange(2, i + 1, col.length, 1).setValues(col);
  return n;
}

/** Menjalankan fungsi dengan kunci tulis. */
function withLock_(fn) {
  const lock = LockService.getScriptLock();
  if (!lock.tryLock(30000)) throw new Error('Server sedang memproses permintaan lain. Coba lagi sebentar.');
  try { return fn(); } finally { lock.releaseLock(); }
}


/* === mesin: Iuran.gs (sama dengan spreadsheet) === */
/**
 * MyTagihan Desa v2 — Iuran.gs
 * Data acuan (kelompok, NPP, acuan upah, tarif JKK, keringanan, tarif) dan mesin hitung iuran.
 */

/** Membaca semua data acuan sekali per permintaan. */
function loadMaster_() {
  const M = { kel: {}, kelList: [], npp: {}, nppByLoc: {}, acuan: [], ker: [], tarif: {}, set: settings_() };

  const k = table_(SH.KEL, 'Kode');
  k.rows.forEach(r => {
    const o = k.obj(r);
    const code = String(o.Kode).trim();
    if (!code) return;
    const g = {
      kode: code, nama: String(o.Nama || code), induk: String(o.Induk || '').trim(),
      jenis: String(o['Jenis Kepesertaan'] || 'PU').trim().toUpperCase() === 'BPU' ? 'BPU' : 'PU',
      programAwal: String(o['Program Awal'] || '2P').trim(), urutan: num_(o.Urutan) || 99,
      lengkap: String(o['Hitung Kelengkapan'] || 'Ya').trim().toLowerCase() !== 'tidak'
    };
    g.grup = g.induk || g.kode;
    M.kel[code] = g;
    M.kelList.push(g);
  });
  M.kelList.sort((a, b) => a.urutan - b.urutan || a.nama.localeCompare(b.nama));

  const n = table_(SH.NPP, 'NPP');
  n.rows.forEach(r => {
    const o = n.obj(r);
    const npp = norm_(o.NPP);
    if (!npp) return;
    const rec = {
      npp, kel: String(o.Kelompok).trim(), kec: String(o.Kecamatan).trim(), desa: String(o.Desa).trim(),
      nama: String(o['Nama Badan Usaha'] || ''), program: String(o['Jenis Program'] || '').trim(),
      kodeBayar: norm_(o['Kode Bayar']).replace(/^'/, ''), aktif: String(o.Status || 'Aktif').trim() !== 'Nonaktif'
    };
    M.npp[npp] = rec;
    if (rec.aktif || !M.nppByLoc[locKey_(rec.kel, rec.kec, rec.desa)]) M.nppByLoc[locKey_(rec.kel, rec.kec, rec.desa)] = npp;
  });

  const a = table_(SH.ACU, 'ID');
  a.rows.forEach(r => {
    const o = a.obj(r);
    if (!o.ID) return;
    M.acuan.push({
      id: norm_(o.ID), jenis: String(o.Jenis).trim(), tingkat: String(o.Tingkat).trim(), kode: norm_(o.Kode),
      nilai: o.Nilai === '' || o.Nilai === null ? null : num_(o.Nilai), mulai: ym_(o['Berlaku Mulai']) || '2000-01',
      oleh: String(o['Dicatat Oleh'] || ''), waktu: o.Waktu instanceof Date ? o.Waktu.toISOString() : String(o.Waktu || '')
    });
  });
  // Terbaru di belakang supaya pencarian "terakhir yang berlaku" mudah
  M.acuan.sort((x, y) => x.mulai.localeCompare(y.mulai) || x.waktu.localeCompare(y.waktu));

  const kr = table_(SH.KER, 'ID');
  kr.rows.forEach(r => {
    const o = kr.obj(r);
    if (!o.ID) return;
    M.ker.push({
      id: norm_(o.ID), nama: String(o.Nama), kelompok: String(o.Kelompok).split(',').map(s => s.trim()).filter(Boolean),
      komponen: String(o.Komponen).toUpperCase().split(',').map(s => s.trim()).filter(Boolean),
      pct: num_(o['Potongan (%)']), mulai: ym_(o.Mulai), selesai: ym_(o.Selesai) || '9999-12',
      dasar: String(o.Dasar || ''), aktif: String(o.Status || 'Aktif').trim() !== 'Diakhiri'
    });
  });

  const t = table_(SH.TAR, 'Kunci');
  t.rows.forEach(r => { const o = t.obj(r); if (o.Kunci) M.tarif[String(o.Kunci).trim()] = num_(o.Nilai); });
  M.batasJP = num_(M.set.BATAS_UPAH_JP) || 0;
  return M;
}

function locKey_(kel, kec, desa) { return [kel, kec, desa].map(s => String(s || '').trim().toLowerCase()).join('|'); }

/** Kelompok peserta: kolom Kelompok, atau dari kolom lama Aparat/BPD. */
function kelOf_(p) {
  if (p.kelompok) return p.kelompok;
  const a = String(p.aparat || '').trim().toLowerCase();
  if (a === 'aparat') return 'APARAT';
  if (a === 'bpd') return 'BPD';
  return '';
}

/** NPP peserta: kolom NPP bila dikenal, selain itu dicari dari kelompok + lokasi. */
function nppOf_(M, p) {
  if (p.npp && M.npp[p.npp]) return p.npp;
  return M.nppByLoc[locKey_(kelOf_(p), p.kec, p.desa)] || '';
}

/** Nilai acuan (Upah / Tarif JKK) yang berlaku untuk NPP pada bulan ym. */
function acuanFor_(M, jenis, npp, kel, ym) {
  let nppVal, nppFound = false, kelVal = null;
  for (let i = M.acuan.length - 1; i >= 0; i--) {
    const a = M.acuan[i];
    if (a.jenis !== jenis || a.mulai > ym) continue;
    if (!nppFound && a.tingkat === 'NPP' && a.kode === npp) { nppFound = true; nppVal = a.nilai; }
    if (kelVal === null && a.tingkat === 'Kelompok' && a.kode === kel) kelVal = a.nilai;
    if (nppFound && kelVal !== null) break;
  }
  if (nppFound && nppVal !== null && nppVal !== undefined) return { nilai: nppVal, sumber: 'NPP' };
  return { nilai: kelVal, sumber: 'Kelompok' };
}

/** Komponen program: 2P = JKK+JKM, 3P = +JHT, 4P = +JP. */
function komponenProgram_(program) {
  const p = String(program || '').toUpperCase();
  const n = parseInt(p, 10) || 2;
  return { JKK: true, JKM: true, JHT: n >= 3, JP: n >= 4 };
}

/**
 * Iuran satu peserta di bulan ym. Tidak memeriksa apakah ditagih (lihat billable_).
 * @return {{jkk,jkm,jht,jp,normal,potongan,net,bebasJP,upah,tarifJKK,program,jenis,npp,ker:Array,error}}
 */
function iuranOrang_(M, p, ym) {
  const npp = nppOf_(M, p);
  const out = { jkk: 0, jkm: 0, jht: 0, jp: 0, normal: 0, potongan: 0, net: 0, bebasJP: false, npp, ker: [], error: '' };
  if (!npp) { out.error = 'NPP belum ada untuk ' + (kelOf_(p) || '?') + ' ' + p.desa + ', ' + p.kec; return out; }
  const n = M.npp[npp];
  const g = M.kel[n.kel];
  if (!g) { out.error = 'Kelompok ' + n.kel + ' (NPP ' + npp + ') tidak dikenal'; return out; }
  const up = acuanFor_(M, 'Upah', npp, n.kel, ym);
  if (up.nilai === null || up.nilai === undefined || up.nilai <= 0) { out.error = 'Acuan upah ' + g.nama + ' belum diisi'; return out; }
  const upah = up.nilai;
  const prog = komponenProgram_(n.program || g.programAwal);
  out.upah = upah; out.program = n.program || g.programAwal; out.jenis = g.jenis; out.kel = g.kode;

  if (g.jenis === 'BPU') {
    out.tarifJKK = M.tarif.BPU_JKK || 1;
    out.jkk = Math.round(upah * out.tarifJKK / 100);
    out.jkm = Math.round(M.tarif.BPU_JKM || 6800);
    out.jht = prog.JHT ? Math.round(upah * (M.tarif.BPU_JHT || 2) / 100) : 0;
    out.jp = 0;
  } else {
    const jkk = acuanFor_(M, 'Tarif JKK', npp, n.kel, ym);
    out.tarifJKK = jkk.nilai === null || jkk.nilai === undefined ? 0.24 : jkk.nilai;
    out.jkk = Math.round(upah * out.tarifJKK / 100);
    out.jkm = Math.round(upah * (M.tarif.PU_JKM || 0.3) / 100);
    out.jht = prog.JHT ? Math.round(upah * (M.tarif.PU_JHT || 5.7) / 100) : 0;
    if (prog.JP) {
      if (p.bebasJP && p.bebasJP <= ym) { out.bebasJP = true; out.jp = 0; }
      else {
        const dasar = M.batasJP > 0 ? Math.min(upah, M.batasJP) : upah;
        out.jp = Math.round(dasar * (M.tarif.PU_JP || 3) / 100);
      }
    }
  }
  out.normal = out.jkk + out.jkm + out.jht + out.jp;

  M.ker.forEach(k => {
    if (!k.aktif || k.mulai > ym || k.selesai < ym) return;
    if (k.kelompok.indexOf(g.kode) === -1 && k.kelompok.indexOf(g.grup) === -1 && k.kelompok.indexOf('SEMUA') === -1) return;
    let pot = 0;
    k.komponen.forEach(c => {
      const v = out[c.toLowerCase()] || 0;
      pot += Math.round(v * k.pct / 100);
    });
    if (pot > 0) { out.potongan += pot; out.ker.push(k.nama); }
  });
  out.potongan = Math.min(out.potongan, out.normal);
  out.net = out.normal - out.potongan;
  return out;
}

/** Aturan lama: Aktif & tgl ≤ akhir bulan, atau Nonaktif & tgl keluar > akhir bulan. */
function billable_(p, end) {
  let t = p.tgl;
  if (!t) { if (p.status === 'Aktif') t = new Date(1970, 0, 1); else return false; }
  return (p.status === 'Aktif' && t <= end) || (p.status === 'Nonaktif' && t > end);
}

/** Membaca Database sebagai objek peserta. */
function readPeserta_() {
  const t = table_(SH.DB, 'Status');
  const c = (h) => t.ix(h);
  const ci = {
    id: c('ID'), status: c('Status'), nik: c('NIK'), nama: c('Nama Lengkap'), aparat: c('Aparat/BPD'), kel: c('Kelompok'),
    kec: c('Kecamatan'), desa: c('Desa'), tgl: c('Tanggal Entry'), ket: c('Keterangan'), program: c('Jenis Program'),
    npp: c('NPP'), bu: c('Nama Badan Usaha'), bjp: c('Bebas JP Mulai'), kbjp: c('Ket. Bebas JP')
  };
  const s = (r, i) => (i < 0 || r[i] === null || r[i] === undefined) ? '' : String(r[i]).trim();
  const list = t.rows.map((r, i) => ({
    row: i + 2, id: s(r, ci.id), status: s(r, ci.status), nik: s(r, ci.nik).replace(/^'/, ''), nama: s(r, ci.nama),
    aparat: s(r, ci.aparat), kelompok: s(r, ci.kel), kec: s(r, ci.kec), desa: s(r, ci.desa),
    tgl: ci.tgl < 0 ? null : parseDate(r[ci.tgl]), ket: s(r, ci.ket), program: s(r, ci.program),
    npp: ci.npp < 0 ? '' : norm_(r[ci.npp]), bu: s(r, ci.bu), bebasJP: ci.bjp < 0 ? '' : ym_(r[ci.bjp]), ketBebasJP: s(r, ci.kbjp)
  })).filter(p => p.status);
  return { t, list };
}

/** Bentuk ringkas peserta untuk dikirim ke HP. */
function pesertaOut_(M, p) {
  const kel = kelOf_(p);
  const npp = nppOf_(M, p);
  const n = M.npp[npp];
  const g = M.kel[n ? n.kel : kel];
  return {
    id: p.id, status: p.status, nik: p.nik, nama: p.nama, kel: g ? g.kode : kel, kelNama: g ? g.nama : (kel || p.aparat),
    jenis: g ? g.jenis : '', kec: p.kec, desa: p.desa, tgl: ymd_(p.tgl), ket: p.ket, npp: npp,
    program: n ? n.program : p.program, bu: n ? n.nama : p.bu, bebasJP: p.bebasJP, ketBebasJP: p.ketBebasJP, row: p.row
  };
}

function setupV2() {

      const rows = v.filter(r => r[ix('NPP')]).map(r => {

        return [norm_(r[ix('NPP')]), ap === 'bpd' ? 'BPD' : 'APARAT', String(r[ix('Kecamatan')]).trim(), String(r[ix('Desa')]).trim(),

      });

      }
    }
  }

  // 3. Acuan awal
  const acu = table_(SH.ACU, 'ID');
  if (!acu.rows.length) {
    const now = new Date();
    const rows = [];
    if (umk > 0) {
      rows.push([uuid_(), 'Upah', 'Kelompok', 'APARAT', umk, '2000-01', 'migrasi', now]);
      rows.push([uuid_(), 'Upah', 'Kelompok', 'BPD', umk, '2000-01', 'migrasi', now]);
    }
    rows.push([uuid_(), 'Upah', 'Kelompok', 'RENTAN', 1000000, '2000-01', 'migrasi', now]);

    acu.sh.getRange(2, 6, rows.length, 1).setNumberFormat('@');
    acu.sh.getRange(2, 1, rows.length, rows[0].length).setValues(rows);
    report.push('• acuan_upah: Nilai UMK ' + (umk ? 'Rp' + umk.toLocaleString('id-ID') : '(tidak ditemukan)') + ' dipakai untuk Aparat & BPD; Pekerja Rentan Rp1.000.000; tarif JKK 0,24%');
  }

  // 4. Kolom baru di Database
  const db = sheet_(SH.DB);
  const heads = db.getRange(1, 1, 1, db.getLastColumn()).getValues()[0].map(String);
  DB_COLS_V2.forEach(c => { if (heads.indexOf(c) === -1) { db.getRange(1, db.getLastColumn() + 1).setValue(c).setFontWeight('bold'); heads.push(c); } });
  const t = table_(SH.DB, 'Status');

  t.rows.forEach((r, i) => {

    if (!r[iKel] && iAp >= 0) {

      if (kelCol[i][0]) nKel++;

  });

    report.push('• Uji kecocokan bulan ' + cek.ym + ': ' + cek.nppBeda + ' NPP berbeda, selisih terbesar Rp' + cek.maxSelisih + ' (wajar ≤ Rp1 × jumlah TK karena pembulatan per komponen)');
  }
  report.push('');
  report.push('Langkah berikutnya: Ekstensi › Apps Script › Terapkan › Deployment baru › Aplikasi web.');
  return report;
}

/** Membandingkan iuran bulan berjalan: rumus lama (pembulatan total) vs v2 (per komponen). */
function ujiKecocokan_(umk) {
  const M = loadMaster_();
  const P = readPeserta_().list;
  const ym = Utilities.formatDate(new Date(), tz_(), 'yyyy-MM');
  const end = monthEnd_(ym);
  const rate = { '2P': 0.0054, '3P': 0.0624, '4P': 0.0924 };
  const lama = {}, baru = {};
  P.forEach(p => {
    if (!billable_(p, end)) return;
    const npp = nppOf_(M, p);
    if (!npp) return;
    const n = M.npp[npp];
    if (n.kel !== 'APARAT' && n.kel !== 'BPD') return;
    lama[npp] = (lama[npp] || 0) + Math.round((rate[n.program] || 0) * umk);
    const r = iuranOrang_(M, Object.assign({}, p, { bebasJP: '' }), ym);
    baru[npp] = (baru[npp] || 0) + r.normal;
  });
  let nppBeda = 0, maxSelisih = 0;
  Object.keys(lama).forEach(k => {
    const d = Math.abs((baru[k] || 0) - lama[k]);
    if (d) nppBeda++;
    maxSelisih = Math.max(maxSelisih, d);
  });
  return { ym, nppBeda, maxSelisih };
}

/**
 * MyTagihan Desa v2 — Peserta.gs
 * Beranda, pencarian, mutasi masuk/keluar, ubah data, Bebas JP, impor peserta.
 */

const KETERANGAN_KELUAR = ['Mengundurkan Diri', 'Meninggal Dunia', 'Menjadi PNS/PPPK', 'Habis Masa Jabatan', 'Lainnya'];

function wilayah_() {
  const cache = CacheService.getScriptCache();
  const c = cache.get('dropdown_v2');
  if (c) return JSON.parse(c);
  const out = { kecamatan: [], desa: {} };
  const sh = getSS().getSheetByName(SH.DROP);
  if (sh && sh.getLastRow() > 1) {
    const v = sh.getDataRange().getValues();
    const h = v.shift().map(x => String(x).trim());

      const j = h.indexOf(k);
      out.desa[k] = j < 0 ? [] : v.map(r => String(r[j] || '').trim()).filter(Boolean);
    });
  }
  cache.put('dropdown_v2', JSON.stringify(out), 21600);
  return out;
}

function nowYm_() { return Utilities.formatDate(new Date(), tz_(), 'yyyy-MM'); }

function apiBootstrap() {
  const ss = getSS();
  const needsSetup = !ss.getSheetByName(SH.KEL) || !ss.getSheetByName(SH.NPP) || !ss.getSheetByName(SH.ACU);
  if (needsSetup) return { needsSetup: true, version: APP_VERSION, user: currentUser_() };
  ensureIds_();
  const M = loadMaster_();
  const P = readPeserta_().list;
  const ym = nowYm_();
  const st = { aktif: 0, nonaktif: 0, masuk: 0, keluar: 0, perKel: {}, bebasJP: 0, ym };
  P.forEach(p => {
    const t = p.tgl ? Utilities.formatDate(p.tgl, tz_(), 'yyyy-MM') : '';
    const kel = (M.npp[nppOf_(M, p)] || {}).kel || kelOf_(p);
    if (p.status === 'Aktif') {
      st.aktif++; st.perKel[kel] = (st.perKel[kel] || 0) + 1;
      if (t === ym) st.masuk++;
      if (p.bebasJP) st.bebasJP++;
    } else if (p.status === 'Nonaktif') { st.nonaktif++; if (t === ym) st.keluar++; }
  });
  const terbaru = P.filter(p => p.tgl).sort((a, b) => b.tgl - a.tgl || b.row - a.row).slice(0, 8).map(p => pesertaOut_(M, p));

  // Perlu perhatian
  const perhatian = [];
  const tanpaNpp = P.filter(p => p.status === 'Aktif' && !nppOf_(M, p));
  if (tanpaNpp.length) perhatian.push({ jenis: 'npp', teks: tanpaNpp.length + ' peserta aktif belum punya NPP (tidak ikut tagihan)', aksi: 'npp' });
  M.kelList.forEach(g => {
    const pakai = Object.keys(M.npp).some(n => M.npp[n].kel === g.kode && M.npp[n].aktif);
    if (pakai && acuanFor_(M, 'Upah', '', g.kode, ym).nilai === null) perhatian.push({ jenis: 'acuan', teks: 'Acuan upah ' + g.nama + ' belum diisi', aksi: 'kelompok' });
  });
  const bpuTanpaKode = Object.keys(M.npp).filter(n => { const r = M.npp[n]; return r.aktif && M.kel[r.kel] && M.kel[r.kel].jenis === 'BPU' && !r.kodeBayar; });
  if (bpuTanpaKode.length) perhatian.push({ jenis: 'kode', teks: bpuTanpaKode.length + ' NPP BPU belum punya kode bayar Bank Jatim', aksi: 'npp-bpu' });
  const next = addMonths_(ym, 1);
  M.ker.filter(k => k.aktif && k.selesai >= ym && k.selesai <= next).forEach(k => perhatian.push({ jenis: 'ker', teks: 'Keringanan "' + k.nama + '" berakhir ' + namaBulan_(k.selesai).toLowerCase(), aksi: 'keringanan' }));
  if (st.bebasJP) perhatian.push({ jenis: 'jp', teks: st.bebasJP + ' peserta aktif ditandai Bebas JP', aksi: 'bebasjp' });

  return {
    version: APP_VERSION, user: currentUser_(), needsSetup: false,
    kelompok: M.kelList.map(g => ({ kode: g.kode, nama: g.nama, jenis: g.jenis, grup: g.grup, induk: g.induk, programAwal: g.programAwal })),
    wilayah: wilayah_(), keterangan: KETERANGAN_KELUAR,
    tarif: { PU_JKM: M.tarif.PU_JKM || 0.3, PU_JHT: M.tarif.PU_JHT || 5.7, PU_JP: M.tarif.PU_JP || 3, BPU_JKK: M.tarif.BPU_JKK || 1, BPU_JKM: M.tarif.BPU_JKM || 6800, BPU_JHT: M.tarif.BPU_JHT || 2 },
    batasJP: M.batasJP, stats: st, terbaru, perhatian,
    ibr: apiInfoIbr()
  };
}

function apiCariPeserta(f) {
  f = f || {};
  const M = loadMaster_();
  const q = String(f.q || '').trim().toLowerCase();
  const limit = Math.min(Number(f.limit) || 100, 500);
  const out = [];
  const P = readPeserta_().list;
  for (let i = P.length - 1; i >= 0 && out.length < limit; i--) {
    const p = P[i];
    if (f.status && f.status !== 'Semua' && p.status !== f.status) continue;
    if (f.kec && p.kec !== f.kec) continue;
    if (f.desa && p.desa !== f.desa) continue;
    if (f.bebasJP && !p.bebasJP) continue;
    if (q && p.nik.indexOf(q) === -1 && p.nama.toLowerCase().indexOf(q) === -1) continue;
    const o = pesertaOut_(M, p);
    if (f.kel && o.kel !== f.kel) continue;
    out.push(o);
  }
  return { items: out, limited: out.length >= limit };
}

function apiPesertaLokasi(f) {
  const M = loadMaster_();
  return readPeserta_().list
    .filter(p => p.status === 'Aktif' && p.kec === f.kec && p.desa === f.desa)
    .map(p => pesertaOut_(M, p))
    .filter(o => !f.kel || o.kel === f.kel);
}

function apiCekNik(nik) {
  nik = String(nik || '').trim();
  const M = loadMaster_();
  return readPeserta_().list.filter(p => p.nik === nik).map(p => pesertaOut_(M, p));
}

/** NPP, program, dan perkiraan iuran per orang untuk kelompok + lokasi (pratinjau form). */
function apiResolveNpp(f) {
  const M = loadMaster_();
  const npp = M.nppByLoc[locKey_(f.kel, f.kec, f.desa)] || '';
  if (!npp) return { npp: '', pesan: 'NPP ' + ((M.kel[f.kel] || {}).nama || f.kel) + ' untuk desa ini belum ada.' };
  const n = M.npp[npp];
  const r = iuranOrang_(M, { kelompok: f.kel, kec: f.kec, desa: f.desa, npp }, nowYm_());
  return { npp, nama: n.nama, program: n.program, iuran: r.error ? null : r.net, error: r.error };
}

function legacyAparat_(M, kel) {
  if (kel === 'APARAT') return 'Aparat';
  if (kel === 'BPD') return 'BPD';
  return (M.kel[kel] || {}).nama || kel;
}

function validNik_(nik) { if (!/^\d{16}$/.test(nik)) throw new Error('NIK harus 16 digit angka.'); }
function validYmd_(s, label) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s || ''))) throw new Error((label || 'Tanggal') + ' tidak valid.');
  return parseDate(s);
}

function apiTambahPeserta(d) {
  return withLock_(() => {
    const M = loadMaster_();
    const nik = String(d.nik || '').trim();
    validNik_(nik);
    const nama = toTitleCase(d.nama);
    if (nama.length < 3) throw new Error('Nama lengkap wajib diisi.');
    if (!M.kel[d.kel]) throw new Error('Pilih kelompok.');
    if (!d.kec || !d.desa) throw new Error('Pilih kecamatan dan desa.');
    const tgl = validYmd_(d.tanggal, 'Tanggal entry');
    const P = readPeserta_().list;
    const dup = P.find(p => p.nik === nik && p.status === 'Aktif');
    if (dup) throw new Error('NIK ' + nik + ' sudah AKTIF atas nama ' + dup.nama + ' (' + dup.desa + ').');
    const npp = M.nppByLoc[locKey_(d.kel, d.kec, d.desa)] || '';
    const n = M.npp[npp] || {};
    const tx = new Tx('Tambah peserta', nama + ' (' + nik + ') · ' + M.kel[d.kel].nama + ' ' + d.desa + ', ' + d.kec);
    const id = uuid_();
    tx.insert(SH.DB, {
      'ID': id, 'Status': 'Aktif', 'NIK': nik, 'Nama Lengkap': nama, 'Aparat/BPD': legacyAparat_(M, d.kel), 'Kelompok': d.kel,
      'Kecamatan': d.kec, 'Desa': d.desa, 'Tanggal Entry': dmy_(tgl), 'Keterangan': '', 'Jenis Program': n.program || '',
      'NPP': npp, 'Nama Badan Usaha': n.nama || ''
    }, { 'NIK': '@', 'NPP': '@', 'Tanggal Entry': '@' });
    return tx.commit({
      id, message: nama + ' ditambahkan.' + (npp ? '' : ' PERHATIAN: NPP belum ada, peserta belum ikut tagihan.'),
      warning: !npp
    });
  });
}

function apiNonaktifkan(d) {
  return withLock_(() => {
    const ids = (d.ids || []).map(String);
    if (!ids.length) throw new Error('Pilih minimal satu peserta.');
    if (!d.keterangan) throw new Error('Pilih keterangan.');
    const tgl = validYmd_(d.tanggal, 'Tanggal nonaktif');
    const tx = new Tx('Nonaktifkan peserta', '');
    const names = [];
    const t = tx.t(SH.DB);
    ids.forEach(id => {
      const i = tx.find(SH.DB, id);
      if (i < 0) return;
      const row = t.rows[i];
      if (String(row[t.ix('Status')]).trim() !== 'Aktif') return;
      const ch = { 'Status': 'Nonaktif', 'Tanggal Entry': dmy_(tgl), 'Keterangan': d.keterangan };
      ['Iuran JKK', 'Iuran JKM', 'Iuran JHT', 'Iuran JP', 'Total Iuran'].forEach(h => { if (t.ix(h) >= 0) ch[h] = 0; });
      tx.update(SH.DB, id, ch);
      names.push(row[t.ix('Nama Lengkap')]);
    });
    if (!names.length) throw new Error('Tidak ada peserta aktif yang cocok.');
    tx.ket = names.length + ' peserta · ' + d.keterangan + ' · ' + dmy_(tgl) + ': ' + names.join(', ');
    return tx.commit({ count: names.length, message: names.length + ' peserta dinonaktifkan.' });
  });
}

function apiUbahPeserta(d) {
  return withLock_(() => {
    const M = loadMaster_();
    const tx = new Tx('Ubah data peserta', '');
    const t = tx.t(SH.DB);
    const i = tx.find(SH.DB, d.id);
    if (i < 0) throw new Error('Peserta tidak ditemukan.');
    const cur = t.obj(t.rows[i]);
    const nik = String(d.nik || '').trim();
    validNik_(nik);
    if (nik !== norm_(cur.NIK).replace(/^'/, '')) {
      const dup = readPeserta_().list.find(p => p.nik === nik && p.status === 'Aktif' && p.id !== d.id);
      if (dup) throw new Error('NIK ' + nik + ' sudah dipakai ' + dup.nama + '.');
    }
    if (!M.kel[d.kel]) throw new Error('Pilih kelompok.');
    const tgl = validYmd_(d.tanggal, 'Tanggal entry');
    const npp = M.nppByLoc[locKey_(d.kel, d.kec, d.desa)] || '';
    const n = M.npp[npp] || {};
    const nama = toTitleCase(d.nama);
    const ch = {
      'NIK': nik, 'Nama Lengkap': nama, 'Kelompok': d.kel, 'Aparat/BPD': legacyAparat_(M, d.kel), 'Kecamatan': d.kec, 'Desa': d.desa,
      'Tanggal Entry': dmy_(tgl), 'NPP': npp, 'Nama Badan Usaha': n.nama || '', 'Jenis Program': n.program || ''
    };
    if (d.ket !== undefined && cur.Status === 'Nonaktif') ch['Keterangan'] = d.ket;
    const before = { nama: cur['Nama Lengkap'], desa: cur.Desa, kel: cur.Kelompok };
    t.sh.getRange(i + 2, t.ix('NIK') + 1).setNumberFormat('@');
    t.sh.getRange(i + 2, t.ix('Tanggal Entry') + 1).setNumberFormat('@');
    if (!tx.update(SH.DB, d.id, ch)) return { message: 'Tidak ada perubahan.', logId: null, undoable: false };
    const parts = [];
    if (before.nama !== nama) parts.push('nama ' + before.nama + ' → ' + nama);
    if (before.desa !== d.desa) parts.push('desa ' + before.desa + ' → ' + d.desa);
    if (before.kel !== d.kel) parts.push('kelompok ' + before.kel + ' → ' + d.kel);
    tx.ket = nama + (parts.length ? ' · ' + parts.join(', ') : '');
    return tx.commit({ message: 'Data ' + nama + ' disimpan.' });
  });
}

function apiBebasJP(d) {

/**
 * rows: [{nik, nama, kelompok, kec, desa, tanggal('yyyy-MM-dd'), bebasJP('yyyy-MM'|''), catatan, baris}]
 * dryRun=true: hanya memeriksa.
 */
function apiImporPeserta(d) {
  const run = () => {
    const M = loadMaster_();
    const W = wilayah_();
    const P = readPeserta_().list;
    const aktifNik = {};
    P.forEach(p => { if (p.status === 'Aktif') aktifNik[p.nik] = p; });
    const kelByName = {};
    M.kelList.forEach(g => { kelByName[g.nama.toLowerCase()] = g.kode; kelByName[g.kode.toLowerCase()] = g.kode; });
    const seen = {};
    const ok = [], errors = [], sudah = [];
    (d.rows || []).forEach(r => {
      const baris = r.baris;
      const nik = String(r.nik || '').replace(/\D/g, '');
      const err = (m) => errors.push({ baris, nik, nama: r.nama, msg: m });
      if (!nik && !r.nama) return;
      if (nik.length !== 16) return err('NIK harus 16 digit');
      if (seen[nik]) return err('NIK ganda di file (baris ' + seen[nik] + ')');
      seen[nik] = baris;
      if (!String(r.nama || '').trim()) return err('Nama kosong');
      const kel = kelByName[String(r.kelompok || '').trim().toLowerCase()];
      if (!kel) return err('Kelompok "' + (r.kelompok || '') + '" tidak dikenal');
      const kec = W.kecamatan.find(k => k.toLowerCase() === String(r.kec || '').trim().toLowerCase());
      if (!kec) return err('Kecamatan "' + (r.kec || '') + '" tidak dikenal');
      const desa = (W.desa[kec] || []).find(x => x.toLowerCase() === String(r.desa || '').trim().toLowerCase());
      if (!desa) {
        const mirip = (W.desa[kec] || []).find(x => x.toLowerCase().slice(0, 4) === String(r.desa || '').trim().toLowerCase().slice(0, 4));
        return err('Desa "' + (r.desa || '') + '" tidak ada di ' + kec + (mirip ? '. Maksudnya ' + mirip + '?' : ''));
      }
      const tgl = parseDate(r.tanggal);
      if (!tgl) return err('Tanggal entry kosong/salah');
      const npp = M.nppByLoc[locKey_(kel, kec, desa)];
      if (!npp) return err('NPP ' + M.kel[kel].nama + ' Desa ' + desa + ' belum ada');
      if (aktifNik[nik]) { sudah.push({ baris, nik, nama: r.nama, msg: 'Sudah aktif: ' + aktifNik[nik].nama + ' (' + aktifNik[nik].desa + ')' }); return; }
      ok.push({ baris, nik, nama: toTitleCase(r.nama), kel, kec, desa, tgl, npp, bebasJP: ym_(r.bebasJP) || '' });
    });
    const res = { siap: ok.length, errors, sudah, contoh: ok.slice(0, 5).map(o => ({ baris: o.baris, nama: o.nama, kel: M.kel[o.kel].nama, desa: o.desa, npp: o.npp })) };
    if (d.dryRun) return res;
    if (!ok.length) throw new Error('Tidak ada baris yang siap disimpan.');
    const tx = new Tx('Impor peserta', ok.length + ' peserta dari ' + (d.fileName || 'file'));
    tx.insertMany(SH.DB, ok.map(o => {
      const n = M.npp[o.npp];
      return {
        'ID': uuid_(), 'Status': 'Aktif', 'NIK': o.nik, 'Nama Lengkap': o.nama, 'Aparat/BPD': legacyAparat_(M, o.kel), 'Kelompok': o.kel,
        'Kecamatan': o.kec, 'Desa': o.desa, 'Tanggal Entry': dmy_(o.tgl), 'Keterangan': '', 'Jenis Program': n.program,
        'NPP': o.npp, 'Nama Badan Usaha': n.nama, 'Bebas JP Mulai': o.bebasJP, 'Ket. Bebas JP': o.bebasJP ? 'Usia pensiun (impor)' : ''
      };
    }), { 'NIK': '@', 'NPP': '@', 'Tanggal Entry': '@', 'Bebas JP Mulai': '@' });
    return tx.commit(Object.assign(res, { message: ok.length + ' peserta diimpor.' }));
  };
  return d.dryRun ? run() : withLock_(run);
}

/** Template Excel dengan daftar kelompok, kecamatan, dan desa terbaru. */
function apiTemplateImpor() {
  const M = loadMaster_();

    isi.getRange(2, 1, 1, head.length).setValues([['3528011204650001', 'Contoh Nama', kel[0][0], W.kecamatan[0] || '', (W.desa[W.kecamatan[0]] || [''])[0], '01/11/2026', '', 'CONTOH - baris 2 tidak diimpor']])
      .setFontStyle('italic').setFontColor('#6b7a70').setBackground('#f2f2f2');

function exportXlsx_(ssId, name) {
  const url = 'https://www.googleapis.com/drive/v3/files/' + ssId + '/export?mimeType=application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const resp = UrlFetchApp.fetch(url, { headers: { Authorization: 'Bearer ' + ScriptApp.getOAuthToken() }, muteHttpExceptions: true });
  if (resp.getResponseCode() !== 200) throw new Error('Ekspor .xlsx gagal (kode ' + resp.getResponseCode() + ').');
  return resp.getBlob().setName(name);
}

/**
 * MyTagihan Desa v2 — Acuan.gs
 * Kelompok, acuan upah & tarif JKK (per kelompok / per NPP), data NPP, keringanan, pengaturan, target.
 */

function apiKelompokList() {
  const M = loadMaster_();
  const ym = nowYm_();
  const P = readPeserta_().list;
  const aktif = {};
  P.forEach(p => { if (p.status === 'Aktif') { const k = (M.npp[nppOf_(M, p)] || {}).kel || kelOf_(p); aktif[k] = (aktif[k] || 0) + 1; } });
  return M.kelList.map(g => {
    const npps = Object.keys(M.npp).filter(n => M.npp[n].kel === g.kode && M.npp[n].aktif);
    const kU = acuanFor_(M, 'Upah', '', g.kode, ym);
    const kJ = acuanFor_(M, 'Tarif JKK', '', g.kode, ym);
    const khusus = npps.filter(n => acuanFor_(M, 'Upah', n, g.kode, ym).sumber === 'NPP' || (g.jenis === 'PU' && acuanFor_(M, 'Tarif JKK', n, g.kode, ym).sumber === 'NPP')).length;
    const hist = M.acuan.filter(a => a.tingkat === 'Kelompok' && a.kode === g.kode).slice(-6).reverse()
      .map(a => ({ jenis: a.jenis, nilai: a.nilai, mulai: a.mulai, oleh: a.oleh }));
    const nanti = M.acuan.filter(a => a.tingkat === 'Kelompok' && a.kode === g.kode && a.mulai > ym).map(a => ({ jenis: a.jenis, nilai: a.nilai, mulai: a.mulai }));
    const ker = M.ker.filter(k => k.aktif && k.selesai >= ym && (k.kelompok.indexOf(g.kode) >= 0 || k.kelompok.indexOf(g.grup) >= 0)).map(k => ({ nama: k.nama, pct: k.pct, komponen: k.komponen, mulai: k.mulai, selesai: k.selesai }));
    return {
      kode: g.kode, nama: g.nama, jenis: g.jenis, induk: g.induk, programAwal: g.programAwal,
      upah: kU.nilai, tarifJKK: g.jenis === 'PU' ? kJ.nilai : null, npp: npps.length, khusus, aktif: aktif[g.kode] || 0,
      riwayat: hist, nanti, keringanan: ker
    };
  });
}

function validAcuan_(M, kel, jenis, nilai) {
  const g = M.kel[kel];
  if (!g) throw new Error('Kelompok tidak dikenal.');
  if (jenis === 'Upah') {
    if (!(nilai > 0)) throw new Error('Acuan upah harus diisi.');
    if (g.jenis === 'BPU' && nilai < 1000000) throw new Error('Acuan upah ' + g.nama + ' paling rendah Rp1.000.000.');
    if (nilai > 50000000) throw new Error('Acuan upah terlalu besar. Periksa lagi angkanya.');
  } else if (jenis === 'Tarif JKK') {
    if (g.jenis === 'BPU') throw new Error('Tarif JKK BPU diatur di sheet tarif.');
    if (!(nilai >= 0.1 && nilai <= 2)) throw new Error('Tarif JKK harus antara 0,10% dan 2,00%.');
  } else throw new Error('Jenis acuan tidak dikenal.');
}

/** Ubah acuan untuk satu kelompok. samakan=true: NPP yang punya nilai khusus ikut nilai kelompok. */
function apiUbahAcuanKelompok(d) {
  return withLock_(() => {
    const M = loadMaster_();
    const nilai = num_(d.nilai);
    validAcuan_(M, d.kode, d.jenis, nilai);
    const mulai = ym_(d.mulai);
    if (!mulai) throw new Error('Pilih bulan mulai berlaku.');
    const g = M.kel[d.kode];
    const tx = new Tx('Ubah ' + (d.jenis === 'Upah' ? 'acuan upah' : 'tarif JKK') + ' kelompok', '');
    const rows = [{ ID: uuid_(), Jenis: d.jenis, Tingkat: 'Kelompok', Kode: d.kode, Nilai: nilai, 'Berlaku Mulai': mulai, 'Dicatat Oleh': currentUser_(), Waktu: new Date() }];
    let reset = 0;
    if (d.samakan) {
      Object.keys(M.npp).filter(n => M.npp[n].kel === d.kode).forEach(n => {
        if (acuanFor_(M, d.jenis, n, d.kode, mulai).sumber === 'NPP') {
          rows.push({ ID: uuid_(), Jenis: d.jenis, Tingkat: 'NPP', Kode: n, Nilai: '', 'Berlaku Mulai': mulai, 'Dicatat Oleh': currentUser_(), Waktu: new Date() });
          reset++;
        }
      });
    }
    tx.insertMany(SH.ACU, rows, { 'Kode': '@', 'Berlaku Mulai': '@' });
    const lama = acuanFor_(M, d.jenis, '', d.kode, mulai).nilai;
    tx.ket = g.nama + ' · ' + fmtAcuan_(d.jenis, lama) + ' → ' + fmtAcuan_(d.jenis, nilai) + ' mulai ' + namaBulan_(mulai).toLowerCase() + (reset ? ' · ' + reset + ' NPP khusus disamakan' : '');
    return tx.commit({ message: (d.jenis === 'Upah' ? 'Acuan upah ' : 'Tarif JKK ') + g.nama + ' disimpan, berlaku ' + namaBulan_(mulai).toLowerCase() + '.' });
  });
}

function fmtAcuan_(jenis, v) {
  if (v === null || v === undefined) return '(kosong)';
  return jenis === 'Upah' ? 'Rp' + Math.round(v).toLocaleString('id-ID') : String(v).replace('.', ',') + '%';
}

function apiNppList(f) {
  f = f || {};
  const M = loadMaster_();
  const ym = nowYm_();
  const P = readPeserta_().list;
  const count = {};
  P.forEach(p => { if (p.status === 'Aktif') { const n = nppOf_(M, p); if (n) count[n] = (count[n] || 0) + 1; } });
  const q = String(f.q || '').toLowerCase().trim();
  const set = M.set;
  const out = [];
  Object.keys(M.npp).forEach(n => {
    const r = M.npp[n];
    const g = M.kel[r.kel] || { nama: r.kel, jenis: 'PU' };
    if (f.kel && r.kel !== f.kel) return;
    if (f.kec && r.kec !== f.kec) return;
    if (f.desa && r.desa !== f.desa) return;
    if (f.bpuTanpaKode && !(g.jenis === 'BPU' && !r.kodeBayar && r.aktif)) return;
    if (q && (n + ' ' + r.nama + ' ' + r.desa + ' ' + r.kec).toLowerCase().indexOf(q) === -1) return;
    const u = acuanFor_(M, 'Upah', n, r.kel, ym);
    const j = g.jenis === 'PU' ? acuanFor_(M, 'Tarif JKK', n, r.kel, ym) : { nilai: null, sumber: '' };
    out.push({
      npp: n, kel: r.kel, kelNama: g.nama, jenis: g.jenis, kec: r.kec, desa: r.desa, nama: r.nama, program: r.program,
      kodeBayar: r.kodeBayar, kodeOtomatis: g.jenis === 'PU' ? String(set.KODE_BAYAR_AWALAN || '035004') + n + String(set.KODE_BAYAR_AKHIRAN || '000') : '',
      aktif: r.aktif, tk: count[n] || 0, upah: u.nilai, upahSumber: u.sumber, jkk: j.nilai, jkkSumber: j.sumber
    });
  });
  out.sort((a, b) => a.kec.localeCompare(b.kec) || a.desa.localeCompare(b.desa) || (M.kel[a.kel] || {}).urutan - (M.kel[b.kel] || {}).urutan);
  return { items: out.slice(0, Number(f.limit) || 300), total: out.length };
}

/** Tambah NPP baru atau ubah data satu NPP (termasuk acuan/tarif khusus). */
function apiSimpanNpp(d) {
  return withLock_(() => {
    const M = loadMaster_();
    const npp = String(d.npp || '').trim();
    if (!/^\d{5,12}$/.test(npp)) throw new Error('NPP harus angka (5–12 digit).');
    if (!M.kel[d.kel]) throw new Error('Pilih kelompok.');
    if (!d.kec || !d.desa) throw new Error('Pilih kecamatan dan desa.');
    if (['2P', '3P', '4P'].indexOf(d.program) === -1) throw new Error('Pilih jenis program.');
    if (M.kel[d.kel].jenis === 'BPU' && d.program === '4P') throw new Error('BPU tidak memiliki program JP (4P).');
    const g = M.kel[d.kel];
    const nama = String(d.nama || '').trim() || (g.nama + ' Desa ' + d.desa + ' Kecamatan ' + d.kec);
    const kode = String(d.kodeBayar || '').replace(/\D/g, '');
    const lain = M.nppByLoc[locKey_(d.kel, d.kec, d.desa)];
    const tx = new Tx(d.isNew ? 'Tambah NPP' : 'Ubah NPP', npp + ' · ' + nama);
    const rec = { 'NPP': npp, 'Kelompok': d.kel, 'Kecamatan': d.kec, 'Desa': d.desa, 'Nama Badan Usaha': nama, 'Jenis Program': d.program, 'Kode Bayar': kode, 'Status': d.status || 'Aktif' };
    if (d.isNew) {
      if (M.npp[npp]) throw new Error('NPP ' + npp + ' sudah ada.');
      if (lain && M.npp[lain].aktif) throw new Error(g.nama + ' Desa ' + d.desa + ' sudah punya NPP ' + lain + '.');
      tx.insert(SH.NPP, rec, { 'NPP': '@', 'Kode Bayar': '@' });
    } else {
      if (!M.npp[npp]) throw new Error('NPP tidak ditemukan.');
      tx.update(SH.NPP, npp, rec);
    }
    // Acuan khusus NPP (opsional)
    const mulai = ym_(d.mulai) || nowYm_();
    const acu = [];
    ['Upah', 'Tarif JKK'].forEach(j => {
      const key = j === 'Upah' ? 'upahKhusus' : 'jkkKhusus';
      if (!(key in d)) return;
      const cur = acuanFor_(M, j, npp, d.kel, mulai);
      if (d[key] === null || d[key] === '') {
        if (cur.sumber === 'NPP') acu.push({ ID: uuid_(), Jenis: j, Tingkat: 'NPP', Kode: npp, Nilai: '', 'Berlaku Mulai': mulai, 'Dicatat Oleh': currentUser_(), Waktu: new Date() });
      } else {
        const v = num_(d[key]);
        validAcuan_(M, d.kel, j, v);
        if (!(cur.sumber === 'NPP' && cur.nilai === v)) acu.push({ ID: uuid_(), Jenis: j, Tingkat: 'NPP', Kode: npp, Nilai: v, 'Berlaku Mulai': mulai, 'Dicatat Oleh': currentUser_(), Waktu: new Date() });
      }
    });
    if (acu.length) tx.insertMany(SH.ACU, acu, { 'Kode': '@', 'Berlaku Mulai': '@' });
    if (!tx.details.length) return { message: 'Tidak ada perubahan.', logId: null, undoable: false };
    // Sinkronkan Nama BU & program di Database (kolom informasi)
    syncDbNpp_(tx, npp, nama, d.program);
    return tx.commit({ message: 'NPP ' + npp + ' disimpan.' });
  });
}

function syncDbNpp_(tx, npp, nama, program) {
  const t = tx.t(SH.DB);
  const iN = t.ix('NPP'), iB = t.ix('Nama Badan Usaha'), iP = t.ix('Jenis Program'), iId = t.ix('ID');
  if (iN < 0 || iId < 0) return;
  t.rows.forEach(r => {
    if (norm_(r[iN]) === npp && (norm_(r[iB]) !== nama || norm_(r[iP]) !== program)) {
      tx.update(SH.DB, norm_(r[iId]), { 'Nama Badan Usaha': nama, 'Jenis Program': program });
    }
  });
}

/** Ubah beberapa NPP sekaligus: field = 'program' | 'Upah' | 'Tarif JKK' | 'status'. nilai null = ikut kelompok. */
function apiUbahNppMassal(d) {
  return withLock_(() => {
    const M = loadMaster_();
    const npps = (d.npps || []).map(String).filter(n => M.npp[n]);
    if (!npps.length) throw new Error('Pilih minimal satu NPP.');
    const tx = new Tx('Ubah NPP sekaligus', '');
    const mulai = ym_(d.mulai) || nowYm_();
    if (d.field === 'program') {
      if (['2P', '3P', '4P'].indexOf(d.nilai) === -1) throw new Error('Pilih program.');
      npps.forEach(n => {
        if (M.kel[M.npp[n].kel].jenis === 'BPU' && d.nilai === '4P') return;
        tx.update(SH.NPP, n, { 'Jenis Program': d.nilai });
        syncDbNpp_(tx, n, M.npp[n].nama, d.nilai);
      });
      tx.ket = npps.length + ' NPP · program → ' + d.nilai;
    } else if (d.field === 'status') {
      npps.forEach(n => tx.update(SH.NPP, n, { 'Status': d.nilai === 'Nonaktif' ? 'Nonaktif' : 'Aktif' }));
      tx.ket = npps.length + ' NPP · status → ' + d.nilai;
    } else if (d.field === 'Upah' || d.field === 'Tarif JKK') {
      const v = d.nilai === null || d.nilai === '' ? '' : num_(d.nilai);
      const rows = [];
      npps.forEach(n => {
        if (v !== '') validAcuan_(M, M.npp[n].kel, d.field, v);
        rows.push({ ID: uuid_(), Jenis: d.field, Tingkat: 'NPP', Kode: n, Nilai: v, 'Berlaku Mulai': mulai, 'Dicatat Oleh': currentUser_(), Waktu: new Date() });
      });
      tx.insertMany(SH.ACU, rows, { 'Kode': '@', 'Berlaku Mulai': '@' });
      tx.ket = npps.length + ' NPP · ' + (d.field === 'Upah' ? 'acuan upah' : 'tarif JKK') + ' → ' + (v === '' ? 'ikut kelompok' : fmtAcuan_(d.field, v)) + ' mulai ' + namaBulan_(mulai).toLowerCase();
    } else throw new Error('Pilihan tidak dikenal.');
    if (!tx.details.length) return { message: 'Tidak ada perubahan.', logId: null, undoable: false };
    return tx.commit({ message: npps.length + ' NPP diubah.' });
  });
}

function apiKeringananList() {
  const M = loadMaster_();
  const ym = nowYm_();
  const nama = (c) => (M.kel[c] || {}).nama || (c === 'LKD' ? 'LKD (semua)' : c);
  const items = M.ker.map(k => ({
    id: k.id, nama: k.nama, kelompok: k.kelompok, kelompokNama: k.kelompok.map(nama).join(', '), komponen: k.komponen,
    pct: k.pct, mulai: k.mulai, selesai: k.selesai === '9999-12' ? '' : k.selesai, dasar: k.dasar,
    keadaan: !k.aktif ? 'selesai' : k.mulai > ym ? 'nanti' : k.selesai < ym ? 'selesai' : 'berlaku'
  }));
  return { items };
}

function apiTambahKeringanan(d) {
  return withLock_(() => {
    const M = loadMaster_();
    const kel = (d.kelompok || []).filter(c => M.kel[c] || c === 'LKD');
    if (!kel.length) throw new Error('Pilih minimal satu kelompok.');
    const komp = (d.komponen || []).filter(c => ['JKK', 'JKM', 'JHT', 'JP'].indexOf(c) >= 0);
    if (!komp.length) throw new Error('Pilih komponen iuran yang diberi keringanan.');
    const pct = num_(d.pct);
    if (!(pct > 0 && pct <= 100)) throw new Error('Potongan harus 1–100%.');
    const mulai = ym_(d.mulai), selesai = ym_(d.selesai);
    if (!mulai) throw new Error('Isi bulan mulai.');
    if (selesai && selesai < mulai) throw new Error('Bulan selesai sebelum bulan mulai.');
    const nama = String(d.nama || '').trim() || ('Keringanan ' + pct + '%');
    const tx = new Tx('Tambah keringanan', nama + ' · ' + kel.join(', ') + ' · ' + komp.join('+') + ' ' + pct + '% · ' + mulai + ' s.d. ' + (selesai || 'tanpa batas'));
    tx.insert(SH.KER, { ID: uuid_(), Nama: nama, Kelompok: kel.join(','), Komponen: komp.join(','), 'Potongan (%)': pct, Mulai: mulai, Selesai: selesai, Dasar: d.dasar || '', Status: 'Aktif' }, { 'Mulai': '@', 'Selesai': '@' });
    return tx.commit({ message: 'Keringanan "' + nama + '" disimpan.' });
  });
}

function apiAkhiriKeringanan(d) {
  return withLock_(() => {
    const tx = new Tx('Akhiri keringanan', '');
    const t = tx.t(SH.KER);
    const i = tx.find(SH.KER, d.id);
    if (i < 0) throw new Error('Keringanan tidak ditemukan.');
    const nama = t.rows[i][t.ix('Nama')];
    const selesai = ym_(d.selesai);
    if (selesai) tx.update(SH.KER, d.id, { Selesai: selesai });
    else tx.update(SH.KER, d.id, { Status: 'Diakhiri' });
    tx.ket = nama + (selesai ? ' · selesai ' + selesai : ' · dihentikan');
    return tx.commit({ message: 'Keringanan "' + nama + '" ' + (selesai ? 'berakhir ' + namaBulan_(selesai).toLowerCase() : 'dihentikan') + '.' });
  });
}

const SETTING_KEYS = ['BATAS_UPAH_JP', 'TTD1_JUDUL', 'TTD1_NAMA', 'TTD1_JABATAN', 'TTD2_JUDUL', 'TTD2_NAMA', 'TTD2_JABATAN',
  'KODE_BAYAR_AWALAN', 'KODE_BAYAR_AKHIRAN', 'JUDUL_TAGIHAN', 'JUDUL_LAPORAN', 'UNIT', 'PENGGUNA'];

function apiPengaturan() {
  const s = settings_();
  const out = {};
  SETTING_KEYS.forEach(k => { out[k] = s[k] === undefined || s[k] === null ? '' : String(s[k]); });
  let url = '';
  try { url = ScriptApp.getService().getUrl(); } catch (e) { /* belum deploy */ }
  out._webAppUrl = url;
  out._user = currentUser_();
  return out;
}

function apiSimpanPengaturan(d) {
  return withLock_(() => {
    ensureSheet_(SH.SET, SCHEMA.pengaturan);
    const tx = new Tx('Ubah pengaturan', '');
    const t = tx.t(SH.SET);
    const changed = [];
    Object.keys(d || {}).forEach(k => {
      if (SETTING_KEYS.indexOf(k) === -1) return;
      let v = String(d[k] === null || d[k] === undefined ? '' : d[k]).trim();
      if (k === 'BATAS_UPAH_JP' && v) { const n = num_(v); if (!(n > 0)) throw new Error('Batas upah JP harus angka.'); v = n; }
      if (tx.find(SH.SET, k) < 0) tx.insert(SH.SET, { Kunci: k, Nilai: v, Keterangan: '' });
      else if (tx.update(SH.SET, k, { Nilai: v })) changed.push(k);
    });
    void t;
    if (!tx.details.length) return { message: 'Tidak ada perubahan.', logId: null, undoable: false };
    tx.ket = changed.join(', ');
    return tx.commit({ message: 'Pengaturan disimpan.' });
  });
}

/** Grup kelompok untuk laporan & target: kode kelompok, atau induknya (LKD). */
function grupList_(M) {
  const seen = {}, out = [];
  M.kelList.forEach(g => { if (!seen[g.grup]) { seen[g.grup] = 1; out.push({ key: g.grup, nama: g.induk ? g.induk : g.nama, lengkap: g.lengkap }); } });
  return out;
}

function targetMap_() {
  const sh = getSS().getSheetByName(SH.POT);
  const m = {};
  if (!sh || sh.getLastRow() < 2) return m;
  sh.getRange(2, 1, sh.getLastRow() - 1, 5).getValues().forEach(r => { if (r[0] && r[4] !== '' && r[4] !== null) m[String(r[0])] = num_(r[4]); });
  return m;
}
function targetKey_(kec, desa, grup) { return [kec, desa, grup].join('|'); }

function apiTarget(d) {
  const M = loadMaster_();
  const W = wilayah_();
  const T = targetMap_();
  const grup = grupList_(M);
  const desa = (W.desa[d.kec] || []).map(x => ({ desa: x, target: grup.map(g => { const v = T[targetKey_(d.kec, x, g.key)]; return v === undefined ? '' : v; }) }));
  return { kec: d.kec, grup, desa };
}

function apiSimpanTarget(d) {
  return withLock_(() => {
    ensureSheet_(SH.POT, SCHEMA.potensi);
    const tx = new Tx('Ubah target', d.kec);
    let n = 0;
    (d.items || []).forEach(it => {
      const key = targetKey_(d.kec, it.desa, it.grup);
      const v = it.target === '' || it.target === null ? '' : Math.max(0, Math.round(num_(it.target)));
      if (tx.find(SH.POT, key) < 0) {
        if (v === '') return;
        tx.insert(SH.POT, { Kunci: key, Kecamatan: d.kec, Desa: it.desa, Kelompok: it.grup, Target: v });
        n++;
      } else if (tx.update(SH.POT, key, { Target: v })) n++;
    });
    if (!n) return { message: 'Tidak ada perubahan.', logId: null, undoable: false };
    tx.ket = d.kec + ' · ' + n + ' isian';
    return tx.commit({ message: 'Target ' + d.kec + ' disimpan (' + n + ' isian).' });
  });
}
