/**
 * MyTagihan Desa v2 — Tagihan.gs
 * Tagihan per kelompok (bulanan/triwulan), Trf Bank Jatim (PU & BPU), Lampiran Triwulan,
 * arsip .xlsx, PDF, dan saldo IBR.
 */

const C_HEAD = '#274e13', C_GROUP = '#e2efe4', C_SUB = '#f1f4f0', C_TRF = '#b03232';
const FMT_N = '#,##0';

// ---------------------------------------------------------------------------
//  Saldo IBR
// ---------------------------------------------------------------------------

/** Sheet IBR: kolom B = NPP, kolom J = IJT (saldo). */
function ibrSaldo_() {
  const m = {};
  const sh = getSS().getSheetByName(SH.IBR);
  if (!sh || sh.getLastRow() < 2) return m;
  sh.getRange(2, 1, sh.getLastRow() - 1, Math.max(10, Math.min(sh.getLastColumn(), 10))).getValues().forEach(r => {
    const npp = norm_(r[1]);
    if (npp) m[npp] = Math.round(num_(r[9]));
  });
  return m;
}

function arsipSaldoSheet_(npps) {
  const ss = getSS();
  let sh = ss.getSheetByName(SH.ARSIP);
  if (!sh) { sh = ss.insertSheet(SH.ARSIP); sh.getRange(1, 1).setValue('NPP').setFontWeight('bold'); }
  const last = sh.getLastRow();
  const have = last > 1 ? sh.getRange(2, 1, last - 1, 1).getValues().map(r => norm_(r[0])) : [];
  const add = npps.filter(n => n && have.indexOf(n) === -1);
  if (add.length) {
    sh.getRange(last + 1, 1, add.length, 1).setNumberFormat('@').setValues(add.map(n => [n]));
  }
  return sh;
}

/** Menyimpan saldo bulan berjalan ke kolom "NAMA BULAN TAHUN" (ditimpa bila sudah ada). */
function arsipkanSaldo_(saldo, title, allNpp) {
  const sh = arsipSaldoSheet_(Object.keys(saldo).concat(allNpp));
  const lastCol = sh.getLastColumn();
  const heads = sh.getRange(1, 1, 1, lastCol).getDisplayValues()[0].map(h => String(h).trim().toUpperCase());
  let col = heads.indexOf(title.toUpperCase()) + 1;
  if (!col) col = lastCol + 1;
  sh.getRange(1, col).setValue(title).setFontWeight('bold');
  const n = sh.getLastRow() - 1;
  if (n > 0) {
    const npps = sh.getRange(2, 1, n, 1).getValues().map(r => norm_(r[0]));
    sh.getRange(2, col, n, 1).setValues(npps.map(k => [saldo[k] || 0])).setNumberFormat(FMT_N);
  }
}

function saldoTriwulan_(titles) {
  const out = {};
  const sh = getSS().getSheetByName(SH.ARSIP);
  if (!sh || sh.getLastRow() < 2) return out;
  const v = sh.getDataRange().getValues();
  const heads = sh.getRange(1, 1, 1, sh.getLastColumn()).getDisplayValues()[0].map(h => String(h).trim().toUpperCase());
  const cols = titles.map(t => heads.indexOf(t.toUpperCase()));
  v.slice(1).forEach(r => {
    const npp = norm_(r[0]);
    if (!npp) return;
    out[npp] = cols.map(c => (c < 0 ? 0 : Math.round(num_(r[c]))));
  });
  return out;
}

function apiInfoIbr() {
  const sh = getSS().getSheetByName(SH.IBR);
  const meta = PropertiesService.getScriptProperties().getProperty('IBR_LAST_IMPORT');
  return { exists: !!sh, rows: sh ? Math.max(sh.getLastRow() - 1, 0) : 0, lastImport: meta ? JSON.parse(meta) : null };
}

/** rows = isi sheet pertama file IBR (baris 1 judul). Isi sheet IBR diganti, cadangan disimpan. */
function apiImporIbr(d) {
  return withLock_(() => {
    const rows = d.rows || [];
    if (rows.length < 2) throw new Error('File IBR kosong.');
    const width = Math.max.apply(null, rows.map(r => r.length));
    if (width < 10) throw new Error('File IBR harus punya minimal 10 kolom (NPP di kolom B, IJT di kolom J).');
    const withNpp = rows.slice(1).filter(r => String(r[1] || '').trim()).length;
    if (!withNpp) throw new Error('Kolom B (NPP) kosong semua. Periksa susunan file.');
    const grid = rows.map(r => { const o = r.slice(0, width).map(v => (v === null || v === undefined ? '' : v)); while (o.length < width) o.push(''); return o; });
    const ss = getSS();
    let sh = ss.getSheetByName(SH.IBR);
    if (!sh) sh = ss.insertSheet(SH.IBR);
    // Cadangan untuk Batalkan
    const old = ss.getSheetByName(SH.IBR_BAK);
    if (old) ss.deleteSheet(old);
    sh.copyTo(ss).setName(SH.IBR_BAK).hideSheet();
    sh.clearContents();
    sh.getRange(1, 2, grid.length, 1).setNumberFormat('@');
    sh.getRange(1, 1, grid.length, width).setValues(grid);
    const meta = { at: new Date().toISOString(), file: String(d.fileName || '').slice(0, 80), rows: grid.length - 1, npp: withNpp, user: currentUser_() };
    PropertiesService.getScriptProperties().setProperty('IBR_LAST_IMPORT', JSON.stringify(meta));
    const tx = new Tx('Impor IBR', withNpp + ' NPP dari ' + (d.fileName || 'file'));
    tx.replaced(SH.IBR, SH.IBR_BAK);
    return tx.commit({ meta, message: 'IBR diperbarui: ' + withNpp + ' NPP dari ' + (grid.length - 1) + ' baris.' });
  });
}

// ---------------------------------------------------------------------------
//  Tagihan
// ---------------------------------------------------------------------------

function periode_(periode, bulan) {
  const ym0 = ym_(bulan);
  if (!ym0) throw new Error('Bulan & tahun tidak valid.');
  const months = periode === 'Triwulan' ? [ym0, addMonths_(ym0, 1), addMonths_(ym0, 2)] : [ym0];
  const title = months.length === 1 ? namaBulan_(ym0) : namaBulan_(months[0]) + ' S.D. ' + namaBulan_(months[2]);
  return { months, title };
}

function kelLabel_(M, codes) {
  const all = M.kelList.map(g => g.kode);
  if (codes.length === all.length) return { nama: 'Semua kelompok', kode: 'SEMUA' };
  return { nama: codes.map(c => M.kel[c].nama).join(', '), kode: codes.join('+') };
}

/** Menghitung tagihan per NPP. */
function hitungTagihan_(M, P, months, sel, saldoFn) {
  const by = {};
  const masalah = {};
  let tanpaNpp = 0;
  const kerTotal = {};
  months.forEach((ym, i) => {
    const end = monthEnd_(ym);
    P.forEach(p => {
      if (!billable_(p, end)) return;
      const npp = nppOf_(M, p);
      if (!npp) { if (sel[kelOf_(p)]) tanpaNpp++; return; }
      const n = M.npp[npp];
      if (!sel[n.kel]) return;
      const r = iuranOrang_(M, p, ym);
      if (r.error) { masalah[r.error] = (masalah[r.error] || 0) + 1; return; }
      if (!by[npp]) by[npp] = { npp, kel: n.kel, nama: n.nama, program: n.program, kec: n.kec, desa: n.desa, months: months.map(() => ({ tk: 0, normal: 0, ker: 0, net: 0, saldo: 0, bjp: 0 })) };
      const m = by[npp].months[i];
      m.tk++; m.normal += r.normal; m.ker += r.potongan; m.net += r.net; if (r.bebasJP) m.bjp++;
      if (r.potongan) r.ker.forEach(k => { kerTotal[k] = (kerTotal[k] || 0) + r.potongan / r.ker.length; });
    });
  });
  const err = Object.keys(masalah);
  if (err.length) throw new Error('Tagihan belum bisa dibuat: ' + err.map(e => e + ' (' + masalah[e] + ' peserta)').join('; ') + '.');
  // Saldo, termasuk NPP yang hanya punya saldo
  Object.keys(M.npp).forEach(npp => {
    const n = M.npp[npp];
    if (!sel[n.kel]) return;
    const s = saldoFn(npp);
    if (!s.some(v => v)) return;
    if (!by[npp]) by[npp] = { npp, kel: n.kel, nama: n.nama, program: n.program, kec: n.kec, desa: n.desa, months: months.map(() => ({ tk: 0, normal: 0, ker: 0, net: 0, saldo: 0, bjp: 0 })) };
    by[npp].months.forEach((m, i) => { m.saldo = s[i] || 0; });
  });
  Object.keys(by).forEach(k => { const g = by[k]; g.total = g.months.reduce((a, m) => a + m.net - m.saldo, 0); });
  return { by, tanpaNpp, kerTotal };
}

function apiBuatTagihan(d) {
  return withLock_(() => {
    const M = loadMaster_();
    const codes = (d.kelompok || []).filter(c => M.kel[c]);
    if (!codes.length) throw new Error('Pilih minimal satu kelompok.');
    if (['Bulanan', 'Triwulan'].indexOf(d.periode) === -1) throw new Error('Pilih periode.');
    const sel = {}; codes.forEach(c => { sel[c] = true; });
    const per = periode_(d.periode, d.bulan);
    const P = readPeserta_().list;
    let saldoFn;
    if (d.periode === 'Bulanan') {
      const s = ibrSaldo_();
      arsipkanSaldo_(s, per.title, Object.keys(M.npp));
      saldoFn = (npp) => [s[npp] || 0];
    } else {
      const s = saldoTriwulan_(per.months.map(namaBulan_));
      saldoFn = (npp) => s[npp] || [0, 0, 0];
    }
    const H = hitungTagihan_(M, P, per.months, sel, saldoFn);
    const list = Object.keys(H.by).map(k => H.by[k]).filter(g => g.months.some(m => m.net > 0 || m.saldo > 0));
    const label = kelLabel_(M, codes);
    const groups = M.kelList.filter(g => sel[g.kode]).map(g => {
      const rows = list.filter(r => r.kel === g.kode).sort((a, b) => a.kec.localeCompare(b.kec) || a.desa.localeCompare(b.desa));
      const sub = { tk: 0, normal: 0, ker: 0, net: 0, saldo: 0, total: 0 };
      rows.forEach(r => {
        const last = r.months[r.months.length - 1];
        sub.tk += last.tk;
        r.months.forEach(m => { sub.normal += m.normal; sub.ker += m.ker; sub.net += m.net; sub.saldo += m.saldo; });
        sub.total += r.total;
      });
      return { kode: g.kode, nama: g.nama, jenis: g.jenis, rows, sub };
    }).filter(g => g.rows.length);

    const tot = { tk: 0, normal: 0, ker: 0, net: 0, saldo: 0, total: 0, npp: 0 };
    groups.forEach(g => { Object.keys(g.sub).forEach(k => { tot[k] += g.sub[k]; }); tot.npp += g.rows.length; });
    const prog = { '2P': 0, '3P': 0, '4P': 0 };
    let bjp = 0;
    groups.forEach(g => g.rows.forEach(r => { const l = r.months[r.months.length - 1]; prog[r.program] = (prog[r.program] || 0) + l.tk; bjp += l.bjp; }));
    const kerList = Object.keys(H.kerTotal).map(k => ({ nama: k, total: Math.round(H.kerTotal[k]) }));

    tulisTagihan_(M, d.periode, per, label, groups, tot, prog, bjp, kerList);
    if (d.periode === 'Bulanan') tulisTransfer_(M, per, label, groups);
    SpreadsheetApp.flush();

    const fileName = 'Tagihan Iuran Desa (' + per.title + ') - ' + label.kode + '.xlsx';
    let fileExists = false;
    try { fileExists = folder_().getFilesByName(fileName).hasNext(); } catch (e) { /* aplikasi tanpa Drive: diperiksa saat mengarsip */ }
    const tx = new Tx('Buat tagihan', d.periode + ' ' + per.title + ' · ' + label.nama + ' · Rp' + Math.round(tot.total).toLocaleString('id-ID'), false);
    tx.commit();
    return {
      periode: d.periode, bulan: per.months[0], months: per.months, title: per.title, kelompok: codes, kelompokNama: label.nama,
      fileName, fileExists, tanpaNpp: H.tanpaNpp, totals: tot, program: prog, bebasJP: bjp, keringanan: kerList,
      groups: groups.map(g => ({
        kode: g.kode, nama: g.nama, jenis: g.jenis, sub: g.sub,
        rows: g.rows.map(r => ({ npp: r.npp, nama: r.nama, kec: r.kec, desa: r.desa, program: r.program, total: r.total, months: r.months }))
      }))
    };
  });
}

function ttd_(sh, row, colL, colR) {
  const s = settings_();
  const put = (c, a, b, j) => {
    sh.getRange(row, c).setValue(a || '').setHorizontalAlignment('center');
    sh.getRange(row + 4, c).setValue(b || '').setHorizontalAlignment('center').setFontWeight('bold').setFontLine('underline');
    sh.getRange(row + 5, c).setValue(j || '').setHorizontalAlignment('center');
  };
  put(colL, s.TTD1_JUDUL, s.TTD1_NAMA, s.TTD1_JABATAN);
  put(colR, s.TTD2_JUDUL, s.TTD2_NAMA, s.TTD2_JABATAN);
}

function freshSheet_(name) {
  const ss = getSS();
  let sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  sh.clear();
  try { sh.getRange(1, 1, sh.getMaxRows(), sh.getMaxColumns()).breakApart(); } catch (e) { /* abaikan */ }
  return sh;
}

function tulisTagihan_(M, periode, per, label, groups, tot, prog, bjp, kerList) {
  const sh = freshSheet_(SH.TAG);
  const s = settings_();
  const tri = periode === 'Triwulan';
  let heads;
  if (!tri) heads = ['No', 'NPP', 'Nama Badan Usaha', 'Program', 'Jumlah TK', 'Iuran Normal', 'Keringanan', 'Iuran', 'Saldo Iuran', 'Total Tagihan'];
  else {
    heads = ['No', 'NPP', 'Nama Badan Usaha', 'Program'];
    per.months.forEach(ym => { const b = BLN3[Number(ym.slice(5)) - 1] + ' ' + ym.slice(0, 4); heads.push(b + ' TK', b + ' Iuran', b + ' Saldo'); });
    heads.push('Keringanan', 'Total Tagihan');
  }
  const W = heads.length;
  sh.getRange(1, 1, 1, W).merge().setValue(s.JUDUL_TAGIHAN || 'Tagihan Iuran Pemerintah Desa dan BPD Kab. Pamekasan').setFontSize(14).setFontWeight('bold').setHorizontalAlignment('center');
  sh.getRange(2, 1, 1, W).merge().setValue('PERIODE ' + per.title).setFontSize(12).setFontWeight('bold').setHorizontalAlignment('center');
  sh.getRange(3, 1, 1, W).merge().setValue('Kelompok: ' + label.nama).setHorizontalAlignment('center');
  const H0 = 5;
  sh.getRange(H0, 1, 1, W).setValues([heads]).setBackground(C_HEAD).setFontColor('white').setFontWeight('bold').setHorizontalAlignment('center').setVerticalAlignment('middle').setWrap(true);

  const out = [];
  const marks = []; // {row, type}
  let no = 0;
  const lineOf = (r) => {
    if (!tri) { const m = r.months[0]; return [++no, r.npp, r.nama, r.program, m.tk, m.normal, m.ker, m.net, m.saldo, r.total]; }
    const row = [++no, r.npp, r.nama, r.program];
    let ker = 0;
    r.months.forEach(m => { row.push(m.tk, m.net, m.saldo); ker += m.ker; });
    row.push(ker, r.total);
    return row;
  };
  const subOf = (label2, g) => {
    if (!tri) return ['', '', label2, '', g.sub.tk, g.sub.normal, g.sub.ker, g.sub.net, g.sub.saldo, g.sub.total];
    const row = ['', '', label2, ''];
    for (let i = 0; i < 3; i++) {
      let tk = 0, net = 0, sal = 0;
      g.rows.forEach(r => { tk += r.months[i].tk; net += r.months[i].net; sal += r.months[i].saldo; });
      row.push(tk, net, sal);
    }
    row.push(g.sub.ker, g.sub.total);
    return row;
  };
  groups.forEach(g => {
    marks.push({ i: out.length, type: 'group' });
    const t = [g.nama.toUpperCase() + ' (' + g.jenis + ')']; while (t.length < W) t.push('');
    out.push(t);
    g.rows.forEach(r => out.push(lineOf(r)));
    marks.push({ i: out.length, type: 'sub' });
    out.push(subOf('Subtotal ' + g.nama, g));
  });
  marks.push({ i: out.length, type: 'total' });
  const all = { rows: [].concat.apply([], groups.map(g => g.rows)), sub: tot };
  out.push(subOf('TOTAL KESELURUHAN', all));
  if (out.length) sh.getRange(H0 + 1, 1, out.length, W).setValues(out);
  const first = H0 + 1, lastRow = H0 + out.length;
  // Format
  sh.getRange(H0, 1, out.length + 1, W).setBorder(true, true, true, true, true, true);
  sh.getRange(first, 5, out.length, W - 4).setNumberFormat(FMT_N).setHorizontalAlignment('right');
  sh.getRange(first, 1, out.length, 2).setHorizontalAlignment('center').setNumberFormat('@');
  sh.getRange(first, 4, out.length, 1).setHorizontalAlignment('center');
  marks.forEach(m => {
    const r = first + m.i;
    if (m.type === 'group') sh.getRange(r, 1, 1, W).merge().setBackground(C_GROUP).setFontWeight('bold').setHorizontalAlignment('left');
    else sh.getRange(r, 1, 1, W).setBackground(m.type === 'total' ? '#d9ead3' : C_SUB).setFontWeight('bold');
  });
  // Ringkasan
  let r = lastRow + 2;
  const sum = [['Jumlah NPP ditagih', tot.npp]];
  groups.forEach(g => sum.push(['Peserta ' + g.nama, g.sub.tk]));
  sum.push(['Program 2P / 3P / 4P', prog['2P'] + ' / ' + prog['3P'] + ' / ' + prog['4P']]);
  sum.push(['Peserta Bebas JP', bjp]);
  kerList.forEach(k => sum.push(['Keringanan: ' + k.nama, 'Rp' + k.total.toLocaleString('id-ID')]));
  if (tri) sum.push(['Catatan', 'Jumlah peserta memakai bulan terakhir triwulan; kolom Iuran sudah dikurangi keringanan']);
  sh.getRange(r, 2, sum.length, 2).setValues(sum);
  sh.getRange(r, 2, sum.length, 1).setFontWeight('bold').setHorizontalAlignment('right');
  sh.getRange(r, 3, sum.length, 1).setHorizontalAlignment('left');
  ttd_(sh, r + sum.length + 1, 3, Math.max(W - 2, 6));
  sh.setColumnWidth(1, 40); sh.setColumnWidth(2, 90); sh.setColumnWidth(3, 300); sh.setColumnWidth(4, 70);
  for (let c = 5; c <= W; c++) sh.setColumnWidth(c, tri ? 90 : 110);
  sh.setFrozenRows(H0);
}

function kodeBayar_(M, npp) {
  const n = M.npp[npp];
  if (n.kodeBayar) return n.kodeBayar;
  const g = M.kel[n.kel];
  if (g && g.jenis === 'BPU') return '';
  return String(M.set.KODE_BAYAR_AWALAN || '035004') + npp + String(M.set.KODE_BAYAR_AKHIRAN || '000');
}

function tulisTransfer_(M, per, label, groups) {
  const sh = freshSheet_(SH.TRF);
  const heads = ['No', 'NPP', 'Nama Badan Usaha', 'Jumlah TK', 'Kode Pembayaran', 'Total Tagihan'];
  const W = heads.length;
  sh.getRange(1, 1, 1, W).merge().setValue('Lampiran Transfer Iuran Desa BPJS Ketenagakerjaan').setFontSize(14).setFontWeight('bold').setHorizontalAlignment('center');
  sh.getRange(2, 1, 1, W).merge().setValue('PERIODE ' + per.title).setFontSize(12).setFontWeight('bold').setHorizontalAlignment('center');
  sh.getRange(3, 1, 1, W).merge().setValue('Kelompok: ' + label.nama).setHorizontalAlignment('center');
  const H0 = 5;
  sh.getRange(H0, 1, 1, W).setValues([heads]).setBackground(C_TRF).setFontColor('white').setFontWeight('bold').setHorizontalAlignment('center');
  const out = [], marks = [], kosong = [];
  let no = 0, gtk = 0, gtot = 0;
  ['PU', 'BPU'].forEach(j => {
    const rows = [].concat.apply([], groups.filter(g => g.jenis === j).map(g => g.rows));
    if (!rows.length) return;
    marks.push({ i: out.length, type: 'group' });
    out.push([j === 'PU' ? 'PENERIMA UPAH (PU)' : 'BUKAN PENERIMA UPAH (BPU)', '', '', '', '', '']);
    let tk = 0, tot = 0;
    rows.forEach(r => {
      const kb = kodeBayar_(M, r.npp);
      if (!kb) { kosong.push(out.length); }
      out.push([++no, r.npp, r.nama, r.months[0].tk, kb || 'BELUM DIISI', r.total]);
      tk += r.months[0].tk; tot += r.total;
    });
    marks.push({ i: out.length, type: 'sub' });
    out.push(['', '', 'Subtotal ' + j, tk, '', tot]);
    gtk += tk; gtot += tot;
  });
  marks.push({ i: out.length, type: 'total' });
  out.push(['', '', 'TOTAL KESELURUHAN', gtk, '', gtot]);
  const first = H0 + 1;
  sh.getRange(first, 5, out.length, 1).setNumberFormat('@');
  sh.getRange(first, 2, out.length, 1).setNumberFormat('@');
  sh.getRange(first, 1, out.length, W).setValues(out);
  sh.getRange(H0, 1, out.length + 1, W).setBorder(true, true, true, true, true, true);
  sh.getRange(first, 4, out.length, 1).setNumberFormat(FMT_N).setHorizontalAlignment('center');
  sh.getRange(first, 6, out.length, 1).setNumberFormat(FMT_N);
  sh.getRange(first, 1, out.length, 2).setHorizontalAlignment('center');
  sh.getRange(first, 5, out.length, 1).setHorizontalAlignment('center');
  marks.forEach(m => {
    const r = first + m.i;
    if (m.type === 'group') sh.getRange(r, 1, 1, W).merge().setBackground(C_GROUP).setFontWeight('bold');
    else sh.getRange(r, 1, 1, W).setBackground(m.type === 'total' ? '#d9ead3' : C_SUB).setFontWeight('bold');
  });
  kosong.forEach(i => sh.getRange(first + i, 5).setFontColor('#b3261e').setFontWeight('bold'));
  ttd_(sh, first + out.length + 2, 3, 6);
  sh.setColumnWidth(1, 40); sh.setColumnWidth(2, 100); sh.setColumnWidth(3, 330); sh.setColumnWidth(4, 90); sh.setColumnWidth(5, 190); sh.setColumnWidth(6, 120);
  sh.setFrozenRows(H0);
  return kosong.length;
}

function apiBuatLampiran(d) {
  return withLock_(() => {
    const M = loadMaster_();
    const codes = (d.kelompok || []).filter(c => M.kel[c]);
    if (!codes.length) throw new Error('Pilih minimal satu kelompok.');
    const sel = {}; codes.forEach(c => { sel[c] = true; });
    const per = periode_('Triwulan', d.bulan);
    const P = readPeserta_().list;
    const rows = [];
    const totals = [0, 0, 0, 0];
    P.forEach(p => {
      const npp = nppOf_(M, p);
      if (!npp || !sel[M.npp[npp].kel]) return;
      const per3 = per.months.map(ym => billable_(p, monthEnd_(ym)) ? iuranOrang_(M, p, ym) : null);
      if (!per3.some(Boolean)) return;
      const bad = per3.find(r => r && r.error);
      if (bad) throw new Error('Lampiran belum bisa dibuat: ' + bad.error + '.');
      const ref = per3[2] || per3[1] || per3[0];
      const vals = per3.map(r => (r ? r.net : 0));
      const total = vals[0] + vals[1] + vals[2];
      vals.forEach((v, i) => { totals[i] += v; }); totals[3] += total;
      const cat = [];
      if (ref.bebasJP) cat.push('Bebas JP sejak ' + p.bebasJP);
      if (ref.ker.length) cat.push('Keringanan: ' + ref.ker.join(', '));
      rows.push([p.nik, p.nama, M.kel[M.npp[npp].kel].nama, M.npp[npp].nama, p.status, ref.program, ref.jkk, ref.jkm, ref.jht, ref.jp, ref.net, vals[0], vals[1], vals[2], total, cat.join('; ')]);
    });
    const sh = freshSheet_(SH.LAMP);
    const mh = per.months.map(ym => BLN3[Number(ym.slice(5)) - 1] + ' ' + ym.slice(0, 4));
    const heads = ['NIK', 'Nama Lengkap', 'Kelompok', 'Nama Badan Usaha', 'Status', 'Program', 'Iuran JKK', 'Iuran JKM', 'Iuran JHT', 'Iuran JP', 'Iuran Bulanan', mh[0], mh[1], mh[2], 'Total Tagihan', 'Catatan'];
    sh.getRange(1, 1, 1, heads.length).setValues([heads]).setBackground(C_HEAD).setFontColor('white').setFontWeight('bold').setHorizontalAlignment('center');
    if (rows.length) {
      sh.getRange(2, 1, rows.length, 1).setNumberFormat('@');
      sh.getRange(2, 1, rows.length, heads.length).setValues(rows);
      sh.getRange(2, 7, rows.length, 9).setNumberFormat('"Rp"#,##0');
    }
    const tr = rows.length + 2;
    sh.getRange(tr, 1, 1, 11).merge().setValue('TOTAL KESELURUHAN:').setHorizontalAlignment('right').setFontWeight('bold');
    sh.getRange(tr, 12, 1, 4).setValues([totals]).setNumberFormat('"Rp"#,##0').setFontWeight('bold');
    sh.getRange(1, 1, rows.length + 2, heads.length).setBorder(true, true, true, true, true, true);
    sh.setFrozenRows(1);
    [140, 200, 120, 280, 70, 60, 85, 85, 95, 85, 95, 95, 95, 95, 105, 220].forEach((w, i) => sh.setColumnWidth(i + 1, w));
    SpreadsheetApp.flush();
    new Tx('Buat lampiran triwulan', per.title + ' · ' + kelLabel_(M, codes).nama + ' · ' + rows.length + ' peserta', false).commit();
    return { title: per.title, rows: rows.length, totals, monthHeaders: mh, message: 'Lampiran Triwulan dibuat: ' + rows.length + ' peserta.' };
  });
}

function apiArsipkan(d) {
  let tempId;
  try {
    const folder = folder_();
    let name = String(d.fileName || 'Tagihan Iuran Desa.xlsx');
    if (d.isDuplicate) {
      const base = name.replace(/\.xlsx$/, '');
      let c = 2;
      while (folder.getFilesByName(base + ' (' + c + ').xlsx').hasNext()) c++;
      name = base + ' (' + c + ').xlsx';
    }
    const ss = getSS();
    const tmp = SpreadsheetApp.create('Temp_Arsip_' + Date.now());
    tempId = tmp.getId();
    ['Database', SH.TAG, SH.TRF, SH.LAMP].forEach(n => {
      if (n !== 'Database' && n !== SH.TAG && (d.sertakan || []).indexOf(n) === -1) return;
      const s = ss.getSheetByName(n);
      if (s && s.getLastRow() > 0) s.copyTo(tmp).setName(n);
    });
    const def = tmp.getSheetByName('Sheet1');
    if (def && tmp.getSheets().length > 1) tmp.deleteSheet(def);
    SpreadsheetApp.flush();
    const file = folder.createFile(exportXlsx_(tempId, name));
    new Tx('Arsip ke Drive', name, false).commit();
    return { fileName: name, fileUrl: file.getUrl(), message: 'Arsip tersimpan: ' + name };
  } finally {
    if (tempId) { try { DriveApp.getFileById(tempId).setTrashed(true); } catch (e) { /* abaikan */ } }
  }
}

function apiPdfSheet(d) {
  const allowed = [SH.TAG, SH.TRF, SH.LAMP];
  if (allowed.indexOf(d.name) === -1) throw new Error('Sheet tidak diizinkan.');
  const ss = getSS();
  const sh = ss.getSheetByName(d.name);
  if (!sh || sh.getLastRow() === 0) throw new Error('Sheet "' + d.name + '" masih kosong. Buat dulu dari menu Tagihan.');
  const portrait = d.name === SH.TRF;
  const url = 'https://docs.google.com/spreadsheets/d/' + ss.getId() + '/export?format=pdf&gid=' + sh.getSheetId() +
    '&size=A4&portrait=' + portrait + '&fitw=true&gridlines=false&printtitle=false&sheetnames=false&pagenum=CENTER&fzr=true' +
    '&top_margin=0.5&bottom_margin=0.5&left_margin=0.5&right_margin=0.5';
  const resp = UrlFetchApp.fetch(url, { headers: { Authorization: 'Bearer ' + ScriptApp.getOAuthToken() }, muteHttpExceptions: true });
  if (resp.getResponseCode() !== 200) throw new Error('Gagal membuat PDF (kode ' + resp.getResponseCode() + ').');
  const periode = (sh.getRange(2, 1).getDisplayValue() || '').replace(/^PERIODE\s*/i, '').trim();
  const name = d.name + (periode ? ' (' + periode + ')' : '') + '.pdf';
  const f = folder_('PDF').createFile(resp.getBlob().setName(name));
  return { url: f.getUrl(), name, id: f.getId() };
}

/** Apakah file arsip bernama ini sudah ada di Drive (dipakai aplikasi sebelum mengarsip). */
function apiArsipAda(d) {
  return { ada: folder_().getFilesByName(String((d && d.fileName) || '')).hasNext() };
}

function apiDaftarArsip() {
  const folder = folder_();
  const items = [];
  const it = folder.getFiles();
  while (it.hasNext()) {
    const f = it.next();
    items.push({ name: f.getName(), url: f.getUrl(), size: f.getSize(), updated: f.getLastUpdated().toISOString() });
  }
  items.sort((a, b) => b.updated.localeCompare(a.updated));
  return { folderUrl: folder.getUrl(), items: items.slice(0, 50) };
}


/* === mesin: Laporan.gs (sama dengan spreadsheet) === */
/**
 * MyTagihan Desa v2 — Laporan.gs
 * Laporan cakupan kepesertaan per kabupaten, kecamatan, desa.
 * Jumlah selalu ditampilkan; persentase hanya bila target sudah diisi.
 */

function apiLaporan(d) {
  d = d || {};
  const M = loadMaster_();
  const W = wilayah_();
  const T = targetMap_();
  const posisi = parseDate(d.posisi) || new Date();
  const end = new Date(posisi.getFullYear(), posisi.getMonth(), posisi.getDate());
  const codes = (d.kelompok && d.kelompok.length ? d.kelompok : M.kelList.map(g => g.kode)).filter(c => M.kel[c]);
  const sel = {}; codes.forEach(c => { sel[c] = true; });
  const grup = grupList_(M).filter(g => M.kelList.some(k => sel[k.kode] && k.grup === g.key));
  const lengkapKeys = grup.filter(g => g.lengkap).map(g => g.key);

  const blank = () => ({ n: 0, prog: { '2P': 0, '3P': 0, '4P': 0 }, grp: {} });
  const kec = {};
  const ensure = (k, ds) => {
    if (!kec[k]) kec[k] = { nama: k, desa: {} };
    if (ds && !kec[k].desa[ds]) kec[k].desa[ds] = Object.assign({ nama: ds }, blank());
    return kec[k];
  };
  W.kecamatan.forEach(k => { ensure(k); (W.desa[k] || []).forEach(ds => ensure(k, ds)); });

  let tanpaNpp = 0;
  readPeserta_().list.forEach(p => {
    if (!billable_(p, end)) return;
    const npp = nppOf_(M, p);
    const kel = npp ? M.npp[npp].kel : kelOf_(p);
    if (!sel[kel]) return;
    if (!npp) tanpaNpp++;
    const prog = npp ? M.npp[npp].program : '';
    const g = (M.kel[kel] || {}).grup || kel;
    const k = p.kec || '(tanpa kecamatan)', ds = p.desa || '(tanpa desa)';
    const x = ensure(k, ds).desa[ds];
    x.n++;
    if (x.prog[prog] !== undefined) x.prog[prog]++;
    x.grp[g] = (x.grp[g] || 0) + 1;
  });

  const sumInto = (acc, x) => {
    acc.n += x.n;
    Object.keys(x.prog).forEach(p => { acc.prog[p] = (acc.prog[p] || 0) + x.prog[p]; });
    Object.keys(x.grp).forEach(g => { acc.grp[g] = (acc.grp[g] || 0) + x.grp[g]; });
  };
  const tgt = (k, ds) => {
    const o = {}; let tot = 0, ada = false;
    grup.forEach(g => { const v = T[targetKey_(k, ds, g.key)]; if (v !== undefined && v > 0) { o[g.key] = v; tot += v; ada = true; } });
    return ada ? { grp: o, total: tot } : null;
  };
  const addTgt = (acc, t) => {
    if (!t) return acc;
    acc = acc || { grp: {}, total: 0 };
    Object.keys(t.grp).forEach(g => { acc.grp[g] = (acc.grp[g] || 0) + t.grp[g]; });
    acc.total += t.total;
    return acc;
  };

  const kab = Object.assign(blank(), { desa: 0, desaKosong: 0, target: null });
  const kecList = Object.keys(kec).map(k => {
    const K = Object.assign(blank(), { nama: k, desa: 0, desaKosong: 0, target: null });
    const desaList = Object.keys(kec[k].desa).map(ds => {
      const x = kec[k].desa[ds];
      x.terisi = lengkapKeys.filter(g => x.grp[g] > 0).length;
      x.target = tgt(k, ds);
      sumInto(K, x);
      K.desa++;
      if (!x.n) K.desaKosong++;
      K.target = addTgt(K.target, x.target);
      return x;
    }).sort((a, b) => a.n - b.n || a.nama.localeCompare(b.nama));
    K.desaList = desaList;
    sumInto(kab, K); kab.desa += K.desa; kab.desaKosong += K.desaKosong; kab.target = addTgt(kab.target, K.target);
    return K;
  }).sort((a, b) => a.n - b.n || a.nama.localeCompare(b.nama));

  return {
    posisi: ymd_(end), kelompok: codes, kelompokNama: kelLabel_(M, codes).nama, grup, lengkap: lengkapKeys.length,
    kab, kec: kecList, tanpaNpp, judul: M.set.JUDUL_LAPORAN || 'Pemerintah Desa', unit: M.set.UNIT || '',
    dibuat: Utilities.formatDate(new Date(), tz_(), 'd MMM yyyy, HH.mm')
  };
}

/** Menyimpan PDF yang dibuat di HP (base64) ke Drive. */
function apiSimpanPdf(d) {
  const name = String(d.fileName || 'Laporan.pdf').replace(/[\\/:*?"<>|]/g, '-');
  const blob = Utilities.newBlob(Utilities.base64Decode(d.base64), 'application/pdf', name);
  const f = folder_('Laporan').createFile(blob);
  return { url: f.getUrl(), name: f.getName() };
}


/* === mesin: Riwayat.gs (sama dengan spreadsheet) === */
/**
 * MyTagihan Desa v2 — Riwayat.gs
 * Riwayat aktivitas dan pembatalan (undo) berdasarkan foto data sebelum/sesudah.
 */

const BATAS_BATAL_HARI = 30;

function logRows_() {
  const sh = getSS().getSheetByName(SH.LOG);
  if (!sh || sh.getLastRow() < 2) return [];
  return sh.getRange(2, 1, sh.getLastRow() - 1, 8).getValues().map((r, i) => ({
    row: i + 2, id: String(r[0]), waktu: r[1] instanceof Date ? r[1] : new Date(r[1]), user: String(r[2]), aksi: String(r[3]),
    ket: String(r[4]), bisa: String(r[5]) === 'Ya', status: String(r[6] || 'Aktif'), oleh: String(r[7] || '')
  }));
}

function detailRows_(filter) {
  const sh = getSS().getSheetByName(SH.LOGD);
  if (!sh || sh.getLastRow() < 2) return [];
  return sh.getRange(2, 1, sh.getLastRow() - 1, 6).getValues()
    .map(r => ({ log: String(r[0]), sheet: String(r[1]), key: String(r[2]), jenis: String(r[3]), before: r[4], after: r[5] }))
    .filter(filter);
}

function logOut_(l) {
  const umur = (Date.now() - l.waktu.getTime()) / 864e5;
  return {
    id: l.id, waktu: l.waktu.toISOString(), user: l.user, aksi: l.aksi, ket: l.ket, status: l.status,
    bisa: l.bisa && l.status === 'Aktif' && umur <= BATAS_BATAL_HARI
  };
}

function apiRiwayat(d) {
  const limit = Math.min(Number((d || {}).limit) || 80, 300);
  return { items: logRows_().reverse().slice(0, limit).map(logOut_) };
}

function riwayatKunci_(sheet, key, limit) {
  const ids = {};
  detailRows_(x => x.sheet === sheet && x.key === String(key)).forEach(x => { ids[x.log] = true; });
  return logRows_().filter(l => ids[l.id]).reverse().slice(0, limit || 10).map(logOut_);
}

function sameAs_(cur, snap) {
  return Object.keys(snap).every(h => !(h in cur) || cur[h] === snap[h]);
}

function apiBatalkan(logId) {
  return withLock_(() => {
    const logs = logRows_();
    const L = logs.find(l => l.id === logId);
    if (!L) throw new Error('Aktivitas tidak ditemukan.');
    if (L.status !== 'Aktif') throw new Error('Aktivitas ini sudah dibatalkan.');
    if (!L.bisa) throw new Error('Aktivitas ini tidak bisa dibatalkan. Buat ulang bila perlu.');
    if ((Date.now() - L.waktu.getTime()) / 864e5 > BATAS_BATAL_HARI) throw new Error('Lewat ' + BATAS_BATAL_HARI + ' hari, tidak bisa dibatalkan lagi.');
    const det = detailRows_(x => x.log === logId);
    if (!det.length) throw new Error('Rincian aktivitas tidak ditemukan.');

    // Aktivitas lain yang menyentuh data yang sama sesudah ini
    const later = (sheet, key) => {
      const ids = {};
      detailRows_(x => x.sheet === sheet && (x.key === key || x.jenis === 'replace') && x.log !== logId).forEach(x => { ids[x.log] = true; });
      return logs.filter(l => ids[l.id] && l.status === 'Aktif' && l.row > L.row).sort((a, b) => b.row - a.row)[0];
    };
    const conflict = (sheet, key, why) => {
      const l = later(sheet, key);
      const when = l ? Utilities.formatDate(l.waktu, tz_(), 'd MMM HH.mm') : '';
      throw new Error('Tidak bisa dibatalkan: ' + why + (l ? '. Data ini diubah lagi oleh "' + l.aksi + '" (' + when + '). Batalkan aktivitas itu dulu.' : '.'));
    };

    const tables = {};
    const T = (name) => (tables[name] = tables[name] || table_(name, KEY_COL[name]));
    const findRow = (t, name, key) => { const k = t.ix(KEY_COL[name]); for (let i = 0; i < t.rows.length; i++) if (norm_(t.rows[i][k]) === key) return i; return -1; };
    const rowObj = (t, r) => { const o = {}; t.headers.forEach((h, j) => { if (h) o[h] = norm_(r[j]); }); return o; };

    // 1. Periksa semua dulu
    det.forEach(x => {
      if (x.jenis === 'replace') {
        const l = later(x.sheet, '*');
        if (l) conflict(x.sheet, '*', 'sesudahnya ada impor lain');
        if (!getSS().getSheetByName(x.before)) throw new Error('Cadangan ' + x.before + ' tidak ditemukan.');
        return;
      }
      const t = T(x.sheet);
      const i = findRow(t, x.sheet, x.key);
      if (i < 0) conflict(x.sheet, x.key, 'baris sudah tidak ada');
      if (!sameAs_(rowObj(t, t.rows[i]), JSON.parse(x.after))) conflict(x.sheet, x.key, 'data sudah berubah');
    });

    // 2. Terapkan, dari belakang
    const toDelete = {};
    det.slice().reverse().forEach(x => {
      if (x.jenis === 'replace') {
        const ss = getSS();
        const bak = ss.getSheetByName(x.before);
        const sh = ss.getSheetByName(x.sheet);
        sh.clearContents();
        const v = bak.getDataRange().getValues();
        if (v.length && v[0].length) {
          sh.getRange(1, 2, v.length, 1).setNumberFormat('@');
          sh.getRange(1, 1, v.length, v[0].length).setValues(v);
        }
        PropertiesService.getScriptProperties().deleteProperty('IBR_LAST_IMPORT');
        return;
      }
      const t = T(x.sheet);
      const i = findRow(t, x.sheet, x.key);
      if (x.jenis === 'insert') { (toDelete[x.sheet] = toDelete[x.sheet] || []).push(i + 2); return; }
      const before = JSON.parse(x.before);
      const row = t.rows[i].slice();
      t.headers.forEach((h, j) => {
        if (!(h in before)) return;
        const v = before[h];
        if (/^\d{9,}$/.test(v) || /^0\d+$/.test(v) || /^\d{4}-\d{2}$/.test(v)) t.sh.getRange(i + 2, j + 1).setNumberFormat('@');
        row[j] = v;
      });
      t.sh.getRange(i + 2, 1, 1, t.headers.length).setValues([row]);
      t.rows[i] = row;
    });
    Object.keys(toDelete).forEach(name => {
      const sh = sheet_(name);
      toDelete[name].sort((a, b) => b - a).forEach(r => sh.deleteRow(r));
    });

    const tx = new Tx('Batalkan: ' + L.aksi, L.ket, false);
    const res = tx.commit();
    sheet_(SH.LOG).getRange(L.row, 7, 1, 2).setValues([['Dibatalkan', res.logId]]);
    return { message: '"' + L.aksi + '" dibatalkan.' };
  });
}

/**
 * MyTagihan Desa — Dasbor.gs (2.1)
 * Ringkasan untuk layar Dasbor aplikasi: tren peserta 12 bulan, iuran bulan berjalan per kelompok,
 * program, cakupan per kecamatan, mutasi bulan ini, dan aktivitas terakhir.
 * Hanya membaca data; dipakai bersama oleh spreadsheet dan aplikasi 3.0 (mesin yang sama).
 */

function apiDasbor() {
  const M = loadMaster_();
  const P = readPeserta_().list;
  const ym = nowYm_();
  const end = monthEnd_(ym);
  const months = [];
  for (let i = 11; i >= 0; i--) months.push(addMonths_(ym, -i));
  const ends = months.map(monthEnd_);
  const tren = months.map(m => ({ ym: m, aktif: 0, masuk: 0, keluar: 0 }));

  const kel = {};
  M.kelList.forEach(g => {
    kel[g.kode] = { kode: g.kode, nama: g.nama, jenis: g.jenis, grup: g.grup, aktif: 0, npp: 0, normal: 0, net: 0, masalah: 0, prog: { '2P': 0, '3P': 0, '4P': 0 } };
  });
  Object.keys(M.npp).forEach(n => { const r = M.npp[n]; if (r.aktif && kel[r.kel]) kel[r.kel].npp++; });

  const prog = { '2P': 0, '3P': 0, '4P': 0 };
  const netNpp = {};
  const masalah = {};
  let normal = 0, net = 0, potongan = 0, bebasJP = 0, tanpaNpp = 0, ditagih = 0;
  const masuk = [], keluar = [];
  const ringkas = (p) => { const o = pesertaOut_(M, p); return { id: o.id, nama: o.nama, kelNama: o.kelNama, desa: o.desa, kec: o.kec, tgl: o.tgl, status: o.status }; };

  P.forEach(p => {
    const t = p.tgl ? ym_(p.tgl) : '';
    ends.forEach((e, i) => { if (billable_(p, e)) tren[i].aktif++; });
    const ti = months.indexOf(t);
    if (ti >= 0) {
      if (p.status === 'Aktif') tren[ti].masuk++;
      else if (p.status === 'Nonaktif') tren[ti].keluar++;
    }
    if (t === ym) (p.status === 'Aktif' ? masuk : keluar).push(ringkas(p));
    if (!billable_(p, end)) return;
    ditagih++;
    const npp = nppOf_(M, p);
    if (!npp) { tanpaNpp++; return; }
    const n = M.npp[npp];
    const k = kel[n.kel];
    if (!k) return;
    k.aktif++;
    const pr = n.program || (M.kel[n.kel] || {}).programAwal || '';
    if (k.prog[pr] !== undefined) { k.prog[pr]++; prog[pr]++; }
    const r = iuranOrang_(M, p, ym);
    if (r.error) { k.masalah++; masalah[r.error] = (masalah[r.error] || 0) + 1; return; }
    k.normal += r.normal; k.net += r.net;
    normal += r.normal; net += r.net; potongan += r.potongan;
    if (r.bebasJP) bebasJP++;
    netNpp[npp] = (netNpp[npp] || 0) + r.net;
  });

  // Saldo IJT dari sheet IBR, dikurangkan per NPP seperti tagihan bulanan
  const saldo = ibrSaldo_();
  let saldoPakai = 0, perkiraan = 0;
  Object.keys(M.npp).forEach(n => {
    const s = saldo[n] || 0;
    if (!netNpp[n] && !s) return;
    saldoPakai += s;
    perkiraan += (netNpp[n] || 0) - s;
  });

  let kab = { n: 0, desa: 0, desaKosong: 0, target: null }, kec = [];
  try {
    const L = apiLaporan({});
    kab = { n: L.kab.n, desa: L.kab.desa, desaKosong: L.kab.desaKosong, target: L.kab.target ? L.kab.target.total : null };
    kec = L.kec.map(k => ({ nama: k.nama, n: k.n, desa: k.desa, desaKosong: k.desaKosong, target: k.target ? k.target.total : null }));
  } catch (e) { /* daftar wilayah belum ada */ }

  const logs = logRows_();
  const aktivitas = logs.slice(-8).reverse().map(l => ({ aksi: l.aksi, ket: l.ket, waktu: l.waktu.toISOString(), user: l.user, status: l.status }));
  const tg = logs.filter(l => l.aksi === 'Buat tagihan').pop();

  return {
    ym, tren, program: prog, ditagih, tanpaNpp,
    kelompok: M.kelList.map(g => kel[g.kode]),
    iuran: { normal, net, potongan, bebasJP, saldo: saldoPakai, perkiraan, masalah: Object.keys(masalah).map(m => ({ teks: m, n: masalah[m] })) },
    masuk: masuk.sort((a, b) => b.tgl.localeCompare(a.tgl)).slice(0, 60),
    keluar: keluar.sort((a, b) => b.tgl.localeCompare(a.tgl)).slice(0, 60),
    nMasuk: masuk.length, nKeluar: keluar.length,
    kab, kecamatan: kec,
    aktivitas,
    tagihanTerakhir: tg ? { ket: tg.ket, waktu: tg.waktu.toISOString() } : null,
    ibr: apiInfoIbr()
  };
}

/* === 11-xlsx.js === */
/* ----------------------------------------------------------------------
 *  Pembaca file Excel (.xlsx) sederhana tanpa pustaka luar.
 *  .xlsx = arsip zip berisi XML. Isi zip dibuka dengan DecompressionStream
 *  bawaan browser. Hanya lembar pertama yang berisi data yang dibaca.
 * ---------------------------------------------------------------------- */

function u16(b, i) { return b[i] | (b[i + 1] << 8); }
function u32(b, i) { return (b[i] | (b[i + 1] << 8) | (b[i + 2] << 16) | (b[i + 3] << 24)) >>> 0; }

async function bukaZip(buf) {
  var b = new Uint8Array(buf), eocd = -1;
  for (var i = b.length - 22; i >= Math.max(0, b.length - 66000); i--) {
    if (u32(b, i) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('File Excel rusak atau bukan .xlsx (simpan ulang sebagai .xlsx atau CSV).');
  var n = u16(b, eocd + 10), off = u32(b, eocd + 16), isi = {};
  for (var k = 0; k < n; k++) {
    if (u32(b, off) !== 0x02014b50) break;
    var metode = u16(b, off + 10), ukKomp = u32(b, off + 20);
    var pjNama = u16(b, off + 28), pjEkstra = u16(b, off + 30), pjKom = u16(b, off + 32), lokal = u32(b, off + 42);
    var nama = new TextDecoder().decode(b.subarray(off + 46, off + 46 + pjNama));
    isi[nama] = { metode: metode, ukKomp: ukKomp, lokal: lokal };
    off += 46 + pjNama + pjEkstra + pjKom;
  }
  return {
    ada: function (nama) { return !!isi[nama]; },
    teks: async function (nama) {
      var e = isi[nama];
      if (!e) return '';
      var mulai = e.lokal + 30 + u16(b, e.lokal + 26) + u16(b, e.lokal + 28);
      var data = b.subarray(mulai, mulai + e.ukKomp);
      if (e.metode === 0) return new TextDecoder().decode(data);
      if (e.metode !== 8) throw new Error('Format kompresi Excel tidak didukung. Simpan ulang sebagai CSV.');
      if (typeof DecompressionStream === 'undefined') throw new Error('Browser ini belum bisa membuka .xlsx. Pakai Chrome/Edge terbaru, atau simpan sebagai CSV.');
      var aliran = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      var hasil = await new Response(aliran).arrayBuffer();
      return new TextDecoder().decode(hasil);
    }
  };
}

function uraiEntitas(s) {
  return String(s).replace(/&(#x[0-9a-f]+|#\d+|lt|gt|amp|quot|apos);/gi, function (m, e) {
    if (e.charAt(0) === '#') return String.fromCodePoint(e.charAt(1).toLowerCase() === 'x' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10));
    return { lt: '<', gt: '>', amp: '&', quot: '"', apos: "'" }[e.toLowerCase()];
  });
}

function atribut(teks, nama) {
  var m = teks.match(new RegExp('\\b' + nama + '="([^"]*)"'));
  return m ? uraiEntitas(m[1]) : null;
}

function teksRun(xml) {
  var out = '', re = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>|<t(?:\s[^>]*)?\/>/g, m;
  // abaikan teks fonetik (rPh)
  xml = xml.replace(/<rPh\b[\s\S]*?<\/rPh>/g, '');
  while ((m = re.exec(xml))) out += m[1] ? uraiEntitas(m[1]) : '';
  return out;
}

function kolomKeIdx(ref) {
  var m = String(ref || '').match(/^([A-Z]+)/), n = 0;
  if (!m) return -1;
  for (var i = 0; i < m[1].length; i++) n = n * 26 + (m[1].charCodeAt(i) - 64);
  return n - 1;
}

var FORMAT_TANGGAL_BAWAAN = { 14: 1, 15: 1, 16: 1, 17: 1, 18: 0, 19: 0, 20: 0, 21: 0, 22: 1, 27: 1, 30: 1, 36: 1, 45: 0, 46: 0, 47: 0, 50: 1, 57: 1 };

function gayaTanggal(stylesXml) {
  var kustom = {}, m, re = /<numFmt\b([^>]*)\/?>/g;
  while ((m = re.exec(stylesXml))) {
    var id = +atribut(m[1], 'numFmtId'), kode = String(atribut(m[1], 'formatCode') || '').toLowerCase();
    var bersih = kode.replace(/"[^"]*"|\[[^\]]*\]|\\./g, '');
    kustom[id] = /[dy]/.test(bersih) || (/m/.test(bersih) && !/[hs]/.test(bersih) && /[\/\-\.]/.test(bersih));
  }
  var xfs = [], blok = stylesXml.match(/<cellXfs\b[\s\S]*?<\/cellXfs>/);
  if (blok) {
    var r2 = /<xf\b([^>]*)\/?>/g, x;
    while ((x = r2.exec(blok[0]))) {
      var nid = +atribut(x[1], 'numFmtId') || 0;
      xfs.push(!!(FORMAT_TANGGAL_BAWAAN[nid] || kustom[nid]));
    }
  }
  return xfs;
}

function angkaRapi(v) {
  var n = Number(v);
  if (!isFinite(n)) return String(v);

function bacaCsv(teks) {

  var pisah = [';', '\t', ','].reduce(function (a, c) { return hitung(c) > hitung(a) ? c : a; }, ',');
  var grid = [], row = [], sel = '', kutip = false;
  for (var i = 0; i < teks.length; i++) {
    var ch = teks[i];
    if (kutip) {
      if (ch === '"') { if (teks[i + 1] === '"') { sel += '"'; i++; } else kutip = false; }
      else sel += ch;
    } else if (ch === '"') kutip = true;
    else if (ch === pisah) { row.push(sel.trim()); sel = ''; }

      row.push(sel.trim()); grid.push(row); row = []; sel = '';
    } else sel += ch;
  }
  if (sel !== '' || row.length) { row.push(sel.trim()); grid.push(row); }

}

function jalankanLokal(nama, argsJson) {
  var fn = apiMap_()[nama];
  if (!fn) return JSON.stringify({ ok: false, error: 'Aksi tidak dikenal: ' + nama });
  var args = argsJson ? JSON.parse(argsJson) : [];
  var tulis = FN_TULIS.indexOf(nama) >= 0 && !(nama === 'imporPeserta' && args[0] && args[0].dryRun);
  var ubahAwal = GAS.diubah;
  _UUID_CATAT = [];
  try {
    var data = fn.apply(null, args);

    else if (GAS.diubah !== ubahAwal) simpanNanti(); // mis. ID untuk baris baru
    return JSON.stringify({ ok: true, data: data === undefined ? null : data });
  } catch (e) {
    console.error(nama + ': ' + (e && e.stack || e));

        var batch = ambilBatch(s.antre);
        var j = await panggilServer({ aksi: 'jalankan', op: batch });
        var peta = {};
        (j.hasil || []).forEach(function (h) { peta[h.cid] = h; });
        batch.forEach(function (op) {
          var h = peta[op.cid];
          if (!h) return;
          if (h.ok) hasil.kirim++;
          else { hasil.gagal++; s.gagal.unshift({ waktu: gasTanggal(new Date(), '', 'yyyy-MM-dd HH:mm'), fn: op.fn, galat: h.galat }); s.gagal = s.gagal.slice(0, 20); s.hash = {}; }
        });
        if (!batch.some(function (op) { return peta[op.cid]; })) throw new Error('Server tidak memproses kiriman.');
        s.antre = s.antre.filter(function (op) { return !peta[op.cid]; });
        await simpanSekarang();
      }
      var t = await panggilServer({ aksi: 'tab', hash: s.hash });
      if (s.antre.length) { jadwalSinkron(1500); return hasil; } // ada tindakan baru selama menarik: ulang sebentar lagi
      var nama = Object.keys(t.tab || {});
      gantiTabDariServer(t);
      hasil.tab = nama.length;
      s.hash = t.hash || {}; s.urlSheet = t.url || ''; s.versiServer = t.versi || '';
      s.terakhir = gasTanggal(new Date(), '', 'yyyy-MM-dd HH:mm'); s.galat = '';
      await simpanSekarang();
      if (SINK.setelah) SINK.setelah(hasil);
      return hasil;
    } catch (e) {
      s.galat = e.message; simpanNanti();
      throw e;
    } finally {
      SINK.janji = null; SINK.berjalan = false;
      if (SINK.saatSelesai) SINK.saatSelesai();
    }
  })();
  return SINK.janji;
}

/** Fitur Drive: dijalankan di server (perlu sinyal). Antrean dikirim dulu agar sheet di spreadsheet sudah terbaru. */
async function panggilLangsung(fn, argsJson) {
  if (!sinkronAktif()) throw new Error('Fitur ini memakai Google Drive: sambungkan dulu ke spreadsheet (Data & sinkron).');
  if (navigator.onLine === false) throw new Error('Perlu sinyal untuk fitur Google Drive ini. Data tetap tersimpan di perangkat.');

  var j = await panggilServer({ aksi: 'panggil', fn: fn, args: argsJson || '[]' });
  return j.nilai;
}

    const close = () => { if (!closed) { closed = true; sc.remove(); if (sc._onClose) sc._onClose(); } };
    sc.addEventListener('click', e => { if (e.target === sc) close(); });
    $$('[data-close]', sc).forEach(b => b.onclick = close);
    if (onMount) onMount(sc.firstElementChild, close, sc);
    return close;
  }
  function confirmBox(o) {
    return new Promise(resolve => {
      let done = false;
      sheet('<h2>' + esc(o.title) + '</h2><div>' + (o.body || '') + '</div>' +
        '<div class="btns"><button class="btn" data-no>' + esc(o.cancel || 'Batal') + '</button><button class="btn ' + (o.danger ? 'd' : 'p') + '" data-yes>' + esc(o.ok || 'Lanjutkan') + '</button></div>',
        (s, close, sc) => {
          sc._onClose = () => { if (!done) { done = true; resolve(false); } };
          $('[data-no]', s).onclick = () => close();
          $('[data-yes]', s).onclick = () => { done = true; resolve(true); close(); };
        });
    });
  }

  /** Aksi tulis: proses, notifikasi dengan Urungkan, segarkan data. */
  async function write(name, args, text, hint) {
    busy(text || 'Menyimpan…', hint);
    try {
      const r = await api(name, ...args);
      busy(false);
      S.boot = null;
      toast(r.message || 'Tersimpan.', r.warning ? 'err' : '', r.undoable ? r.logId : null);
      return r;
    } catch (e) { fail(e); return null; }
  }

  // =====================================================================
  //  Status & navigasi
  // =====================================================================
  const LEBAR = () => window.matchMedia('(min-width: 760px)').matches;
  const S = { boot: null, stack: [], view: LEBAR() ? 'dasbor' : 'beranda', params: {}, tagihan: null, selKeluar: new Map(), dasbor: null };
  const TAB_OF = { dasbor: 'dasbor', beranda: 'beranda', laporan: 'beranda', mutasi: 'mutasi', tagihan: 'tagihan', arsip: 'tagihan', peserta: 'peserta', detail: 'peserta', data: 'data' };

  async function boot(force) {
    if (S.boot && !force) return S.boot;
    S.boot = await api('bootstrap');
    return S.boot;
  }
  const K = () => (S.boot && S.boot.kelompok) || [];
  const kelNama = c => (K().find(k => k.kode === c) || {}).nama || c;
  const W = () => (S.boot && S.boot.wilayah) || { kecamatan: [], desa: {} };

  function go(view, params, replace) {
    if (!replace) S.stack.push({ view: S.view, params: S.params });
    S.view = view; S.params = params || {};
    render();
  }
  function tab(view) { S.stack = []; S.view = view; S.params = {}; render(); }
  function back() { const p = S.stack.pop(); if (p) { S.view = p.view; S.params = p.params; render(); } }
  function setTitle(t, sub) { $('#title').textContent = t; $('#sub').textContent = sub || ''; document.title = t + ' · MyTagihan Desa'; }

  /** diam = muat ulang karena data baru dari sinkron: posisi gulir dipertahankan, tanpa kerangka "memuat". */
  async function render(diam) {
    const v = $('#view');
    const t = TAB_OF[S.view] || 'pengaturan';
    $$('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    $('#back').hidden = !S.stack.length;
    document.body.dataset.view = S.view;
    tutupMenu();
    const y = window.scrollY;
    if (!diam) { window.scrollTo(0, 0); v.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>'; }
    try {
      await boot();
      if (S.boot.needsSetup && S.view !== 'data') return viewSetup(v);
      await (VIEWS[S.view] || VIEWS.beranda)(v, S.params);
      if (diam) window.scrollTo(0, y);
    } catch (e) {
      v.innerHTML = '<div class="card pad"><p class="note err">' + esc(e.message) + '</p><button class="btn block" id="retry">Coba lagi</button></div>';
      $('#retry').onclick = () => { S.boot = null; render(); };
    }
  }

  function viewSetup(v) {
    const st = M3.status();
    setTitle('MyTagihan Desa', st.aktif ? 'Menunggu data spreadsheet' : 'Belum ada data di perangkat ini');
    v.innerHTML = '<div class="card pad sambut"><h2>Selamat datang di MyTagihan Desa</h2>' +
      (st.aktif
        ? '<p>Perangkat ini sudah tersambung, tetapi data dari spreadsheet belum masuk.' + (st.galat ? ' <span class="note err" style="display:block;margin-top:8px">' + esc(st.galat) + '</span>' : '') + '</p><button class="btn p block" id="su-sync">Sinkron sekarang</button>'
        : '<p>Data peserta tersimpan di spreadsheet MyTagihan milik Anda dan di perangkat ini saja. Sambungkan sekali, setelah itu aplikasi tetap jalan walau tanpa sinyal.</p><button class="btn p block" id="su-data">Sambungkan ke spreadsheet</button>') +
      '<p class="small muted" style="margin-bottom:0">Spreadsheet belum disiapkan? Buka di laptop: menu <b>MyTagihan Desa › Siapkan / perbarui struktur data</b>, lalu <b>Aplikasi 3.0 › Siapkan sinkron & lihat kunci</b>.</p></div>';
    const a = $('#su-data', v); if (a) a.onclick = () => go('data');
    const b = $('#su-sync', v); if (b) b.onclick = () => sinkronSekarang();
  }

  // =====================================================================
  //  MUTASI
  // =====================================================================
  function lokasiHtml(p, loc) {
    return '<div class="field"><label for="' + p + '-kel">Kelompok</label><select id="' + p + '-kel">' + opt(K().map(k => ({ v: k.kode, t: k.nama + (k.jenis === 'BPU' ? ' (BPU)' : '') })), loc.kel, 'Pilih…') + '</select></div>' +
      '<div class="row2"><div class="field"><label for="' + p + '-kec">Kecamatan</label><select id="' + p + '-kec">' + opt(W().kecamatan, loc.kec, 'Pilih…') + '</select></div>' +
      '<div class="field"><label for="' + p + '-desa">Desa</label><select id="' + p + '-desa">' + opt(W().desa[loc.kec] || [], loc.desa, 'Pilih…') + '</select></div></div>';
  }
  function bindLokasi(root, p, onChange) {
    const get = () => ({ kel: $('#' + p + '-kel', root).value, kec: $('#' + p + '-kec', root).value, desa: $('#' + p + '-desa', root).value });
    $('#' + p + '-kel', root).onchange = () => onChange(get());
    $('#' + p + '-kec', root).onchange = e => { $('#' + p + '-desa', root).innerHTML = opt(W().desa[e.target.value] || [], '', 'Pilih…'); onChange(get()); };
    $('#' + p + '-desa', root).onchange = () => onChange(get());
    return get;
  }

  async function vMutasi(v, p) {
    setTitle('Mutasi tenaga kerja');
    const mode = p.mode || LS.get('mutasi', 'masuk');
    v.innerHTML = '<div class="seg" role="group"><button data-m="masuk" class="' + (mode === 'masuk' ? 'on' : '') + '">Masuk (Aktif)</button><button data-m="keluar" class="danger ' + (mode === 'keluar' ? 'on' : '') + '">Keluar (Nonaktif)</button></div><div id="mb" style="display:flex;flex-direction:column;gap:12px"></div>';
    $$('[data-m]', v).forEach(b => b.onclick = () => { LS.set('mutasi', b.dataset.m); S.params = { mode: b.dataset.m }; render(); });
    if (mode === 'masuk') masuk($('#mb', v)); else keluar($('#mb', v));
  }

  function masuk(el) {
    const loc = LS.get('loc', { kel: '', kec: '', desa: '' });
    el.innerHTML =
      acc('1 · Kelompok & lokasi', 'Diingat untuk peserta berikutnya', lokasiHtml('m', loc) + '<div id="m-npp"></div>', { open: true }) +
      acc('2 · Data peserta', 'NIK dicek otomatis',
        '<div class="field"><label for="m-tgl">Tanggal entry</label><input type="date" id="m-tgl" value="' + today() + '"></div>' +
        '<div class="field"><label for="m-nik">NIK <span class="muted small" id="m-cnt">0/16</span></label><input type="text" id="m-nik" inputmode="numeric" maxlength="16" autocomplete="off" placeholder="16 digit angka"><div id="m-nik-n"></div></div>' +
        '<div class="field"><label for="m-nama">Nama lengkap</label><input type="text" id="m-nama" autocomplete="off" placeholder="Sesuai KTP"></div>', { open: true }) +
      '<button class="btn p block" id="m-save">Simpan peserta</button>';
    const showNpp = async l => {
      LS.set('loc', l);
      const box = $('#m-npp', el);
      if (!l.kel || !l.kec || !l.desa) { box.innerHTML = ''; return; }
      box.innerHTML = '<div class="small muted">Mencari NPP…</div>';
      try {
        const r = await api('resolveNpp', l);
        box.innerHTML = r.npp
          ? '<div class="note ok">NPP <b>' + esc(r.npp) + '</b> · ' + esc(r.nama) + ' · ' + esc(r.program) + (r.iuran != null ? ' · ' + rp(r.iuran) + '/orang/bulan' : '') + '</div>' + (r.error ? '<div class="note warn">' + esc(r.error) + '</div>' : '')
          : '<div class="note warn">' + esc(r.pesan) + ' Peserta tetap bisa disimpan, tetapi belum ikut tagihan. <button class="link" id="m-addnpp">Tambah NPP</button></div>';
        const a = $('#m-addnpp', el); if (a) a.onclick = () => nppForm({ isNew: true, kel: l.kel, kec: l.kec, desa: l.desa });
      } catch (e) { box.innerHTML = '<div class="note err">' + esc(e.message) + '</div>'; }
    };
    const get = bindLokasi(el, 'm', showNpp);
    showNpp(get());
    const nik = $('#m-nik', el), note = $('#m-nik-n', el);
    let blocked = false;
    const cek = debounce(async val => {
      if (val.length !== 16) return;
      try {
        const hits = await api('cekNik', val);
        if (nik.value !== val) return;
        const a = hits.find(x => x.status === 'Aktif');
        blocked = !!a;
        note.innerHTML = a ? '<div class="note err">NIK sudah <b>AKTIF</b>: ' + esc(a.nama) + ' · ' + esc(a.kelNama) + ' ' + esc(a.desa) + '</div>'
          : hits.length ? '<div class="note info">Pernah terdaftar: ' + esc(hits[0].nama) + ', nonaktif sejak ' + tglID(hits[0].tgl) + '.</div>' : '<div class="note ok">NIK belum terdaftar.</div>';
        if (!a && hits.length && !$('#m-nama', el).value) $('#m-nama', el).value = hits[0].nama;
      } catch (e) { /* opsional */ }
    }, 350);
    nik.oninput = () => { nik.value = nik.value.replace(/\D/g, '').slice(0, 16); $('#m-cnt', el).textContent = nik.value.length + '/16'; note.innerHTML = ''; blocked = false; cek(nik.value); };
    $('#m-save', el).onclick = async () => {
      const l = get();
      const d = { kel: l.kel, kec: l.kec, desa: l.desa, tanggal: $('#m-tgl', el).value, nik: nik.value, nama: $('#m-nama', el).value.trim() };
      if (!d.kel || !d.kec || !d.desa) return toast('Pilih kelompok, kecamatan, dan desa.', 'err');
      if (!/^\d{16}$/.test(d.nik)) return toast('NIK harus 16 digit angka.', 'err');
      if (d.nama.length < 3) return toast('Nama lengkap wajib diisi.', 'err');
      if (blocked) return toast('NIK ini masih aktif.', 'err');
      const ok = await confirmBox({ title: 'Simpan peserta baru?', body: '<dl class="kv"><dt>Nama</dt><dd>' + esc(d.nama) + '</dd><dt>NIK</dt><dd>' + esc(d.nik) + '</dd><dt>Kelompok</dt><dd>' + esc(kelNama(d.kel)) + '</dd><dt>Lokasi</dt><dd>' + esc(d.desa) + ', ' + esc(d.kec) + '</dd><dt>Tanggal entry</dt><dd>' + tglID(d.tanggal) + '</dd></dl>', ok: 'Simpan' });
      if (!ok) return;
      const r = await write('tambahPeserta', [d], 'Menyimpan peserta…');
      if (r) { nik.value = ''; $('#m-nama', el).value = ''; note.innerHTML = ''; $('#m-cnt', el).textContent = '0/16'; nik.focus(); }
    };
  }

  function keluar(el) {
    const loc = LS.get('locK', { kel: '', kec: '', desa: '' });
    const ket = S.boot.keterangan;
    el.innerHTML =
      acc('1 · Pilih peserta', 'Cari nama/NIK, atau pilih per lokasi',
        '<div class="field"><label for="k-q">Cari nama atau NIK (semua desa)</label><input type="search" id="k-q" placeholder="Minimal 3 huruf/angka"></div><div id="k-hasil"></div>' +
        '<div class="sec" style="margin:6px 0 0">atau per lokasi</div>' + lokasiHtml('k', loc) + '<div id="k-lok"></div>', { open: true }) +
      acc('2 · Dipilih', '<span id="k-n">0</span> peserta', '<div class="chips" id="k-chips"></div>', { open: true }) +
      acc('3 · Alasan & tanggal', '', '<div class="chips" id="k-ket">' + ket.map((k, i) => '<button class="chip' + (i === 0 ? ' on' : '') + '" data-v="' + esc(k) + '">' + esc(k) + '</button>').join('') + '</div>' +
        '<div class="field"><label for="k-tgl">Tanggal nonaktif</label><input type="date" id="k-tgl" value="' + today() + '"><small>Peserta tetap ditagih untuk bulan sebelum tanggal ini.</small></div>', { open: true }) +
      '<div class="sticky-act"><button class="btn d block" id="k-go" disabled>Nonaktifkan</button></div>';
    const sel = S.selKeluar;
    const draw = () => {
      $('#k-n', el).textContent = sel.size;
      $('#k-chips', el).innerHTML = sel.size ? Array.from(sel.values()).map(p => '<button class="chip-x" data-x="' + esc(p.id) + '">' + esc(p.nama) + ' ×</button>').join('') : '<span class="muted small">Belum ada.</span>';
      $$('[data-x]', el).forEach(b => b.onclick = () => { sel.delete(b.dataset.x); draw(); sync(); });
      const g = $('#k-go', el); g.disabled = !sel.size; g.textContent = sel.size ? 'Nonaktifkan ' + sel.size + ' peserta' : 'Nonaktifkan';
    };
    const sync = () => $$('input[data-pid]', el).forEach(c => { c.checked = sel.has(c.dataset.pid); });
    const rows = list => list.map(p => '<label class="check"><input type="checkbox" data-pid="' + esc(p.id) + '"' + (sel.has(p.id) ? ' checked' : '') + '><span class="m"><b>' + esc(p.nama) + '</b><br><span class="small muted">' + esc(p.nik) + ' · ' + esc(p.kelNama) + ' ' + esc(p.desa) + '</span></span></label>').join('');
    const bind = (box, list) => $$('input[data-pid]', box).forEach(c => c.onchange = () => { const p = list.find(x => x.id === c.dataset.pid); c.checked ? sel.set(p.id, p) : sel.delete(p.id); draw(); sync(); });
    const hasil = $('#k-hasil', el);
    $('#k-q', el).oninput = debounce(async e => {
      const q = e.target.value.trim();
      if (q.length < 3) { hasil.innerHTML = ''; return; }
      hasil.innerHTML = '<div class="small muted">Mencari…</div>';
      try { const r = await api('cariPeserta', { q, status: 'Aktif', limit: 25 }); hasil.innerHTML = rows(r.items) || '<div class="empty">Tidak ada yang cocok.</div>'; bind(hasil, r.items); }
      catch (x) { hasil.innerHTML = '<div class="note err">' + esc(x.message) + '</div>'; }
    }, 400);
    const lok = $('#k-lok', el);
    const loadLok = async l => {
      LS.set('locK', l);
      if (!l.kec || !l.desa) { lok.innerHTML = ''; return; }
      lok.innerHTML = '<div class="small muted">Memuat…</div>';
      try {
        const list = await api('pesertaLokasi', l);
        lok.innerHTML = list.length ? '<div style="display:flex;justify-content:space-between;align-items:center"><span class="small muted">' + list.length + ' peserta aktif</span><button class="link" id="k-all">Pilih semua</button></div>' + rows(list) : '<div class="empty">Tidak ada peserta aktif.</div>';
        bind(lok, list);
        const all = $('#k-all', el);
        if (all) all.onclick = () => { const every = list.every(p => sel.has(p.id)); list.forEach(p => every ? sel.delete(p.id) : sel.set(p.id, p)); draw(); sync(); };
      } catch (x) { lok.innerHTML = '<div class="note err">' + esc(x.message) + '</div>'; }
    };
    const getL = bindLokasi(el, 'k', loadLok);
    loadLok(getL());
    $$('#k-ket .chip', el).forEach(c => c.onclick = () => $$('#k-ket .chip', el).forEach(x => x.classList.toggle('on', x === c)));
    draw();
    $('#k-go', el).onclick = async () => {
      const list = Array.from(sel.values());
      const keterangan = $('#k-ket .chip.on', el).dataset.v, tanggal = $('#k-tgl', el).value;
      const ok = await confirmBox({ title: 'Nonaktifkan ' + list.length + ' peserta?', danger: true, ok: 'Ya, nonaktifkan',
        body: '<p>Keterangan: <b>' + esc(keterangan) + '</b> · tanggal <b>' + tglID(tanggal) + '</b></p><ul>' + list.map(p => '<li>' + esc(p.nama) + ' <span class="muted">(' + esc(p.nik) + ')</span></li>').join('') + '</ul>' });
      if (!ok) return;
      const r = await write('nonaktifkan', [{ ids: list.map(p => p.id), keterangan, tanggal }], 'Menonaktifkan…');
      if (r) { sel.clear(); render(); }
    };
  }

  // =====================================================================
  //  TAGIHAN
  // =====================================================================
  function kelChips(sel, id) {
    const grp = [['Penerima upah (PU)', K().filter(k => k.jenis === 'PU' && !k.induk)], ['LKD', K().filter(k => k.induk === 'LKD')], ['Bukan penerima upah (BPU)', K().filter(k => k.jenis === 'BPU')]];
    return '<div style="display:flex;gap:14px"><button class="link" data-q="pu">Semua PU</button><button class="link" data-q="all">Semua</button><button class="link" data-q="none" style="color:var(--muted)">Kosongkan</button></div>' +
      grp.filter(g => g[1].length).map(g => '<div class="sec" style="margin:4px 0 0">' + g[0] + '</div><div class="chips">' + g[1].map(k => '<button class="chip' + (sel.has(k.kode) ? ' on' : '') + '" data-k="' + k.kode + '">' + esc(k.nama) + '</button>').join('') + '</div>').join('');
  }
  function bindKelChips(root, sel, onChange) {
    const sync = () => { $$('[data-k]', root).forEach(c => c.classList.toggle('on', sel.has(c.dataset.k))); onChange(); };
    $$('[data-k]', root).forEach(c => c.onclick = () => { sel.has(c.dataset.k) ? sel.delete(c.dataset.k) : sel.add(c.dataset.k); sync(); });
    $$('[data-q]', root).forEach(b => b.onclick = () => {
      sel.clear();
      if (b.dataset.q === 'pu') K().filter(k => k.jenis === 'PU').forEach(k => sel.add(k.kode));
      if (b.dataset.q === 'all') K().forEach(k => sel.add(k.kode));
      sync();
    });
  }

    setTitle('Tagihan');

    const per = LS.get('periode', 'Bulanan');
    const T = S.tagihan;
    v.innerHTML =

  async function buatTagihan(kel, periode, bulan) {
    if (!kel.length) return toast('Pilih minimal satu kelompok.', 'err');
    if (!bulan) return toast('Pilih bulan.', 'err');
    const ok = await confirmBox({ title: 'Buat tagihan ' + periode.toLowerCase() + '?', ok: 'Buat tagihan',
      body: '<dl class="kv"><dt>Kelompok</dt><dd>' + esc(kel.map(kelNama).join(', ')) + '</dd><dt>Mulai</dt><dd>' + blnID(bulan) + (periode === 'Triwulan' ? ' (3 bulan)' : '') + '</dd></dl><p class="small muted">Isi sheet Tagihan' + (periode === 'Bulanan' ? ' dan Trf Bank Jatim' : '') + ' diganti dengan hasil baru.</p>' });
    if (!ok) return;
    busy('Menghitung tagihan…');
    let r;
    try { r = await api('buatTagihan', { periode, bulan, kelompok: kel }); } catch (e) { return fail(e); }
    busy(false);
    S.tagihan = Object.assign(r, { archive: null, lampiran: false });
    render();
    toast('Tagihan dihitung. Sheet Tagihan' + (periode === 'Bulanan' ? ' & Trf Bank Jatim' : '') + ' di spreadsheet ikut diperbarui saat sinkron.');
    if (periode === 'Triwulan' && await confirmBox({ title: 'Buat Lampiran Triwulan juga?', ok: 'Ya, buat', cancel: 'Tidak' })) await buatLampiran(kel, bulan, false);
    await arsipTagihan(false);
  }

  /** Arsip .xlsx di Drive: antrean dikirim dulu (sheet Tagihan di spreadsheet = hasil terakhir), lalu disimpan oleh spreadsheet. */
  async function arsipTagihan(manual) {
    const T = S.tagihan;
    if (!T) return;
    const st = M3.status();
    if (!st.aktif || !st.online) {
      if (manual) toast(!st.aktif ? 'Sambungkan ke spreadsheet dulu (Data & sinkron) untuk menyimpan arsip di Drive.' : 'Tanpa sinyal. Tekan "Simpan arsip ke Drive" lagi saat ada sinyal.', 'err');
      return;
    }
    busy('Mengirim ke spreadsheet…', 'Lalu memeriksa arsip di Drive.');
    try {
      const a = await api('arsipAda', { fileName: T.fileName });
      busy(false);
      let dup = false;
      if (a.ada) {
        dup = await confirmBox({ title: 'File arsip sudah ada', body: '<p><b>' + esc(T.fileName) + '</b> sudah ada di Drive. Simpan versi baru?</p>', ok: 'Simpan versi baru' });
        if (!dup) return;
      }
      busy('Menyimpan arsip .xlsx ke Drive…');
      const res = await api('arsipkan', { fileName: T.fileName, isDuplicate: dup, sertakan: T.periode === 'Bulanan' ? ['Trf Bank Jatim'] : (T.lampiran ? ['Lampiran Triwulan'] : []) });
      busy(false); T.archive = res; toast(res.message); render(true);
    } catch (e) { fail(e); }
  }

  async function buatLampiran(kel, bulan, ask) {
    if (!kel.length) return toast('Pilih kelompok di bagian 1.', 'err');
    if (ask && !await confirmBox({ title: 'Buat Lampiran Triwulan?', body: '<p>' + esc(kel.map(kelNama).join(', ')) + ' · mulai ' + blnID(bulan) + '</p>', ok: 'Buat' })) return;
    busy('Membuat Lampiran Triwulan…');
    try {
      const r = await api('buatLampiran', { bulan, kelompok: kel });
      busy(false); if (S.tagihan) S.tagihan.lampiran = true;
      toast(r.message + ' Total ' + rp(r.totals[3]) + '.');
    } catch (e) { fail(e); }
  }

  async function pdfSheet(name) {
    busy('Membuat PDF ' + name + '…', 'Perubahan dikirim dulu ke spreadsheet. Perlu sinyal.');
    try {
      const r = await api('pdfSheet', { name });
      busy(false);
      sheet('<h2>PDF siap</h2><p>' + esc(r.name) + '<br><span class="small muted">Tersimpan di Drive, folder Arsip Tagihan Iuran Desa › PDF.</span></p><a class="btn p block" href="' + esc(r.url) + '" target="_blank" rel="noopener">Buka PDF</a><button class="btn block" data-close>Tutup</button>');
    } catch (e) { fail(e); }
  }

    el.innerHTML =
      '<div class="hero-total"><div class="l">Total tagihan · ' + esc(T.title) + '</div><div class="v">' + rp(T.totals.total) + '</div><div class="l">' + esc(T.kelompokNama) + ' · ' + num(T.totals.npp) + ' NPP · ' + num(T.totals.tk) + ' TK</div></div>' +
      (T.tanpaNpp ? '<div class="note warn">' + num(T.tanpaNpp) + ' peserta tidak ikut tagihan karena belum punya NPP.</div>' : '') +
      '<div class="btns"><button class="btn p" data-pdf="Tagihan">PDF Tagihan</button>' + (tri ? '<button class="btn" data-pdf="Lampiran Triwulan">PDF Lampiran</button>' : '<button class="btn" data-pdf="Trf Bank Jatim">PDF Trf Bank Jatim</button>') + '</div>' +
      (T.archive ? '<a class="btn ghost" href="' + esc(T.archive.fileUrl) + '" target="_blank" rel="noopener">Buka arsip: ' + esc(T.archive.fileName) + '</a>' : '<button class="btn ghost" id="t-ars">Simpan arsip .xlsx ke Drive</button>') +
      acc('Ringkasan', 'Normal ' + rp(T.totals.normal) + (T.totals.ker ? ' · keringanan −' + rp(T.totals.ker) : '') + ' · saldo −' + rp(T.totals.saldo),
        '<dl class="kv"><dt>Iuran normal</dt><dd>' + rp(T.totals.normal) + '</dd><dt>Keringanan</dt><dd>− ' + rp(T.totals.ker) + '</dd><dt>Saldo IJT</dt><dd>− ' + rp(T.totals.saldo) + '</dd><dt>Program 2P / 3P / 4P</dt><dd>' + T.program['2P'] + ' / ' + T.program['3P'] + ' / ' + T.program['4P'] + '</dd><dt>Peserta Bebas JP</dt><dd>' + T.bebasJP + '</dd>' +
        T.keringanan.map(k => '<dt>' + esc(k.nama) + '</dt><dd>− ' + rp(k.total) + '</dd>').join('') + '</dl>' + (tri ? '<p class="small muted">Jumlah TK memakai bulan terakhir triwulan.</p>' : '')) +
      T.groups.map((g, gi) => acc(esc(g.nama), num(g.rows.length) + ' NPP · ' + num(g.sub.tk) + ' TK · <b class="num" style="color:var(--ink)">' + rp(g.sub.total) + '</b>',
        g.rows.slice(0, 40).map((r, i) => '<button class="row" data-g="' + gi + '" data-i="' + i + '"><span class="m"><span class="t1" style="display:block">' + esc(r.desa) + ', ' + esc(r.kec) + '</span><span class="t2" style="display:block">NPP ' + esc(r.npp) + ' · ' + esc(r.program) + ' · ' + r.months[r.months.length - 1].tk + ' TK</span></span><b class="num">' + rp(r.total) + '</b></button>').join('') +
        (g.rows.length > 40 ? '<div class="empty">' + (g.rows.length - 40) + ' NPP lainnya ada di sheet Tagihan.</div>' : ''), { cls: 'flush', end: '<span class="b ' + (g.jenis === 'BPU' ? 'bpu' : 'pu') + '">' + g.jenis + '</span>' })).join('');
    $$('[data-pdf]', el).forEach(b => b.onclick = () => pdfSheet(b.dataset.pdf));
    const ars = $('#t-ars', el); if (ars) ars.onclick = () => arsipTagihan(true);
    $$('[data-g]', el).forEach(b => b.onclick = () => {
      const r = T.groups[+b.dataset.g].rows[+b.dataset.i];
      sheet('<h2>' + esc(r.nama) + '</h2><dl class="kv"><dt>NPP</dt><dd>' + esc(r.npp) + '</dd><dt>Program</dt><dd>' + esc(r.program) + '</dd></dl>' +

        r.months.map((m, i) => '<tr><td>' + lbl(i) + '</td><td>' + m.tk + (m.bjp ? ' <span class="b warn">' + m.bjp + ' bebas JP</span>' : '') + '</td><td>' + num(m.normal) + '</td><td>' + num(m.ker) + '</td><td>' + num(m.saldo) + '</td></tr>').join('') +

  function badges(p) {
    const out = [];
    if (p.status !== 'Aktif') out.push('<span class="b red">Nonaktif</span>');
    out.push('<span class="b ' + (p.jenis === 'BPU' ? 'bpu' : 'pu') + '">' + (p.jenis || 'PU') + ' ' + esc(p.program || '') + '</span>');
    if (p.bebasJP && p.status === 'Aktif') out.push('<span class="b warn">Bebas JP sejak ' + esc(blnID(p.bebasJP)) + '</span>');
    if (!p.npp && p.status === 'Aktif') out.push('<span class="b red">Belum ada NPP</span>');
    return '<div class="badges">' + out.join('') + '</div>';
  }

  async function vPeserta(v) {
    setTitle('Peserta');
    const f = LS.get('pf', { status: 'Aktif', kel: '', kec: '', desa: '', bebasJP: false });
    v.innerHTML = '<input type="search" id="p-q" placeholder="Cari nama atau NIK">' +
      acc('Filter', '<span id="p-fs"></span>',
        '<div class="seg" id="p-st">' + ['Semua', 'Aktif', 'Nonaktif'].map(s => '<button data-s="' + s + '" class="' + (f.status === s ? 'on' : '') + '">' + s + '</button>').join('') + '</div>' +
        '<select id="p-kel">' + opt(K().map(k => ({ v: k.kode, t: k.nama })), f.kel, 'Semua kelompok') + '</select>' +
        '<div class="row2"><select id="p-kec">' + opt(W().kecamatan, f.kec, 'Kecamatan') + '</select><select id="p-desa">' + opt(W().desa[f.kec] || [], f.desa, 'Desa') + '</select></div>' +
        '<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="p-bjp"' + (f.bebasJP ? ' checked' : '') + ' style="width:20px;height:20px;accent-color:var(--brand)"> Hanya yang Bebas JP</label>') +
      '<div class="sec" id="p-info">Memuat…</div><div class="card" id="p-list"></div>';
    let seq = 0;
    const read = () => ({ q: $('#p-q', v).value.trim(), status: $('#p-st .on', v).dataset.s, kel: $('#p-kel', v).value, kec: $('#p-kec', v).value, desa: $('#p-desa', v).value, bebasJP: $('#p-bjp', v).checked });
    const load = async () => {
      if (!$('#p-q', v) || !document.body.contains(v)) return; // tampilan sudah berganti
      const x = read();
      LS.set('pf', { status: x.status, kel: x.kel, kec: x.kec, desa: x.desa, bebasJP: x.bebasJP });
      $('#p-fs', v).textContent = [x.status, x.kel ? kelNama(x.kel) : 'semua kelompok', x.desa || x.kec || 'semua desa', x.bebasJP ? 'Bebas JP' : ''].filter(Boolean).join(' · ');
      if (x.q && x.q.length < 3) { $('#p-info', v).textContent = 'Ketik minimal 3 huruf/angka'; return; }
      const my = ++seq;
      try {
        const r = await api('cariPeserta', Object.assign({ limit: 150 }, x));
        if (my !== seq) return;
        $('#p-info', v).textContent = r.items.length ? r.items.length + (r.limited ? '+' : '') + ' peserta · terbaru di atas' : 'Tidak ada hasil';
        $('#p-list', v).innerHTML = r.items.map(p => '<button class="row" data-id="' + esc(p.id) + '"><span class="m"><span class="t1" style="display:block">' + esc(p.nama) + '</span><span class="t2" style="display:block">' + esc(p.nik) + ' · ' + esc(p.kelNama) + ' · ' + esc(p.desa) + '</span>' + badges(p) + '</span><span class="chev"></span></button>').join('') || '<div class="empty">Coba ubah kata kunci atau filter.</div>';
        $$('[data-id]', v).forEach(b => b.onclick = () => go('detail', { id: b.dataset.id }));
      } catch (e) { if (my === seq) $('#p-info', v).textContent = e.message; }
    };
    $('#p-q', v).oninput = debounce(load, 400);
    $$('#p-st button', v).forEach(b => b.onclick = () => { $$('#p-st button', v).forEach(x => x.classList.toggle('on', x === b)); load(); });
    $('#p-kel', v).onchange = load; $('#p-desa', v).onchange = load; $('#p-bjp', v).onchange = load;
    $('#p-kec', v).onchange = e => { $('#p-desa', v).innerHTML = opt(W().desa[e.target.value] || [], '', 'Desa'); load(); };
    load();
  }

  // ---------- Kelompok ----------
  function previewIuran(jenis, upah, jkk) {
    const t = S.boot.tarif;
    const r = (x) => Math.round(x);
    if (jenis === 'BPU') { const a = r(upah * t.BPU_JKK / 100) + r(t.BPU_JKM); return [['JKK + JKM', a], ['+ JHT', a + r(upah * t.BPU_JHT / 100)]]; }
    const p2 = r(upah * jkk / 100) + r(upah * t.PU_JKM / 100), p3 = p2 + r(upah * t.PU_JHT / 100);
    const dasar = S.boot.batasJP > 0 ? Math.min(upah, S.boot.batasJP) : upah;
    return [['2P', p2], ['3P', p3], ['4P', p3 + r(dasar * t.PU_JP / 100)]];
  }
